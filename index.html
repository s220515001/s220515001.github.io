<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>灵犀导航 · 完全体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 浅色模式（默认） */
        :root {
            --bg-start: #f5f7fc;
            --bg-end: #eef2fa;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1f2a44;
            --text-muted: #4a5568;
            --border-light: rgba(0, 0, 0, 0.06);
            --icon-bg: rgba(0, 0, 0, 0.04);
            --icon-hover: rgba(0, 0, 0, 0.12);
            --accent: #2c7be5;
        }

        body.dark {
            --bg-start: #0c1222;
            --bg-end: #0a0f1e;
            --glass-bg: rgba(18, 25, 45, 0.7);
            --card-bg: rgba(18, 25, 45, 0.7);
            --text-main: #eef2ff;
            --text-muted: #b9c7d9;
            --border-light: rgba(255, 255, 255, 0.1);
            --icon-bg: rgba(255, 255, 255, 0.08);
            --icon-hover: rgba(255, 255, 255, 0.2);
        }

        body {
            background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background 0.2s, color 0.2s;
            color: var(--text-main);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(66, 153, 225, 0.12), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem 2rem;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 0.5rem 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            stroke: var(--accent);
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #1e3c72);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .search-area {
            background: var(--icon-bg);
            border-radius: 40px;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 280px;
            position: relative;
        }

        .search-area input {
            background: transparent;
            border: none;
            padding: 0.6rem 0;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            color: var(--text-main);
        }

        .nav-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--icon-bg);
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--icon-hover);
            transform: scale(1.02);
        }

        /* 工具行 */
        .tools-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .tool-chip {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border-light);
            font-weight: 500;
        }

        .tool-chip:hover {
            transform: translateY(-3px);
            background: var(--card-bg);
        }

        /* 网格 */
        .sites-grid {
            display: grid;
            gap: 1.5rem;
            justify-content: center;
        }

        .grid-small { grid-template-columns: repeat(auto-fill, minmax(100px, 120px)); }
        .grid-medium { grid-template-columns: repeat(auto-fill, minmax(120px, 140px)); }
        .grid-large { grid-template-columns: repeat(auto-fill, minmax(140px, 160px)); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.25s;
            border: 1px solid var(--border-light);
            cursor: grab;
        }

        .card:active { cursor: grabbing; }
        .card:hover {
            transform: translateY(-6px);
            background: var(--glass-bg);
            border-color: var(--accent);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 28px;
            margin-bottom: 12px;
        }

        .icon-box img { width: 48px; height: 48px; border-radius: 16px; }
        .fallback {
            width: 48px; height: 48px; border-radius: 24px;
            background: linear-gradient(135deg, #4f6f8f, #2c3e66);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 24px;
            color: white;
        }
        .card-name {
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.04);
            padding: 4px 12px;
            border-radius: 40px;
        }
        body.dark .card-name { background: rgba(0, 0, 0, 0.35); }
        .icon-only .card-name { display: none; }

        /* 游戏卡片特殊样式 */
        .game-card {
            background: linear-gradient(145deg, rgba(40, 90, 55, 0.8), rgba(30, 70, 45, 0.85));
            border-color: #6bff8e;
        }
        body.dark .game-card {
            background: linear-gradient(145deg, #1a3a2a, #0f2a1e);
        }

        /* 抽屉菜单 */
        .drawer {
            position: fixed;
            top: 0;
            left: -380px;
            width: 340px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            z-index: 3000;
            transition: left 0.3s;
            border-right: 1px solid var(--border-light);
            padding: 1.8rem;
            overflow-y: auto;
        }
        .drawer.open { left: 0; }
        .drawer-header { display: flex; justify-content: space-between; margin-bottom: 2rem; font-weight: 700; font-size: 1.3rem; }
        .drawer-section { margin-bottom: 1.8rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1rem; }
        .btn-sm {
            background: var(--icon-bg);
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-main);
        }
        .btn-sm.primary { background: var(--accent); color: white; }
        .bookmark-item, .recent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.6rem 0;
            background: rgba(0, 0, 0, 0.03);
            padding: 8px 12px;
            border-radius: 40px;
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            width: 90%;
            max-width: 560px;
            padding: 1.8rem;
            border: 1px solid var(--border-light);
            max-height: 85vh;
            overflow-y: auto;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2a3e;
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 24px;
            border-radius: 60px;
            z-index: 5000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
        .ctx-menu {
            position: fixed;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 8px 0;
            z-index: 6000;
            min-width: 160px;
        }
        .ctx-item { padding: 8px 20px; cursor: pointer; }
        .ctx-item:hover { background: var(--icon-hover); }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            margin-top: 8px;
            padding: 8px 0;
            z-index: 100;
            border: 1px solid var(--border-light);
        }
        .suggestion { padding: 8px 16px; cursor: pointer; font-size: 0.85rem; }
        .suggestion:hover { background: var(--icon-hover); }
        @media (max-width: 640px) { .search-area { width: 160px; } .drawer { width: 280px; } }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="logo" id="logoRefresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-width="1.5"/><path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke-width="1.5"/></svg>
            <span>灵犀导航</span>
        </div>
        <div class="search-area">
            <input type="text" id="mainSearch" placeholder="搜索或输入网址">
            <span id="voiceBtn" style="cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 1C9.79 1 8 2.79 8 5v4c0 2.21 1.79 4 4 4s4-1.79 4-4V5c0-2.21-1.79-4-4-4zM6 11c0 3.31 2.69 6 6 6s6-2.69 6-6" stroke-width="1.6"/><path d="M20 11v1c0 4.42-3.58 8-8 8s-8-3.58-8-8v-1"/></svg></span>
            <div id="suggestionBox" class="suggestions" style="display:none;"></div>
        </div>
        <div class="nav-icons">
            <div class="icon-btn" id="drawerToggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12h18M3 6h18M3 18h18" stroke-width="1.8"/></svg></div>
            <div class="icon-btn" id="themeToggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></div>
            <div class="icon-btn" id="settingsBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/></svg></div>
        </div>
    </div>

    <div class="tools-strip" id="toolsStrip"></div>
    <div class="sites-grid" id="sitesGrid"></div>
</div>

<!-- 侧边抽屉菜单 -->
<div class="drawer" id="drawerMenu">
    <div class="drawer-header"><span>快捷中心</span><span id="closeDrawer" style="cursor:pointer;">✕</span></div>
    <div class="drawer-section"><div>🔎 搜索引擎</div><div id="engineList" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
    <div class="drawer-section"><div>📌 书签收藏 <button class="btn-sm" id="addBookmark">+ 添加</button></div><div id="bookmarkList"></div><div style="display:flex;gap:8px;margin-top:10px;"><button class="btn-sm" id="exportBookmarks">导出</button><button class="btn-sm" id="importBookmarks">导入</button><input type="file" id="importFile" style="display:none" accept=".json"></div></div>
    <div class="drawer-section"><div>🕒 最近访问</div><div id="recentList"></div><button class="btn-sm" id="clearRecent">清空</button></div>
    <div class="drawer-section"><div>📋 搜索历史</div><div id="searchHistoryList"></div></div>
</div>

<!-- 设置面板 -->
<div class="modal" id="settingsModal"><div class="modal-box"><h3 style="margin-bottom:1rem;">个性化设置</h3>
    <label>网格列数：</label><select id="gridSize"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select><br><br>
    <label>卡片尺寸：</label><select id="cardSize"><option value="compact">紧凑</option><option value="comfort" selected>舒适</option><option value="loose">宽松</option></select><br><br>
    <label>主题：</label><select id="themeSelect"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select><br><br>
    <label>显示网站名：</label><input type="checkbox" id="showName" checked><br><br>
    <label>图标模式：</label><select id="iconMode"><option value="both">图标+文字</option><option value="icon">仅图标</option></select><br><br>
    <button class="btn-sm primary" id="saveSettings">保存</button></div></div>

<!-- 工具模态框动态内容 -->
<div class="modal" id="toolModal"><div class="modal-box" id="toolModalContent"></div></div>

<script>
    // ---------- 网站数据（包含游戏入口）----------
    let defaultSites = [
        { id: "s1", name: "抖音", url: "https://www.douyin.com", domain: "douyin.com" },
        { id: "s2", name: "B站", url: "https://www.bilibili.com", domain: "bilibili.com" },
        { id: "s3", name: "快手", url: "https://www.kuaishou.com", domain: "kuaishou.com" },
        { id: "s4", name: "豆包", url: "https://www.doubao.com", domain: "doubao.com" },
        { id: "s5", name: "百度AI", url: "https://chat.baidu.com", domain: "chat.baidu.com" },
        { id: "game1", name: "鱼吃鱼", url: "FEF.html", domain: "", isGame: true, special: true }
    ];
    let userBookmarks = [];
    let currentCards = [];
    let recentSites = [];
    let searchHistory = [];
    let currentEngine = { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" };
    const engines = [
        { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
        { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" },
        { id: "baidu", name: "百度", url: "https://www.baidu.com/s?wd=" }
    ];
    let settings = { gridCols: "medium", cardSize: "comfort", theme: "light", showName: true, iconMode: "both" };

    // 存储
    function saveAll() {
        localStorage.setItem("lx_bookmarks", JSON.stringify(userBookmarks));
        localStorage.setItem("lx_order", JSON.stringify(currentCards.map(c => c.id)));
        localStorage.setItem("lx_recent", JSON.stringify(recentSites));
        localStorage.setItem("lx_history", JSON.stringify(searchHistory));
        localStorage.setItem("lx_settings", JSON.stringify(settings));
        localStorage.setItem("lx_engine", JSON.stringify(currentEngine));
    }
    function loadData() {
        let b = localStorage.getItem("lx_bookmarks"); if(b) userBookmarks = JSON.parse(b);
        let ord = localStorage.getItem("lx_order");
        let rec = localStorage.getItem("lx_recent"); if(rec) recentSites = JSON.parse(rec);
        let hist = localStorage.getItem("lx_history"); if(hist) searchHistory = JSON.parse(hist);
        let set = localStorage.getItem("lx_settings"); if(set) settings = JSON.parse(set);
        let eng = localStorage.getItem("lx_engine"); if(eng) currentEngine = JSON.parse(eng);
        let all = [...defaultSites.map(s=>({...s, isBookmark:false})), ...userBookmarks.map(b=>({...b, isBookmark:true, domain:b.url}))];
        if(ord && ord.length) {
            let ordered = [];
            ord.forEach(id => { let f = all.find(i=>i.id==id); if(f) ordered.push(f); });
            all.forEach(i => { if(!ordered.find(o=>o.id==i.id)) ordered.push(i); });
            currentCards = ordered;
        } else currentCards = all;
    }
    function addRecent(url, name) {
        recentSites = recentSites.filter(r=>r.url!==url);
        recentSites.unshift({ url, name, time: Date.now() });
        if(recentSites.length > 8) recentSites.pop();
        saveAll(); renderRecent();
    }
    function addSearchHistory(word) { if(!word.trim()) return; searchHistory = searchHistory.filter(w=>w!==word); searchHistory.unshift(word); if(searchHistory.length>10) searchHistory.pop(); saveAll(); renderSearchHistory(); }
    function toast(msg) { let t = document.getElementById("toastMsg"); if(!t){ let d=document.createElement('div'); d.id='toastMsg'; d.className='toast'; document.body.appendChild(d); t=d; } t.innerText=msg; t.style.opacity=1; setTimeout(()=>t.style.opacity=0, 1800); }

    // 渲染网格
    function renderGrid() {
        const grid = document.getElementById('sitesGrid');
        grid.className = `sites-grid grid-${settings.gridCols}`;
        grid.innerHTML = '';
        currentCards.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            let sizeClass = settings.cardSize === 'compact' ? 'compact-card' : (settings.cardSize === 'comfort' ? '' : 'comfort-card');
            cardDiv.className = `card ${sizeClass} ${card.isGame ? 'game-card' : ''}`;
            if(settings.iconMode === 'icon') cardDiv.classList.add('icon-only');
            cardDiv.draggable = true;
            let iconUrl = card.domain ? `https://api.iowen.cn/favicon/${card.domain}` : '';
            let firstChar = card.name.charAt(0);
            cardDiv.innerHTML = `
                <div class="icon-box"><img src="${iconUrl}" onerror="this.style.display='none'; this.nextSibling.style.display='flex';" style="display:block;"><div class="fallback" style="display:none;">${firstChar}</div></div>
                ${settings.showName ? `<div class="card-name">${card.name}</div>` : ''}
            `;
            cardDiv.addEventListener('click', (e) => { e.stopPropagation(); window.open(card.url, '_blank'); addRecent(card.url, card.name); });
            cardDiv.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', idx); });
            cardDiv.addEventListener('dragover', (e) => e.preventDefault());
            cardDiv.addEventListener('drop', (e) => { e.preventDefault(); let src = parseInt(e.dataTransfer.getData('text/plain')); if(src !== idx) { let moved = currentCards[src]; currentCards.splice(src,1); currentCards.splice(idx,0,moved); saveAll(); renderGrid(); } });
            cardDiv.addEventListener('contextmenu', (e) => { e.preventDefault(); showContextMenu(card, idx, e.clientX, e.clientY); });
            grid.appendChild(cardDiv);
        });
    }
    function showContextMenu(card, idx, x, y) {
        let old = document.getElementById('ctxMenu'); if(old) old.remove();
        let menu = document.createElement('div'); menu.id='ctxMenu'; menu.className='ctx-menu'; menu.style.left=x+'px'; menu.style.top=y+'px';
        menu.innerHTML = `<div class="ctx-item" data-act="open">打开</div><div class="ctx-item" data-act="newtab">新标签页打开</div><div class="ctx-item" data-act="edit">编辑名称</div><div class="ctx-item" data-act="delete">删除</div><div class="ctx-item" data-act="bookmark">添加到书签</div>`;
        document.body.appendChild(menu);
        menu.querySelectorAll('.ctx-item').forEach(item => {
            item.addEventListener('click', () => {
                let act = item.dataset.act;
                if(act === 'open') window.open(card.url);
                if(act === 'newtab') window.open(card.url, '_blank');
                if(act === 'edit') { let newName = prompt('新名称', card.name); if(newName) { card.name = newName; saveAll(); renderGrid(); } }
                if(act === 'delete') { if(card.isBookmark) { userBookmarks = userBookmarks.filter(b=>b.id!==card.id); loadData(); renderGrid(); saveAll(); renderBookmarks(); } else toast("默认站点不可删除"); }
                if(act === 'bookmark') { if(!userBookmarks.find(b=>b.url===card.url)) { let newId = Date.now()+''+Math.random(); userBookmarks.push({id:newId, name:card.name, url:card.url}); loadData(); renderGrid(); saveAll(); renderBookmarks(); toast("已添加书签"); } else toast("已在书签中"); }
                menu.remove();
            });
        });
        setTimeout(()=> { if(menu) menu.remove(); }, 4000);
    }

    function renderBookmarks() { let cont = document.getElementById('bookmarkList'); if(!cont) return; cont.innerHTML = userBookmarks.map(b=>`<div class="bookmark-item"><span>${b.name}</span><div><button class="btn-sm" data-url="${b.url}">打开</button><button class="btn-sm" data-del="${b.id}" style="background:#c2410c;">删</button></div></div>`).join('') || '<div>暂无书签</div>'; document.querySelectorAll('[data-url]').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.url))); document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',()=>{ userBookmarks = userBookmarks.filter(b=>b.id!=btn.dataset.del); loadData(); renderGrid(); renderBookmarks(); saveAll(); toast("已删除"); })); }
    function renderRecent() { let cont = document.getElementById('recentList'); cont.innerHTML = recentSites.map(r=>`<div class="recent-item"><span>${r.name}</span><button class="btn-sm" data-rurl="${r.url}">打开</button></div>`).join('') || '暂无'; document.querySelectorAll('[data-rurl]').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.rurl))); }
    function renderSearchHistory() { let cont = document.getElementById('searchHistoryList'); cont.innerHTML = searchHistory.map(h=>`<div style="cursor:pointer;margin:6px 0;" class="hist-word">${h}</div>`).join(''); document.querySelectorAll('.hist-word').forEach(el=>el.addEventListener('click',()=>{ document.getElementById('mainSearch').value = el.innerText; performSearch(); })); }
    function renderEngineList() { let div = document.getElementById('engineList'); div.innerHTML = ''; engines.forEach(e=>{ let btn = document.createElement('button'); btn.className = `btn-sm ${currentEngine.id===e.id?'primary':''}`; btn.innerText=e.name; btn.onclick=()=>{ currentEngine=e; saveAll(); renderEngineList(); toast(`引擎: ${e.name}`); }; div.appendChild(btn); }); }
    function performSearch() { let q = document.getElementById('mainSearch').value.trim(); if(!q) return; addSearchHistory(q); window.open(currentEngine.url+encodeURIComponent(q), '_blank'); }

    // 搜索建议 (百度)
    async function fetchSuggestions(keyword) { if(!keyword) { document.getElementById('suggestionBox').style.display='none'; return; } try { let res = await fetch(`https://suggestion.baidu.com/su?wd=${encodeURIComponent(keyword)}&p=3&cb=jsonp`); let text = await res.text(); let jsonStr = text.match(/window\.baidu\.sug\(({.*})\)/); if(jsonStr) { let data = JSON.parse(jsonStr[1]); let suggDiv = document.getElementById('suggestionBox'); suggDiv.innerHTML = data.s.map(s=>`<div class="suggestion">${s}</div>`).join(''); suggDiv.style.display='block'; document.querySelectorAll('.suggestion').forEach(el=>el.addEventListener('click',()=>{ document.getElementById('mainSearch').value=el.innerText; performSearch(); suggDiv.style.display='none'; })); } else suggDiv.style.display='none'; } catch(e){ document.getElementById('suggestionBox').style.display='none'; } }

    // 工具集 (完整版，包含日历/天气/计算器/单位/待办/翻译/二维码/密码)
    const tools = [
        {id:"calendar", name:"日历", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>`, render:(c)=>{ c.innerHTML = `<div id="calContainer"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button><script>let d=new Date();function buildCal(y,m){let first=new Date(y,m,1).getDay();let days=new Date(y,m+1,0).getDate();let html='<table style="width:100%"><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr><tr>';for(let i=0;i<first;i++)html+='<td></td>';for(let i=1;i<=days;i++){html+='<td>'+i+'</td>';if((first+i)%7==0)html+='</tr><tr>';}html+='</tr></table>';document.getElementById('calContainer').innerHTML=html;};buildCal(d.getFullYear(),d.getMonth());<\/script>` } },
        {id:"weather", name:"天气", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v1M5.6 6.6l.7.7M3 12h1M20 12h1M17.7 6.6l-.7.7M12 20v1M8 16h8"/><circle cx="12" cy="12" r="3"/></svg>`, render:(c)=>{ c.innerHTML = `<div><input id="weatherCity" placeholder="城市拼音, beijing"><button id="getWeather">查询</button><div id="weatherRes"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button></div><script>document.getElementById('getWeather').onclick=async()=>{let city=document.getElementById('weatherCity').value;if(!city) return;let geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+city+'&count=1');let geoData=await geo.json();if(geoData.results){let lat=geoData.results[0].latitude,lon=geoData.results[0].longitude;let w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true');let wd=await w.json();document.getElementById('weatherRes').innerHTML='🌡️ '+wd.current_weather.temperature+'°C 风速 '+wd.current_weather.windspeed+'km/h';}else document.getElementById('weatherRes').innerHTML='未找到城市';};<\/script>` } },
        {id:"calc", name:"计算器", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>`, render:(c)=>c.innerHTML=`<div><input id="calcExpr" placeholder="表达式"><button onclick="document.getElementById('calcOut').innerText=eval(document.getElementById('calcExpr').value)">=</button><div id="calcOut"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button></div>` },
        {id:"unit", name:"单位换算", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3L19 21M19 3L5 21"/></svg>`, render:(c)=>c.innerHTML=`<div><select id="unitType"><option value="length">长度(米→英尺)</option><option value="weight">重量(千克→磅)</option><option value="temp">温度(°C→°F)</option></select><input id="unitVal"><button onclick="let t=document.getElementById('unitType').value;let v=parseFloat(document.getElementById('unitVal').value);if(t==='length') document.getElementById('unitOut').innerText=v+'米 = '+(v*3.28084).toFixed(2)+'英尺';else if(t==='weight') document.getElementById('unitOut').innerText=v+'千克 = '+(v*2.20462).toFixed(2)+'磅';else document.getElementById('unitOut').innerText=v+'°C = '+((v*9/5)+32).toFixed(2)+'°F';">转换</button><div id="unitOut"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button></div>` },
        {id:"todo", name:"待办", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`, render:(c)=>{ let stored=localStorage.getItem('lx_todos')||'[]'; let todos=JSON.parse(stored); c.innerHTML=`<div><ul id="todoUl"></ul><input id="todoText"><button id="addTodo">添加</button><button class="btn-sm" onclick="closeToolModal()">关闭</button></div><script>function renderTodo(){let ul=document.getElementById('todoUl');let stored=localStorage.getItem('lx_todos')||'[]';let items=JSON.parse(stored);ul.innerHTML=items.map((t,i)=>'<li><input type="checkbox" '+(t.done?'checked':'')+' data-idx='+i+'> '+t.text+' <button data-del='+i+'>删除</button></li>').join('');document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{let idx=btn.dataset.del;items.splice(idx,1);localStorage.setItem('lx_todos',JSON.stringify(items));renderTodo();});document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=function(){let idx=this.dataset.idx;items[idx].done=this.checked;localStorage.setItem('lx_todos',JSON.stringify(items));});}document.getElementById('addTodo').onclick=()=>{let text=document.getElementById('todoText').value;if(text){let items=JSON.parse(localStorage.getItem('lx_todos')||'[]');items.push({text,done:false});localStorage.setItem('lx_todos',JSON.stringify(items));renderTodo();}};renderTodo();<\/script>` } },
        {id:"translate", name:"翻译", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 8h14M12 8v11M9 15l3 3 3-3"/></svg>`, render:(c)=>c.innerHTML=`<div><textarea id="transSrc" rows="2"></textarea><select id="transLang"><option value="en">英语</option><option value="zh">中文</option></select><button id="doTrans">翻译</button><div id="transOut"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button></div><script>document.getElementById('doTrans').onclick=async()=>{let txt=document.getElementById('transSrc').value;let lang=document.getElementById('transLang').value;let res=await fetch('https://libretranslate.de/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:txt,source:'auto',target:lang,format:'text'})});let data=await res.json();document.getElementById('transOut').innerText=data.translatedText;};<\/script>` },
        {id:"qrcode", name:"二维码", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h6v6h-6z"/></svg>`, render:(c)=>c.innerHTML=`<div><input id="qrText" placeholder="文本/链接"><button onclick="document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(document.getElementById('qrText').value)">生成</button><br><img id="qrImg"><button class="btn-sm" onclick="closeToolModal()">关闭</button></div>` },
        {id:"pwd", name:"密码生成", svg:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82"/></svg>`, render:(c)=>c.innerHTML=`<div><label>长度 <input id="pwdLen" value="12" type="number"></label><label><input type="checkbox" id="useNum" checked> 数字</label><label><input type="checkbox" id="useSym" checked> 符号</label><button id="genPwd">生成</button><div id="pwdResult"></div><button class="btn-sm" onclick="closeToolModal()">关闭</button></div><script>document.getElementById('genPwd').onclick=()=>{let len=parseInt(document.getElementById('pwdLen').value);let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';if(document.getElementById('useNum').checked) chars+='0123456789';if(document.getElementById('useSym').checked) chars+='!@#$%^&*';let pwd='';for(let i=0;i<len;i++) pwd+=chars[Math.floor(Math.random()*chars.length)];document.getElementById('pwdResult').innerText=pwd;};<\/script>` }
    ];
    function renderTools() { let cont = document.getElementById('toolsStrip'); cont.innerHTML = tools.map(t => `<div class="tool-chip" data-tool="${t.id}">${t.svg} ${t.name}</div>`).join(''); document.querySelectorAll('.tool-chip').forEach(el=>el.addEventListener('click',()=>{ let tool = tools.find(t=>t.id===el.dataset.tool); let modal = document.getElementById('toolModal'); let content = document.getElementById('toolModalContent'); tool.render(content); modal.classList.add('active'); window.closeToolModal = ()=> modal.classList.remove('active'); })); }

    // 主题初始化
    function initTheme() { let isLight = settings.theme === 'light' || (settings.theme === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches); if(isLight) document.body.classList.remove('dark'); else document.body.classList.add('dark'); }

    // 事件绑定与启动
    function init() {
        loadData(); renderTools(); renderGrid(); renderBookmarks(); renderRecent(); renderSearchHistory(); renderEngineList(); initTheme(); saveAll();
        document.getElementById('drawerToggle').onclick = ()=>document.getElementById('drawerMenu').classList.add('open');
        document.getElementById('closeDrawer').onclick = ()=>document.getElementById('drawerMenu').classList.remove('open');
        document.getElementById('settingsBtn').onclick = ()=>document.getElementById('settingsModal').classList.add('active');
        document.getElementById('saveSettings').onclick = () => { settings.gridCols = document.getElementById('gridSize').value; settings.cardSize = document.getElementById('cardSize').value; settings.showName = document.getElementById('showName').checked; settings.iconMode = document.getElementById('iconMode').value; settings.theme = document.getElementById('themeSelect').value; initTheme(); saveAll(); renderGrid(); document.getElementById('settingsModal').classList.remove('active'); toast("设置已保存"); };
        document.getElementById('themeToggle').onclick = () => { document.body.classList.toggle('dark'); settings.theme = document.body.classList.contains('dark')?'dark':'light'; saveAll(); };
        document.getElementById('mainSearch').addEventListener('keypress', e=>{ if(e.key==='Enter') performSearch(); });
        document.getElementById('mainSearch').addEventListener('input', (e)=>fetchSuggestions(e.target.value));
        document.getElementById('voiceBtn').addEventListener('click',()=>{ let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if(SpeechRecognition){ let rec = new SpeechRecognition(); rec.lang='zh-CN'; rec.start(); rec.onresult=(e)=>{ document.getElementById('mainSearch').value=e.results[0][0].transcript; performSearch(); }; } else toast("不支持语音"); });
        document.getElementById('addBookmark').onclick = () => { let name=prompt("网站名"); let url=prompt("网址"); if(name&&url){ let id=Date.now()+''; userBookmarks.push({id,name,url}); loadData(); renderGrid(); renderBookmarks(); saveAll(); toast("书签已加"); } };
        document.getElementById('exportBookmarks').onclick = ()=>{ let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(userBookmarks)],{type:'application/json'})); a.download='bookmarks.json'; a.click(); };
        document.getElementById('importBookmarks').onclick = ()=>document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = (e)=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=ev=>{ let imported=JSON.parse(ev.target.result); userBookmarks.push(...imported); loadData(); renderGrid(); renderBookmarks(); saveAll(); toast("导入完成"); }; reader.readAsText(file); };
        document.getElementById('clearRecent').onclick = ()=>{ recentSites=[]; saveAll(); renderRecent(); };
        document.getElementById('logoRefresh').onclick = ()=>location.reload();
        window.addEventListener('keydown', (e)=>{ if(e.key === '/' || (e.ctrlKey && e.key==='k')){ e.preventDefault(); document.getElementById('mainSearch').focus(); } if(e.key === 'Escape'){ document.querySelectorAll('.modal.active').forEach(m=>m.classList.remove('active')); document.getElementById('drawerMenu').classList.remove('open'); } });
        toast("灵犀导航 · 完整版 | 游戏/工具/书签/拖拽/右键");
    }
    init();
</script>
</body>
</html>
