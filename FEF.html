        ctx.moveTo(bl * 0.72, 0);
        ctx.quadraticCurveTo(bl * 0.4, -bh * 0.65, -bl * 0.2, -bh * 0.5);
        ctx.quadraticCurveTo(-bl * 0.5, -bh * 0.15, -bl * 0.42, 0);
        ctx.quadraticCurveTo(-bl * 0.5, bh * 0.15, -bl * 0.2, bh * 0.5);
        ctx.quadraticCurveTo(bl * 0.4, bh * 0.65, bl * 0.72, 0);
        ctx.closePath();
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = r * 0.1;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(bl * 0.25, -bh * 0.2, r * 0.14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(bl * 0.28, -bh * 0.2, r * 0.07, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bl * 0.55, -bh * 0.1);
        ctx.lineTo(bl * 0.85, -bh * 0.55);
        ctx.lineTo(bl * 0.85, bh * 0.55);
        ctx.lineTo(bl * 0.55, bh * 0.1);
        ctx.closePath();
        ctx.fillStyle = '#225588';
        ctx.fill();
    }

    function drawSharkShape(bl, bh, r) {
        const g = ctx.createLinearGradient(0, -bh, 0, bh);
        g.addColorStop(0, '#778899');
        g.addColorStop(0.4, '#9aabbc');
        g.addColorStop(0.8, '#c0d0e0');
        g.addColorStop(1, '#e8ecf0');
        ctx.beginPath();
        ctx.moveTo(bl * 0.7, 0);
        ctx.quadraticCurveTo(bl * 0.45, -bh * 0.75, -bl * 0.2, -bh * 0.55);
        ctx.quadraticCurveTo(-bl * 0.5, -bh * 0.25, -bl * 0.5, 0);
        ctx.quadraticCurveTo(-bl * 0.5, bh * 0.3, -bl * 0.2, bh * 0.55);
        ctx.quadraticCurveTo(bl * 0.45, bh * 0.75, bl * 0.7, 0);
        ctx.closePath();
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = r * 0.1;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bl * 0.08, -bh * 0.5);
        ctx.lineTo(bl * 0.02, -bh * 1.25);
        ctx.lineTo(-bl * 0.2, -bh * 0.5);
        ctx.closePath();
        ctx.fillStyle = '#667788';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-bl * 0.2, -bh * 0.2, r * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-bl * 0.17, -bh * 0.2, r * 0.08, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bl * 0.6, -bh * 0.1);
        ctx.lineTo(bl * 0.9, -bh * 0.5);
        ctx.lineTo(bl * 0.9, bh * 0.5);
        ctx.lineTo(bl * 0.6, bh * 0.1);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fill();
    }

    function drawWhaleShape(bl, bh, r) {
        ctx.beginPath();
        ctx.moveTo(bl * 0.65, -bh * 0.15);
        ctx.bezierCurveTo(bl * 0.9, -bh * 0.5, bl * 0.5, -bh * 0.85, -bl * 0.15, -bh * 0.7);
        ctx.lineTo(-bl * 0.45, -bh * 0.25);
        ctx.lineTo(-bl * 0.55, -bh * 0.05);
        ctx.quadraticCurveTo(-bl * 0.6, bh * 0.2, -bl * 0.4, bh * 0.5);
        ctx.quadraticCurveTo(-bl * 0.1, bh * 0.65, bl * 0.5, bh * 0.5);
        ctx.quadraticCurveTo(bl * 0.85, bh * 0.25, bl * 0.65, -bh * 0.15);
        ctx.closePath();
        const g = ctx.createLinearGradient(-bl * 0.5, 0, bl * 0.6, 0);
        g.addColorStop(0, '#1e3045');
        g.addColorStop(0.4, '#2c4058');
        g.addColorStop(0.7, '#3d5570');
        g.addColorStop(1, '#2a3c50');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = r * 0.12;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-bl * 0.05, -bh * 0.3, r * 0.16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(-bl * 0.02, -bh * 0.3, r * 0.08, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bl * 0.6, -bh * 0.2);
        ctx.quadraticCurveTo(bl * 1.15, -bh * 1.0, bl * 1.05, -bh * 1.15);
        ctx.quadraticCurveTo(bl * 0.8, -bh * 0.3, bl * 0.65, 0);
        ctx.quadraticCurveTo(bl * 0.8, bh * 0.35, bl * 1.05, bh * 1.2);
        ctx.quadraticCurveTo(bl * 1.15, bh * 1.05, bl * 0.6, bh * 0.2);
        ctx.closePath();
        ctx.fillStyle = '#1e3045';
        ctx.fill();
    }

    function drawBoss() {
        const boss = world.boss;
        if (!boss) return;
        const sx = boss.x - camera.x, sy = boss.y - camera.y;
        ctx.save();

        // 光环
        const haloAlpha = 0.25 + 0.1 * Math.sin(State.gameTime * 3);
        ctx.globalAlpha = haloAlpha;
        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(sx, sy, boss.radius + 12, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(sx, sy, boss.radius + 22, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,60,60,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 拖尾
        for (const t of boss.trail) {
            const tx = t.x - camera.x, ty = t.y - camera.y;
            ctx.globalAlpha = (t.life / t.maxLife) * 0.35;
            ctx.fillStyle = boss.type === 'megalodon' ? '#556677' : '#883344';
            ctx.beginPath();
            ctx.arc(tx, ty, boss.radius * 0.7, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.translate(sx, sy);
        ctx.rotate(boss.angle);
        const r = boss.radius, bl = r * 2.6, bh = r * 1.6;

        if (boss.type === 'megalodon') {
            const g = ctx.createLinearGradient(0, -bh, 0, bh);
            g.addColorStop(0, '#3a4a5a');
            g.addColorStop(0.4, '#5a6a7a');
            g.addColorStop(0.8, '#8a9aaa');
            g.addColorStop(1, '#c0d0e0');
            ctx.beginPath();
            ctx.moveTo(bl * 0.72, 0);
            ctx.quadraticCurveTo(bl * 0.45, -bh * 0.78, -bl * 0.22, -bh * 0.55);
            ctx.quadraticCurveTo(-bl * 0.55, -bh * 0.25, -bl * 0.52, 0);
            ctx.quadraticCurveTo(-bl * 0.55, bh * 0.32, -bl * 0.22, bh * 0.55);
            ctx.quadraticCurveTo(bl * 0.45, bh * 0.78, bl * 0.72, 0);
            ctx.closePath();
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = r * 0.14;
            ctx.stroke();
            // 背鳍
            ctx.beginPath();
            ctx.moveTo(bl * 0.1, -bh * 0.52);
            for (let i = 0; i <= 5; i++) {
                const tx = bl * 0.1 - i * (bl * 0.25 / 5);
                const ty = -bh * 0.52 - (i % 2 === 0 ? bh * 0.7 : bh * 0.45);
                ctx.lineTo(tx, ty);
            }
            ctx.lineTo(-bl * 0.15, -bh * 0.5);
            ctx.closePath();
            ctx.fillStyle = '#2a3a4a';
            ctx.fill();
            // 红眼
            ctx.fillStyle = '#ff4444';
            ctx.beginPath(); ctx.arc(-bl * 0.18, -bh * 0.22, r * 0.17, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(-bl * 0.15, -bh * 0.22, r * 0.09, 0, Math.PI * 2); ctx.fill();
        } else {
            const g = ctx.createRadialGradient(0, 0, bh * 0.2, 0, 0, bh * 1.1);
            g.addColorStop(0, '#cc4455');
            g.addColorStop(0.5, '#992233');
            g.addColorStop(1, '#551122');
            ctx.beginPath();
            ctx.ellipse(0, 0, bl * 0.5, bh * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,100,100,0.4)';
            ctx.lineWidth = r * 0.12;
            ctx.stroke();
            // 触手
            for (let i = 0; i < 8; i++) {
                const phase = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(phase) * bl * 0.4, bh * 0.55);
                let tx = Math.cos(phase) * bl * 0.4, ty = bh * 0.55;
                for (let s = 1; s <= 6; s++) {
                    const frac = s / 6;
                    const wave = Math.sin(State.gameTime * (2.5 + i * 0.3) + phase + s * 1.2) * (15 + i * 4) * frac;
                    tx = Math.cos(phase + wave * 0.03) * (bl * 0.4 + frac * bl * 0.9);
                    ty = bh * 0.55 + frac * bh * 1.1;
                    ctx.lineTo(tx, ty);
                }
                ctx.strokeStyle = 'rgba(' + (180 + i * 8) + ',' + (40 + i * 5) + ',' + (60 + i * 6) + ',0.85)';
                ctx.lineWidth = r * 0.15 * (1 - i * 0.07);
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            ctx.fillStyle = '#ffdd00';
            ctx.beginPath(); ctx.arc(bl * 0.2, -bh * 0.28, r * 0.18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(bl * 0.22, -bh * 0.28, r * 0.1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        // 血条
        const barW = boss.radius * 2.2, barH = 8;
        const barX = sx - barW / 2, barY = sy - boss.radius - 28;
        const ratio = Math.max(0, boss.power / boss.maxPower);
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        ctx.fillStyle = '#881111';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = ratio > 0.3 ? '#4dff88' : '#ff4d6a';
        ctx.fillRect(barX, barY, barW * ratio, barH);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(boss.type === 'megalodon' ? '巨齿鲨' : '大王乌贼', sx, barY - 6);
    }

    function drawAILabel(f, sx, sy) {
        const c = f.power < player.power * 0.95 ? '#4dff88' : f.power > player.power * 1.05 ? '#ff4d6a' : '#ffb347';
        const text = Math.round(f.displayPower).toString();
        ctx.font = 'bold 12px sans-serif';
        const tw = ctx.measureText(text).width;
        const px = sx - tw / 2 - 6, py = sy - f.radius - 24;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(px, py, tw + 12, 18, 6);
        else {
            ctx.rect(px, py, tw + 12, 18);
        }
        ctx.fill();
        ctx.strokeStyle = c;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = c;
        ctx.textAlign = 'center';
        ctx.fillText(text, sx, py + 13);
    }

    function drawPlayer() {
        const psx = player.x - camera.x;
        const psy = player.y - camera.y;
        // 拖尾
        for (const t of player.trail) {
            const tx = t.x - camera.x, ty = t.y - camera.y;
            ctx.globalAlpha = (t.life / t.maxLife) * 0.4;
            ctx.fillStyle = getStageByPower(player.power).stage.color;
            ctx.beginPath();
            ctx.arc(tx, ty, player.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        // 本体
        const shakeX = State.screenShakeTimer > 0 ? (Math.random() - 0.5) * 14 : 0;
        const shakeY = State.screenShakeTimer > 0 ? (Math.random() - 0.5) * 14 : 0;
        drawFishBody(psx + shakeX, psy + shakeY, player.radius, player.angle, getStageByPower(player.power), true, player.invincibleTimer, player.glowTimer);

        // 90+ 顶冠
        if (player.power >= 90) {
            ctx.font = '24px sans-serif';
            ctx.fillStyle = '#f0c060';
            ctx.textAlign = 'center';
            ctx.fillText('*', psx, psy - player.radius - 26);
        }
    }

    function drawParticles() {
        for (const p of world.particles) {
            const px = p.x - camera.x, py = p.y - camera.y;
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(px, py, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawFloatingTexts() {
        for (const ft of world.floatingTexts) {
            const sx = ft.x - camera.x, sy = ft.y - camera.y;
            ctx.globalAlpha = ft.life / ft.maxLife;
            ctx.fillStyle = ft.color;
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, sx, sy);
        }
        ctx.globalAlpha = 1;
    }

    function drawOverlays() {
        // 白闪
        if (State.screenFlash > 0) {
            ctx.fillStyle = 'rgba(255,255,255,' + (State.screenFlash * 2.5) + ')';
            ctx.fillRect(0, 0, canvasW, canvasH);
        }
        // 岩浆视野（evenodd 挖孔，不破坏底层）
        if (State.screenRedTimer > 0) {
            ctx.save();
            ctx.fillStyle = 'rgba(50,10,0,0.9)';
            ctx.beginPath();
            ctx.rect(0, 0, canvasW, canvasH);
            for (const w of State.lavaWindows) {
                ctx.moveTo(w.x + w.radius, w.y);
                ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2, true);
            }
            ctx.fill('evenodd');
            ctx.restore();
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvasW, canvasH);

        // 屏幕震动只影响世界绘制
        const origX = camera.x, origY = camera.y;
        if (State.screenShakeTimer > 0) {
            camera.x += (Math.random() - 0.5) * 20;
            camera.y += (Math.random() - 0.5) * 20;
        }

        drawBackground();
        drawPlanktons();
        drawBloodZones();
        drawTraps();
        drawSeaweeds();
        drawBubbles();

        // 按距离排序绘制
        const drawList = [];
        for (const f of world.ai) {
            const sx = f.x - camera.x, sy = f.y - camera.y;
            if (sx < -200 || sx > canvasW + 200 || sy < -200 || sy > canvasH + 200) continue;
            drawList.push({ type: 'ai', f, sx, sy, d: Math.hypot(sx - canvasW / 2, sy - canvasH / 2) });
        }
        const psx = player.x - camera.x, psy = player.y - camera.y;
        drawList.push({ type: 'player', sx: psx, sy: psy, d: Math.hypot(psx - canvasW / 2, psy - canvasH / 2) });
        if (world.boss) {
            const bsx = world.boss.x - camera.x, bsy = world.boss.y - camera.y;
            drawList.push({ type: 'boss', sx: bsx, sy: bsy, d: Math.hypot(bsx - canvasW / 2, bsy - canvasH / 2) });
        }
        drawList.sort((a, b) => b.d - a.d);

        for (const item of drawList) {
            if (item.type === 'ai') {
                const stage = getStageByPower(item.f.power);
                drawFishBody(item.sx, item.sy, item.f.radius, item.f.angle, stage, false, 0, item.f.flashTimer);
                drawAILabel(item.f, item.sx, item.sy);
            } else if (item.type === 'boss') {
                drawBoss();
            }
        }

        drawPlayer();
        drawParticles();
        drawFloatingTexts();

        camera.x = origX;
        camera.y = origY;

        drawOverlays();
    }

    // ============================================================
    // UI 更新
    // ============================================================
    function updateUI() {
        // 力量
        M.setText(UI.powerNum, Math.round(player.displayPower).toString());
        if (player.power >= 90) UI.powerNum.style.color = '#f0c060';
        else if (player.power >= 70) UI.powerNum.style.color = '#ffb8a0';
        else UI.powerNum.style.color = '#fff';

        // 阶段
        const { stage } = getStageByPower(player.power);
        if (UI.stageName.__lastText !== stage.name) {
            UI.stageName.textContent = stage.name;
            UI.stageName.__lastText = stage.name;
            UI.stageIcon.innerHTML = '<svg viewBox="0 0 24 20"><use href="#' + stage.iconId + '"/></svg>';
        }

        // 进度条
        const ns = getNextStage(player.power);
        let pct = 0, nextText = '';
        if (ns) {
            pct = M.clamp((player.power - stage.minPower) / (ns.minPower - stage.minPower) * 100, 0, 100);
            nextText = '下一阶段: ' + ns.name + ' (' + ns.minPower + ')';
        } else {
            pct = 100;
            nextText = '已达最终形态';
        }
        M.setStyle(UI.progressFill, 'width', pct + '%');
        M.setText(UI.nextLine, nextText);

        // 体力
        const staPct = M.clamp(staminaState.current / CONFIG.stamina.max * 100, 0, 100);
        M.setStyle(UI.staminaFill, 'width', staPct + '%');
        M.setText(UI.staminaNum, Math.round(staminaState.current).toString());

        // 饥饿
        const hunPct = M.clamp(hungerState.current / CONFIG.hunger.max * 100, 0, 100);
        M.setStyle(UI.hungerFill, 'width', hunPct + '%');
        M.setText(UI.hungerNum, Math.round(hungerState.current).toString());
        if (hungerState.current < CONFIG.hunger.warn) M.setStyle(UI.hungerFill, 'background', '#ff4d6a');
        else M.setStyle(UI.hungerFill, 'background', '#ff8c42');

        // 技能（惰性重建）
        if (skillsDirty) {
            let html = '';
            for (const id of player.unlockedSkills) {
                const s = CONFIG.skills[id];
                if (!s) continue;
                html += '<div class="skill-chip" title="' + s.desc + '"><span class="icon"><svg viewBox="0 0 24 24"><use href="#' + s.icon + '"/></svg></span><span class="name">' + s.name + '</span></div>';
            }
            UI.skillsList.innerHTML = html || '<div class="no-skills">暂无技能，进化获得</div>';
            skillsDirty = false;
        }

        // 开发者信息
        if (UI.devPanel.classList.contains('open')) {
            M.setText(UI.infoFPS, State.currentFPS > 0 ? Math.round(State.currentFPS).toString() : '--');
            M.setText(UI.infoAI, world.ai.length + ' / ' + State.params.aiMax);
            M.setText(UI.infoPos, Math.round(player.x) + ', ' + Math.round(player.y));
            if (world.boss) {
                M.setText(UI.infoBoss, (world.boss.type === 'megalodon' ? '巨齿鲨' : '大王乌贼') + ' HP:' + Math.round(world.boss.power) + '/' + world.boss.maxPower);
            } else {
                M.setText(UI.infoBoss, '无');
            }
            M.setText(UI.infoBuff, player.tentacleBuffTimer > 0 ? player.tentacleBuffTimer.toFixed(1) + '秒' : '无');
            M.setText(UI.infoEnt, player.entangledTimer > 0 ? player.entangledTimer.toFixed(1) + '秒' : '无');
        }
    }

    // ============================================================
    // 主循环
    // ============================================================
    function gameLoop(ts) {
        if (!State.running) return;

        if (!State.lastTime) State.lastTime = ts;
        const dt = Math.min(0.1, (ts - State.lastTime) / 1000);
        State.lastTime = ts;
        State.gameTime += dt;

        // FPS
        State.fpsHistory.push(ts);
        if (State.fpsHistory.length > 60) State.fpsHistory.shift();
        if (State.fpsHistory.length >= 2) {
            const elapsed = (State.fpsHistory[State.fpsHistory.length - 1] - State.fpsHistory[0]) / 1000;
            State.currentFPS = elapsed > 0 ? (State.fpsHistory.length - 1) / elapsed : 0;
        }

        if (!State.paused && !player.dead) {
            updatePlayer(dt);
            for (const f of world.ai) updateAIFish(f, dt);
            aiInteract();
            updateTraps(dt);
            checkPlayerTrapCollisions();
            if (!player.dead) {
                checkBossSpawn(dt);
                updateBoss(dt);
                checkBossTrapCollisions();
                checkCollisions();
            }
            updateParticles(dt);
            updateBubbles(dt);
            updatePlanktons(dt);
            updateBloodZones(dt);
            updateFloatingTexts(dt);
            maintainAI();

            if (State.screenFlash > 0) State.screenFlash -= dt;
            if (State.screenRedTimer > 0) {
                State.screenRedTimer -= dt;
                updateLavaWindows(dt);
            }
            if (State.screenShakeTimer > 0) State.screenShakeTimer -= dt;
        }

        if (player.dead) {
            render();
            return;
        }

        updateCamera(dt);
        updateUI();
        render();

        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 输入：键盘
    // ============================================================
    function initKeyboard() {
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)) e.preventDefault();
            if (k === 'shift') staminaState.sprintKey = true;
            input.keys[k] = true;

            // 开发者模式激活（菜单中依次输入 wwssadad）
            if (!State.running && !State.devMode && 'wasd'.includes(k)) {
                State.inputBuffer += k;
                if (State.inputBuffer.length > CONFIG.konami.length) {
                    State.inputBuffer = State.inputBuffer.slice(-CONFIG.konami.length);
                }
                if (State.inputBuffer === CONFIG.konami) {
                    State.devMode = true;
                    State.inputBuffer = '';
                    showHint('开发者模式已启用，游戏中按 Tab 打开面板');
                }
            }

            if (State.running && State.devMode) {
                if (k === 'tab') { e.preventDefault(); toggleDevPanel(); }
                if (e.ctrlKey && e.shiftKey && k === 'c') {
                    e.preventDefault();
                    State.cheats.invincible = !State.cheats.invincible;
                    UI.cheatInv.classList.toggle('on', State.cheats.invincible);
                    showHint(State.cheats.invincible ? '无敌模式: 开启' : '无敌模式: 关闭');
                }
                if (e.ctrlKey && e.shiftKey && k === 's') { e.preventDefault(); saveProgress(); }
                if (e.ctrlKey && e.shiftKey && k === 'r') { e.preventDefault(); resetPlayerState(); showHint('玩家状态已重置'); }
            }
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'shift') staminaState.sprintKey = false;
            input.keys[k] = false;
        });

        window.addEventListener('blur', () => {
            for (const k in input.keys) input.keys[k] = false;
            staminaState.sprintKey = false;
        });
    }

    // ============================================================
    // 输入：触摸
    // ============================================================
    function initTouch() {
        const joy = UI.joystick;
        const thumb = joy ? joy.querySelector('.joystick-thumb') : null;
        const sprint = UI.sprintBtn;
        if (!joy || !thumb || !sprint) return;

        let cx = 0, cy = 0;
        const maxR = 44;

        function refreshCenter() {
            const rect = joy.getBoundingClientRect();
            cx = rect.left + rect.width / 2;
            cy = rect.top + rect.height / 2;
        }

        function setThumb(clientX, clientY) {
            let dx = clientX - cx;
            let dy = clientY - cy;
            let dist = Math.hypot(dx, dy);
            if (dist > maxR) {
                dx = dx / dist * maxR;
                dy = dy / dist * maxR;
                dist = maxR;
            }
            thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
            if (dist < 12) {
                input.touch.x = 0;
                input.touch.y = 0;
                input.touch.active = false;
            } else {
                input.touch.x = dx / maxR;
                input.touch.y = dy / maxR;
                input.touch.active = true;
            }
        }

        function resetThumb() {
            thumb.style.transform = 'translate(-50%, -50%)';
            input.touch.x = 0;
            input.touch.y = 0;
            input.touch.active = false;
        }

        joy.addEventListener('touchstart', e => {
            e.preventDefault();
            refreshCenter();
            const t = e.touches[0];
            setThumb(t.clientX, t.clientY);
        }, { passive: false });

        joy.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            setThumb(t.clientX, t.clientY);
        }, { passive: false });

        joy.addEventListener('touchend', e => {
            e.preventDefault();
            resetThumb();
        }, { passive: false });

        joy.addEventListener('touchcancel', () => resetThumb());

        sprint.addEventListener('touchstart', e => {
            e.preventDefault();
            input.touch.sprint = true;
            sprint.style.transform = 'scale(0.95)';
        }, { passive: false });

        sprint.addEventListener('touchend', e => {
            e.preventDefault();
            input.touch.sprint = false;
            sprint.style.transform = 'scale(1)';
        }, { passive: false });

        sprint.addEventListener('touchcancel', () => {
            input.touch.sprint = false;
            sprint.style.transform = 'scale(1)';
        });

        // 全局兜底
        window.addEventListener('touchend', () => {
            if (input.touch.sprint) {
                input.touch.sprint = false;
                sprint.style.transform = 'scale(1)';
            }
        }, { passive: true });
    }

    // ============================================================
    // 设置：同步
    // ============================================================
    function syncSettingsUI() {
        // 菜单和侧栏共用 data-set 属性
        document.querySelectorAll('[data-set]').forEach(el => {
            const key = el.dataset.set;
            el.classList.toggle('on', !!State.settings[key]);
        });
    }

    function initSettings() {
        document.querySelectorAll('[data-set]').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.set;
                State.settings[key] = !State.settings[key];
                if (key === 'bloodMega' && !State.settings[key]) player.killStreak = 0;
                syncSettingsUI();
            });
        });
        UI.settingsBtn.addEventListener('click', () => UI.settingsPanel.classList.toggle('open'));
        UI.settingsReset.addEventListener('click', () => {
            State.settings = { aiHarm: true, aiVision: true, hunger: true, stealth: true, blood: true, bloodMega: true };
            player.killStreak = 0;
            syncSettingsUI();
        });
    }

    // ============================================================
    // 难度选择
    // ============================================================
    function initDifficulty() {
        const btns = UI.diffRow.querySelectorAll('.diff-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                State.difficulty = btn.dataset.diff;
                State.params = Object.assign({}, CONFIG.difficulty[State.difficulty]);
                world.bossSpawnTimer = State.params.bossInterval;
            });
        });
    }

    // ============================================================
    // 开发者工具
    // ============================================================
    function toggleDevPanel() {
        const open = UI.devPanel.classList.toggle('open');
        State.paused = open;
        if (open) syncDevSliders();
    }

    function syncDevSliders() {
        UI.dvPower.value = player.power;
        UI.dvPowerNum.value = Math.round(player.power);
        UI.dvHunger.value = Math.round(hungerState.current);
        UI.dvHungerNum.value = Math.round(hungerState.current);
        UI.dvStamina.value = Math.round(staminaState.current);
        UI.dvStaminaNum.value = Math.round(staminaState.current);
        UI.dvStreak.value = player.killStreak;
        UI.cheatInv.classList.toggle('on', State.cheats.invincible);
        UI.cheatSta.classList.toggle('on', State.cheats.infStamina);
        UI.cheatOne.classList.toggle('on', State.cheats.oneShot);
        document.querySelectorAll('.lock-btn').forEach(btn => {
            const k = btn.dataset.lock;
            btn.classList.toggle('locked', State.locks[k]);
            btn.textContent = State.locks[k] ? '锁' : '开';
        });
    }

    function initDevTools() {
        UI.devClose.addEventListener('click', () => { UI.devPanel.classList.remove('open'); State.paused = false; });
        UI.devFold.addEventListener('click', () => UI.devPanel.classList.toggle('collapsed'));

        // 拖动
        let dragX = 0, dragY = 0, dragging = false;
        UI.devHead.addEventListener('mousedown', e => {
            if (e.target.tagName === 'BUTTON') return;
            dragging = true;
            const rect = UI.devPanel.getBoundingClientRect();
            dragX = e.clientX - rect.left;
            dragY = e.clientY - rect.top;
            UI.devPanel.style.transition = 'none';
            UI.devPanel.style.left = rect.left + 'px';
            UI.devPanel.style.top = rect.top + 'px';
            UI.devPanel.style.transform = 'none';
            e.preventDefault();
        });
        window.addEventListener('mousemove', e => {
            if (!dragging) return;
            const nl = e.clientX - dragX;
            const nt = e.clientY - dragY;
            UI.devPanel.style.left = M.clamp(nl, 0, window.innerWidth - UI.devPanel.offsetWidth) + 'px';
            UI.devPanel.style.top = M.clamp(nt, 0, window.innerHeight - UI.devPanel.offsetHeight) + 'px';
        });
        window.addEventListener('mouseup', () => {
            if (dragging) {
                dragging = false;
                UI.devPanel.style.transition = 'opacity 0.3s';
            }
        });

        // 开关
        UI.cheatInv.addEventListener('click', () => { State.cheats.invincible = !State.cheats.invincible; UI.cheatInv.classList.toggle('on', State.cheats.invincible); });
        UI.cheatSta.addEventListener('click', () => { State.cheats.infStamina = !State.cheats.infStamina; UI.cheatSta.classList.toggle('on', State.cheats.infStamina); });
        UI.cheatOne.addEventListener('click', () => { State.cheats.oneShot = !State.cheats.oneShot; UI.cheatOne.classList.toggle('on', State.cheats.oneShot); });

        // 锁定
        document.querySelectorAll('.lock-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const k = btn.dataset.lock;
                State.locks[k] = !State.locks[k];
                syncDevSliders();
            });
        });

        // 属性
        function applyPower() {
            const v = parseFloat(UI.dvPowerNum.value) || 10;
            player.power = v;
            player.targetPower = v;
            player.displayPower = v;
            unlockSkillsUpTo(v);
            lastStageIndex = getStageByPower(v).index;
        }
        UI.dvPower.addEventListener('input', () => { UI.dvPowerNum.value = UI.dvPower.value; applyPower(); });
        UI.dvPowerNum.addEventListener('input', () => { UI.dvPower.value = UI.dvPowerNum.value; applyPower(); });
        UI.dvHunger.addEventListener('input', () => { UI.dvHungerNum.value = UI.dvHunger.value; hungerState.current = parseFloat(UI.dvHunger.value); });
        UI.dvHungerNum.addEventListener('input', () => { UI.dvHunger.value = UI.dvHungerNum.value; hungerState.current = parseFloat(UI.dvHungerNum.value); });
        UI.dvStamina.addEventListener('input', () => { UI.dvStaminaNum.value = UI.dvStamina.value; staminaState.current = parseFloat(UI.dvStamina.value); });
        UI.dvStaminaNum.addEventListener('input', () => { UI.dvStamina.value = UI.dvStaminaNum.value; staminaState.current = parseFloat(UI.dvStaminaNum.value); });
        UI.dvStreak.addEventListener('input', () => { player.killStreak = parseInt(UI.dvStreak.value) || 0; });

        // 世界
        UI.dvAddAI.addEventListener('click', () => spawnAIFish());
        UI.dvClearAI.addEventListener('click', () => { world.ai = []; });
        UI.dvBoss.addEventListener('click', () => {
            if (world.boss) { showHint('当前已有Boss存活！'); return; }
            world.bossSpawnWarning = 0;
            world.bossSpawnTimer = 9999;
            spawnBoss();
            showHint('强制生成Boss！');
        });
        UI.dvResetPlayer.addEventListener('click', () => { resetPlayerState(); showHint('玩家状态已重置'); });

        // 存档
        UI.dvSave.addEventListener('click', saveProgress);
        UI.dvLoad.addEventListener('click', loadProgress);
        UI.dvResetGame.addEventListener('click', () => {
            resetPlayerState();
            world.ai = [];
            world.boss = null;
            world.bossSpawnTimer = State.params.bossInterval;
            world.bossSpawnWarning = 0;
            State.screenFlash = 0;
            State.screenRedTimer = 0;
            State.screenShakeTimer = 0;
            State.lavaWindows = [];
            world.floatingTexts = [];
            world.bloodZones = [];
            world.particles = [];
            player.killStreak = 0;
            initTraps();
            syncDevSliders();
            for (let i = 0; i < State.params.aiMin; i++) spawnAIFish();
            showHint('游戏已完全重置');
        });
    }

    function resetPlayerState() {
        player.power = CONFIG.player.startPower;
        player.targetPower = CONFIG.player.startPower;
        player.displayPower = CONFIG.player.startPower;
        player.killStreak = 0;
        player.dead = false;
        player.deadReason = '';
        hungerState.current = CONFIG.hunger.max;
        staminaState.current = CONFIG.stamina.max;
        player.x = CONFIG.world.width / 2;
        player.y = CONFIG.world.height / 2;
        player.vx = 0;
        player.vy = 0;
        player.unlockedSkills.clear();
        player.tentacleBuffTimer = 0;
        player.entangledTimer = 0;
        player.entangleCooldown = 0;
        unlockSkillsUpTo(player.power);
        lastStageIndex = getStageByPower(player.power).index;
        skillsDirty = true;
        syncDevSliders();
    }

    function saveProgress() {
        try {
            const data = {
                power: player.power,
                hunger: hungerState.current,
                stamina: staminaState.current,
                killStreak: player.killStreak,
                x: player.x, y: player.y
            };
            localStorage.setItem('deepSeaEcology_save', JSON.stringify(data));
            showHint('进度已保存！');
        } catch (e) {}
    }

    function loadProgress() {
        try {
            const raw = localStorage.getItem('deepSeaEcology_save');
            if (!raw) { showHint('没有找到存档'); return; }
            const d = JSON.parse(raw);
            player.power = d.power || CONFIG.player.startPower;
            player.targetPower = player.power;
            player.displayPower = player.power;
            hungerState.current = d.hunger || CONFIG.hunger.max;
            staminaState.current = d.stamina || CONFIG.stamina.max;
            player.killStreak = d.killStreak || 0;
            player.x = d.x || CONFIG.world.width / 2;
            player.y = d.y || CONFIG.world.height / 2;
            player.vx = 0;
            player.vy = 0;
            player.unlockedSkills.clear();
            player.tentacleBuffTimer = 0;
            player.entangledTimer = 0;
            player.entangleCooldown = 0;
            unlockSkillsUpTo(player.power);
            lastStageIndex = getStageByPower(player.power).index;
            syncDevSliders();
            showHint('进度已加载！');
        } catch (e) {}
    }

    // ============================================================
    // 启动
    // ============================================================
    function startGame() {
        resize();
        initSeaweeds();
        initBubbles();
        initSeabedRocks();
        initPlanktons();
        initTraps();

        world.ai = [];
        for (let i = 0; i < State.params.aiMin; i++) spawnAIFish();

        camera.x = player.x - canvasW / 2;
        camera.y = player.y - canvasH / 2;
        camera.targetX = camera.x;
        camera.targetY = camera.y;

        lastStageIndex = getStageByPower(player.power).index;
        player.unlockedSkills.clear();
        unlockSkillsUpTo(player.power);
        skillsDirty = true;

        world.boss = null;
        world.bossSpawnTimer = State.params.bossInterval;
        world.bossSpawnWarning = 0;
        State.screenFlash = 0;
        State.screenRedTimer = 0;
        State.screenShakeTimer = 0;
        State.lavaWindows = [];
        world.floatingTexts = [];
        player.tentacleBuffTimer = 0;
        player.entangledTimer = 0;
        player.entangleCooldown = 0;
        player.dead = false;

        UI.menu.classList.add('hidden');
        setTimeout(() => showHint('WASD / 方向键移动 | Shift 疾跑 | 引Boss撞陷阱'), 600);
        setTimeout(() => showHint('Boss会吞噬小鱼回血，尽量清理周围小鱼'), 2500);
        setTimeout(() => showHint('绿色数值的鱼可以吃'), 4500);
        setTimeout(() => showHint('每3分钟将有深海巨兽出现'), 7000);

        State.running = true;
        State.lastTime = 0;
        State.paused = false;
        State.fpsHistory = [];
        State.currentFPS = 0;
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 初始化
    // ============================================================
    function boot() {
        // 默认难度
        State.params = Object.assign({}, CONFIG.difficulty[State.difficulty]);

        // 事件
        UI.startBtn.addEventListener('click', startGame);
        initDifficulty();
        initSettings();
        initKeyboard();
        initTouch();
        initDevTools();
        syncSettingsUI();

        window.addEventListener('resize', resize);
        resize();
    }

    // roundRect polyfill（先检查）
    if (!ctx.roundRect) {
        ctx.roundRect = function (x, y, w, h, r) {
            if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + w - r.tr, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
            ctx.lineTo(x + w, y + h - r.br);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
            ctx.lineTo(x + r.bl, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.quadraticCurveTo(x, y, x + r.tl, y);
            ctx.closePath();
        };
    }

    boot();
})();
</script>
