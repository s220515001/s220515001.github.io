<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件目录</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f8fa; --fg:#1f2328; --muted:#656d76;
    --card:#ffffff; --border:#d0d7de; --accent:#0969da; --hover:#eef2f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e;
      --card:#161b22; --border:#30363d; --accent:#58a6ff; --hover:#1f2630;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 16px 64px;
    background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{margin-bottom:16px}
  h1{font-size:19px;font-weight:600;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;word-break:break-all}
  .toolbar{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
  input[type=search]{
    flex:1 1 200px;min-width:0;padding:9px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--card);color:var(--fg);
    font-size:14px;outline:none;
  }
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.15)}
  button{
    padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--fg);font-size:14px;cursor:pointer;
  }
  button:hover{background:var(--hover)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li a.file{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    color:inherit;text-decoration:none;transition:.15s;
  }
  li a.file:hover{background:var(--hover);border-color:var(--accent);transform:translateY(-1px)}
  .ico{font-size:20px;line-height:1;flex:none;width:24px;text-align:center}
  .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .size{color:var(--muted);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
  .badge{
    flex:none;font-size:11.5px;padding:2px 8px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);
  }
  .badge.open{color:var(--accent);border-color:currentColor}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:2}
  .empty code{background:var(--card);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📁 文件目录</h1>
    <div class="sub" id="sub">正在读取…</div>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="搜索文件名…" autocomplete="off">
    <button id="reload" type="button">刷新</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</div>

<script>
(function () {
  'use strict';

  /* ===================== 配置 ===================== */
  const HTML_RE  = /\.(html?|xhtml)$/i;      // 这些后缀：直接打开
  const INDEX_RE = /^index\.html?$/i;        // 跳过自身

  const ICONS = {
    html:'🌐', htm:'🌐', xhtml:'🌐',
    pdf:'📕', md:'📝', txt:'📄', log:'📄', csv:'📊',
    png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️', ico:'🖼️', bmp:'🖼️',
    mp4:'🎬', mov:'🎬', webm:'🎬', mkv:'🎬', avi:'🎬',
    mp3:'🎵', wav:'🎵', flac:'🎵', ogg:'🎵', m4a:'🎵',
    zip:'🗜️', rar:'🗜️', '7z':'🗜️', gz:'🗜️', tar:'🗜️',
    doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', ppt:'📙', pptx:'📙',
    js:'⚙️', mjs:'⚙️', css:'🎨', json:'🔧', xml:'🔧', yml:'🔧', yaml:'🔧',
    py:'🐍', java:'☕', c:'📐', cpp:'📐', go:'🐹', rs:'🦀', sh:'⌨️',
    exe:'💾', apk:'📦', dmg:'📦', iso:'💿', ttf:'🔤', otf:'🔤', woff:'🔤', woff2:'🔤'
  };

  /* ===================== DOM ===================== */
  const el = {
    list:   document.getElementById('list'),
    empty:  document.getElementById('empty'),
    sub:    document.getElementById('sub'),
    search: document.getElementById('search'),
    reload: document.getElementById('reload')
  };

  const state = { files: [], query: '', source: '' };

  /* ===================== 工具函数 ===================== */

  // 当前页面所在「目录」的 URL（一定以 / 结尾）
  function baseDirUrl() {
    let p = location.pathname;
    if (p.endsWith('/')) return new URL(p, location.origin);
    const last = p.split('/').pop();
    p = last.includes('.') ? p.slice(0, -last.length) : p + '/';
    return new URL(p, location.origin);
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function fmtSize(n) {
    if (n == null || isNaN(n)) return '';
    if (n < 1024) return n + ' B';
    const units = ['KB', 'MB', 'GB', 'TB'];
    let i = -1, v = n;
    do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
    return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[i];
  }

  function iconFor(name) {
    const m = /\.([^.]+)$/.exec(name);
    const ext = m ? m[1].toLowerCase() : '';
    return ICONS[ext] || '📄';
  }

  /* ===================== 数据源 1：解析目录索引页 ===================== */
  // 适用于 Apache/Nginx 自动索引，或 GitHub Pages 的目录列表页
  async function fromDirectoryListing() {
    const dirUrl = baseDirUrl();
    const res = await fetch(dirUrl.href, { cache: 'no-store' });
    const text = await res.text();

    const doc = new DOMParser().parseFromString(text, 'text/html');
    const dirPath = dirUrl.pathname;
    const out = [];
    const seen = new Set();

    for (const a of doc.querySelectorAll('a[href]')) {
      let u;
      try { u = new URL(a.getAttribute('href'), dirUrl); } catch (e) { continue; }
      if (u.origin !== location.origin) continue;
      if (u.search || u.hash) continue;

      const p = u.pathname;
      if (!p.startsWith(dirPath)) continue;

      const rest = p.slice(dirPath.length);
      if (!rest || rest.includes('/')) continue;      // 只取本层的直接子项

      const name = safeDecode(rest);
      if (!name || name === '.' || name === '..') continue;
      if (INDEX_RE.test(name)) continue;              // 跳过 index.html 自己
      if (seen.has(name)) continue;

      seen.add(name);
      out.push({ name: name, size: null });
    }
    return out;
  }

  /* ===================== 数据源 2：GitHub Contents API ===================== */
  async function fetchContents(owner, repo, path) {
    const p = path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    const url = 'https://api.github.com/repos/' +
                encodeURIComponent(owner) + '/' + encodeURIComponent(repo) +
                '/contents/' + p;
    const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error('GitHub API ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('目标不是目录');
    return data;
  }

  async function fromGitHubApi() {
    const host = location.hostname;
    if (!/\.github\.io$/i.test(host)) {
      throw new Error('当前不是 *.github.io 域名，无法推断仓库');
    }
    const owner = host.replace(/\.github\.io$/i, '');
    const segs  = location.pathname.split('/').filter(Boolean);

    // 可能是「项目页」(user.github.io/repo/...) 也可能是「用户页 + 子目录」(user.github.io/dir/...)
    // 两种都试一下，谁先成功用谁
    const candidates = [];
    if (segs.length === 0) {
      candidates.push({ repo: owner + '.github.io', path: '' });
    } else {
      candidates.push({ repo: segs[0],                path: segs.slice(1).join('/') });
      candidates.push({ repo: owner + '.github.io',   path: segs.join('/') });
    }

    let lastErr = null;
    for (const c of candidates) {
      try {
        const items = await fetchContents(owner, c.repo, c.path);
        return items
          .filter(function (it) { return it.type === 'file'; })
          .map(function (it) { return { name: it.name, size: it.size }; });
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('未找到对应仓库');
  }

  /* ===================== 渲染 ===================== */
  function render() {
    const q = state.query.trim().toLowerCase();
    const files = state.files
      .filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) !== -1; })
      .sort(function (a, b) {
        return a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
      });

    el.list.innerHTML = '';

    if (!files.length) {
      el.empty.hidden = false;
      el.empty.textContent = '没有匹配的文件';
      return;
    }
    el.empty.hidden = true;

    const dir  = baseDirUrl();
    const frag = document.createDocumentFragment();

    files.forEach(function (f) {
      const isHtml = HTML_RE.test(f.name);

      const a = document.createElement('a');
      a.className = 'file';
      a.href = new URL(encodeURIComponent(f.name), dir).href;
      a.title = (isHtml ? '打开：' : '下载：') + f.name;
      if (!isHtml) a.setAttribute('download', f.name);   // 非 HTML → 强制下载

      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.textContent = iconFor(f.name);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = f.name;

      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = fmtSize(f.size);

      const badge = document.createElement('span');
      badge.className = 'badge' + (isHtml ? ' open' : '');
      badge.textContent = isHtml ? '打开' : '下载';

      a.appendChild(ico);
      a.appendChild(name);
      a.appendChild(size);
      a.appendChild(badge);

      const li = document.createElement('li');
      li.appendChild(a);
      frag.appendChild(li);
    });

    el.list.appendChild(frag);
  }

  /* ===================== 加载流程 ===================== */
  async function load() {
    el.list.innerHTML = '';
    el.empty.hidden = true;
    el.sub.textContent = '正在读取目录…';

    let files  = [];
    let source = '';

    // 1) 先尝试解析目录索引
    try {
      files = await fromDirectoryListing();
      if (files.length) source = '目录索引';
    } catch (e) {
      console.warn('[目录索引] 失败：', e);
    }

    // 2) 不行再用 GitHub API
    if (!files.length) {
      try {
        files = await fromGitHubApi();
        source = 'GitHub API';
      } catch (e) {
        console.warn('[GitHub API] 失败：', e);
      }
    }

    state.files  = files;
    state.source = source;

    if (!files.length) {
      el.sub.textContent = '未读取到文件';
      el.empty.hidden = false;
      el.empty.innerHTML =
        '没能列出目录里的文件 😕<br>' +
        '可能原因：<br>' +
        '· 服务器不提供目录列表，且当前不是 <code>*.github.io</code> 域名<br>' +
        '· GitHub API 触发了速率限制（每小时 60 次），稍后再试<br>' +
        '· 这个目录里确实没有文件';
      return;
    }

    el.sub.textContent = '共 ' + files.length + ' 个文件 · 来源：' + source +
                         ' · ' + baseDirUrl().pathname;
    render();
  }

  /* ===================== 事件绑定 ===================== */
  el.search.addEventListener('input', function () {
    state.query = el.search.value;
    render();
  });

  el.reload.addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
