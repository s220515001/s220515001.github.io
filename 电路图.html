<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电路仿真实验室 · 教材版 v14</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#111}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#fafafa;flex-shrink:0;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid #d1d5db;background:#fff;border-radius:7px;cursor:pointer;font-size:13px;color:#374151;user-select:none;transition:.12s;white-space:nowrap}
.tbtn:hover{background:#f3f4f6;border-color:#9ca3af}
.tbtn.on{background:#111;color:#fff;border-color:#111}
.sep{width:1px;height:22px;background:#e5e7eb;margin:0 4px}
.spacer{flex:1}
#toolbar .hint{font-size:12px;color:#9ca3af}
#main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:238px;flex-shrink:0;border-right:1px solid #e5e7eb;background:#fafafa;display:flex;flex-direction:column;overflow:hidden}
.sb-title{font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.08em;padding:10px 12px 6px;text-transform:uppercase}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 10px;overflow-y:auto;max-height:56%}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 6px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font-size:11px;color:#374151;transition:.12s;position:relative}
.pal-item:hover{border-color:#111;background:#f9fafb}
.pal-item.on{border-color:#111;background:#111;color:#fff}
.pal-item canvas{display:block}
.pal-item .freq{position:absolute;top:2px;right:4px;font-size:9px;color:#d1d5db}
.pal-item.on .freq{color:#6b7280}
.sb-divider{height:1px;background:#e5e7eb;margin:0 10px;flex-shrink:0}
#props{flex:1;overflow-y:auto;padding:0 12px 16px}
.empty{font-size:12px;color:#9ca3af;padding:18px 4px;line-height:1.7}
.prop-title{font-size:13px;font-weight:600;padding:10px 0 8px;display:flex;align-items:center;gap:6px}
.prop-title .dot{width:7px;height:7px;border-radius:50%;background:#111}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:11px;color:#6b7280;margin-bottom:3px}
.input-wrap{display:flex;align-items:center;border:1px solid #d1d5db;border-radius:6px;background:#fff;overflow:hidden}
.input-wrap:focus-within{border-color:#111;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.input-wrap input{flex:1;border:0;outline:0;padding:5px 8px;font-size:13px;width:100%;font-variant-numeric:tabular-nums;background:transparent}
.input-wrap .unit{font-size:11px;color:#9ca3af;padding-right:8px;flex-shrink:0}
.readouts{margin-top:14px;border-top:1px dashed #e5e7eb;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.readouts>div{display:flex;justify-content:space-between;font-size:12px}
.readouts span{color:#6b7280}
.readouts b{font-variant-numeric:tabular-nums;font-weight:600}
.rel-item{font-size:12px;line-height:1.9;color:#374151}
.rel-item code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:11px;font-weight:600}
.fault{margin-top:8px;padding:6px 8px;border-radius:6px;background:#fef2f2;color:#b91c1c;font-size:11.5px;line-height:1.6;border:1px solid #fecaca}
#canvas-wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:#fff}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#cv.panning{cursor:grab}
#cv.panning:active{cursor:grabbing}
#cv.meter{cursor:cell}
#meter-pop{position:absolute;pointer-events:none;background:#111;color:#fff;font-size:12px;padding:9px 12px;border-radius:8px;line-height:1.8;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:50;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:300px}
#meter-pop b{color:#fbbf24;font-weight:600}
#meter-pop .ttl{font-weight:600;border-bottom:1px solid #444;padding-bottom:4px;margin-bottom:5px;color:#fff}
#meter-pop .warn{color:#f87171;font-weight:600;display:block;margin-top:4px}
#range-pop{position:absolute;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:none;z-index:60;font-size:12px;min-width:210px}
#range-pop .rp-title{font-weight:600;color:#374151;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #f3f4f6;font-size:12.5px}
#range-pop .rp-sub{font-size:11px;color:#9ca3af;margin-bottom:6px}
#range-pop .rp-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;cursor:pointer;font-size:12.5px;color:#374151;margin-bottom:5px;transition:.1s}
#range-pop .rp-btn:last-child{margin-bottom:0}
#range-pop .rp-btn:hover{background:#f9fafb;border-color:#9ca3af}
#range-pop .rp-btn.active{background:#111;color:#fff;border-color:#111}
#range-pop .rp-btn.active .rp-div{color:#d1d5db}
#range-pop .rp-div{font-size:11px;color:#9ca3af;font-variant-numeric:tabular-nums}
#range-pop .rp-btn.active .rp-tag{background:#374151;color:#fff}
#range-pop .rp-tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:#f3f4f6;color:#6b7280;margin-left:5px;font-weight:600}
#statusbar{height:26px;flex-shrink:0;border-top:1px solid #e5e7eb;background:#fafafa;display:flex;align-items:center;padding:0 12px;gap:14px;font-size:11px;color:#6b7280}
#statusbar .warn{color:#dc2626;font-weight:600}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}
::-webkit-scrollbar-track{background:transparent}
#ex-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:center;justify-content:center}
#ex-overlay.show{display:flex}
#ex-modal{background:#fff;border-radius:12px;width:min(880px,92vw);height:min(660px,86vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ex-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e5e7eb}
.ex-header h2{font-size:16px;font-weight:600}
.ex-header button{border:0;background:#f3f4f6;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:14px;color:#6b7280}
.ex-header button:hover{background:#e5e7eb}
#exBody{flex:1;overflow-y:auto;padding:16px 20px 24px}
.ex-cat{font-size:12px;font-weight:600;color:#6b7280;letter-spacing:.06em;padding:12px 0 8px;border-bottom:1px solid #f3f4f6;margin-bottom:12px}
.ex-cat:first-child{padding-top:0}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:8px}
.ex-card{border:1px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;transition:.15s;background:#fff}
.ex-card:hover{border-color:#111;box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
.ex-card .nm{font-size:13px;font-weight:600;margin-bottom:4px}
.ex-card .ds{font-size:11px;color:#9ca3af;line-height:1.5}
.ex-cat-card{padding:18px 16px}
.ex-cat-card .nm{font-size:15px;margin-bottom:6px}
.ex-back{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;font-weight:600;color:#374151}
.ex-backbtn{border:1px solid #d1d5db;background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:#374151}
.ex-backbtn:hover{background:#f3f4f6}
#json-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:center;justify-content:center}
#json-overlay.show{display:flex}
#json-modal{background:#fff;border-radius:12px;width:min(720px,92vw);height:min(600px,86vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#jsonBody{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 20px 18px;min-height:0}
#jsonActions{display:flex;gap:8px;align-items:center}
.jbtn{border:1px solid #d1d5db;background:#fff;border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#374151;white-space:nowrap}
.jbtn:hover{background:#f3f4f6}
.jbtn.primary{background:#111;color:#fff;border-color:#111}
.jbtn.primary:hover{background:#000}
#jsonText{flex:1;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;resize:none;outline:none;background:#fafafa}
#jsonText:focus{border-color:#111;background:#fff}
.radio-group{display:flex;flex-direction:column;gap:5px;padding:6px 8px}
.radio-group label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:#374151}
.radio-group input[type=radio]{width:14px;height:14px;margin:0}
</style>
</head>
<body>

<script>
"use strict";
/* =========================================================
   常量
   ========================================================= */
const GRID = 20;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const GMIN = 1e-9;
const WIRE_R = 1e-3;
const PIN_SNAP = 20;
const EPS = 0.5;
const IS_D = 1e-12, NVT = 0.03;
const JSON_VERSION = 5;

const NAME_PREFIX = {
  battery: 'E', dcSource: 'E',
  lamp: 'L',
  resistor: 'R', rheostat: 'R',
  switch: 'S', switch_button: 'S', switch_knife: 'S',
  switch_spdt: 'S', switch_dpst: 'S', switch_dpdt: 'S',
  ammeter: 'A', voltmeter: 'V',
  motor: 'M',
  diode: 'D', led: 'D',
  capacitor: 'C',
  npn: 'Q', pnp: 'Q', relay: 'K'
};

function dot(ctx, x, y, r, filled) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (filled) ctx.fill(); else ctx.stroke();
}

/* =========================================================
   元件定义
   ========================================================= */
function drawMeterDial(ctx, range, division, letter, refined) {
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();

  if (refined) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.arc(0, 0, 18, -Math.PI / 2, Math.PI / 2, false); ctx.closePath();
    ctx.fillStyle = 'rgba(220, 38, 38, 0.13)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.arc(0, 0, 18, Math.PI / 2, -Math.PI / 2, false); ctx.closePath();
    ctx.fillStyle = 'rgba(37, 99, 235, 0.13)'; ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 18); ctx.stroke();

    ctx.save();
    ctx.font = 'bold 13px ui-monospace, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#dc2626'; ctx.fillText('+', -9, 0);
    ctx.fillStyle = '#2563eb'; ctx.fillText('−', 9, 0);
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111'; ctx.fillText(letter, 0, -4);
    ctx.font = 'bold 9px ui-monospace, monospace'; ctx.fillStyle = '#6b7280';
    ctx.fillText(`${range}${letter}`, 0, 9);
    ctx.restore();
  } else {
    ctx.save();
    ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111'; ctx.fillText(letter, 0, 1);
    ctx.restore();
  }
}

function drawMeterTerminalBlock(ctx, meter, refined) {
  if (!refined) return;
  const isA = meter.type === 'ammeter';
  const isSmallRange = Number(meter.params.range) === (isA ? 0.6 : 3);

  const blockX = -34, blockY = 30, blockW = 68, blockH = 14;
  ctx.save();
  ctx.fillStyle = '#f3f4f6'; ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(blockX, blockY, blockW, blockH, 3) : ctx.rect(blockX, blockY, blockW, blockH);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  const posts = [
    { x: -22, label: '−', value: null, isNeg: true },
    { x: 0, label: isA ? '0.6' : '3', value: isA ? 0.6 : 3, isNeg: false },
    { x: 22, label: isA ? '3' : '15', value: isA ? 3 : 15, isNeg: false }
  ];
  const curRange = Number(meter.params.range);
  posts.forEach(p => {
    const active = p.value !== null && Number(p.value) === curRange;
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, blockY + blockH / 2, 4.2, 0, Math.PI * 2);
    ctx.fillStyle = p.isNeg ? '#2563eb' : (active ? '#dc2626' : '#6b7280');
    ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = p.isNeg ? '#2563eb' : (active ? '#dc2626' : '#6b7280');
    ctx.fillText(p.label, p.x, blockY - 2);
    ctx.restore();

    if (active) {
      ctx.save();
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, blockY + blockH / 2, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  });

  ctx.save();
  ctx.font = 'bold 9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#374151';
  const div = isSmallRange ? Number(meter.params.divA) : Number(meter.params.divB);
  ctx.fillText(`量程 ${curRange}${isA ? 'A' : 'V'} · 分度 ${div}${isA ? 'A' : 'V'}`, 0, blockY + blockH + 3);
  ctx.restore();
}

function hitMeterTerminalLocal(lx, ly, meter) {
  const blockY = 30, blockH = 14;
  const isA = meter.type === 'ammeter';
  const posts = [
    { x: -22, value: null },
    { x: 0, value: isA ? 0.6 : 3 },
    { x: 22, value: isA ? 3 : 15 }
  ];
  const cy = blockY + blockH / 2;
  if (Math.abs(ly - cy) > 12) return null;
  let best = null, bd = 12;
  posts.forEach(p => {
    const d = Math.abs(lx - p.x);
    if (d < bd && p.value !== null) { bd = d; best = p.value; }
  });
  return best;
}

function drawBjt(ctx, type) {
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
  // 基极
  ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-12, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -16); ctx.lineTo(-12, 16); ctx.stroke();
  // 集电极
  ctx.beginPath(); ctx.moveTo(20, -40); ctx.lineTo(20, -10); ctx.lineTo(-12, -6); ctx.stroke();
  // 发射极
  ctx.beginPath(); ctx.moveTo(20, 40); ctx.lineTo(20, 10); ctx.lineTo(-12, 6); ctx.stroke();
  
  // 箭头
  const isNPN = (type === 'npn');
  const tipX = 20, tipY = 10;
  const angle = Math.atan2(10 - 6, 20 - (-12));
  const bx = tipX - 10 * Math.cos(angle), by = tipY - 10 * Math.sin(angle);
  ctx.beginPath();
  if (isNPN) {
    // NPN: 发射极箭头朝外
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(bx - 5 * Math.sin(angle), by + 5 * Math.cos(angle));
    ctx.lineTo(bx + 5 * Math.sin(angle), by - 5 * Math.cos(angle));
  } else {
    // PNP: 发射极箭头朝内
    const bxIn = tipX - 6 * Math.cos(angle), byIn = tipY - 6 * Math.sin(angle);
    ctx.moveTo(bxIn, byIn);
    ctx.lineTo(bxIn + 8 * Math.sin(angle), byIn - 8 * Math.cos(angle));
    ctx.lineTo(bxIn - 8 * Math.sin(angle), byIn + 8 * Math.cos(angle));
  }
  ctx.closePath();
  ctx.fill();
}

function drawRelay(ctx, state) {
  // 线圈
  ctx.beginPath(); ctx.rect(-20, -30, 40, 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-40, -22); ctx.lineTo(-20, -22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -22); ctx.lineTo(40, -22); ctx.stroke();
  // 标识文字
  ctx.save();
  ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#6b7280'; ctx.fillText('COIL', 0, -22);
  ctx.restore();

  // 触点
  const comX = 0, comY = 30;
  const ncX = -20, ncY = 20;
  const noX = 20, noY = 20;
  
  // 引出线
  ctx.beginPath(); ctx.moveTo(comX, comY); ctx.lineTo(comX, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ncX, ncY); ctx.lineTo(ncX, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(noX, noY); ctx.lineTo(noX, 40); ctx.stroke();
  
  // 触点圆点
  dot(ctx, comX, comY, 3.2, true);
  dot(ctx, ncX, ncY, 3.2, false);
  dot(ctx, noX, noY, 3.2, false);
  
  // 动片
  ctx.beginPath();
  ctx.moveTo(comX, comY);
  if (state) {
    // 吸合，连到 NO
    ctx.lineTo(noX, noY);
    ctx.strokeStyle = '#dc2626'; // 红色表示吸合
  } else {
    // 释放，连到 NC
    ctx.lineTo(ncX, ncY);
    ctx.strokeStyle = '#111';
  }
  ctx.stroke();
}

const DEFS = {
  battery: {
    name: '电池组', freq: '★★★',
    pins: [[-40, 0], [40, 0]],
    defaults: { cells: 2 },
    fields: [{ key: 'cells', label: '干电池节数（每节1.5V）', type: 'int', min: 1, max: 10, step: 1, unit: '节' }],
    sim: 'vsource',
    getV: p => 1.5 * (p.cells || 1),
    draw(ctx, p) {
      const n = Math.max(1, Math.round(p.cells || 1));

function fmtMeterReading(value, range, division) {
  if (value === undefined || value === null || isNaN(value)) return '—';
  let dec = 2;
  const d = Math.abs(division);
  if (d >= 0.1) dec = 2; else if (d >= 0.01) dec = 3; else if (d >= 0.001) dec = 4; else dec = 4;
  return value.toFixed(dec);
}

function getComponentName(c) {
  if (c.customName) return c.customName;
  const sameType = state.components.filter(x => x.type === c.type).sort((a, b) => a.id - b.id);
  const idx = sameType.findIndex(x => x.id === c.id);
  return (NAME_PREFIX[c.type] || 'X') + (idx + 1);
}
function computeNameDisplay() {
  const counts = {}; state.components.forEach(c => { counts[c.type] = (counts[c.type] || 0) + 1; });
  const indices = {}; const names = {}, show = {};
  const sorted = [...state.components].sort((a, b) => a.id - b.id);
  sorted.forEach(c => {
    if (c.customName) { names[c.id] = c.customName; show[c.id] = true; return; }
    indices[c.type] = (indices[c.type] || 0) + 1;
    names[c.id] = (NAME_PREFIX[c.type] || 'X') + indices[c.type];
    show[c.id] = (counts[c.type] || 0) > 1;
  });
  return { names, show };
}

  const out = []; const seen = new Set(); const wires = state.wires; const n = wires.length;
  for (let i = 0; i < n; i++) {

  for (const w of state.wires) {
    const isH = Math.abs(w.y1 - w.y2) < 1, isV = Math.abs(w.x1 - w.x2) < 1;
    if (!isH && !isV) { newWires.push(w); continue; }

  const newComps = [], newWires = []; let maxId = 0;
  comps.forEach(raw => {
    if (!raw || !DEFS[raw.type]) return; const def = DEFS[raw.type];
    const c = { id: Number(raw.id) || 0, type: raw.type, x: Number(raw.x) || 0, y: Number(raw.y) || 0, rot: Number(raw.rot) || 0, params: Object.assign({}, def.defaults, raw.params || {}) };

  if (!state.components.length && !state.wires.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.components.forEach(c => { const { mx, my } = compExtent(c); minX = Math.min(minX, c.x - mx); maxX = Math.max(maxX, c.x + mx); minY = Math.min(minY, c.y - my); maxY = Math.max(maxY, c.y + my); });
  state.wires.forEach(w => { minX = Math.min(minX, w.x1, w.x2); maxX = Math.max(maxX, w.x1, w.x2); minY = Math.min(minY, w.y1, w.y2); maxY = Math.max(maxY, w.y1, w.y2); });
  const pad = 50; minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const W = cv.width / DPR, H = cv.height / DPR;
  const s = Math.max(0.25, Math.min(W / (maxX - minX), H / (maxY - minY), 1.6));
  ui.view.scale = s; ui.view.x = (W - (maxX - minX) * s) / 2 - minX * s; ui.view.y = (H - (maxY - minY) * s) / 2 - minY * s;
  markDirty();
}

function tick(now) {
  if (needSim && now - lastSimTime > 50) { needSim = false; lastSimTime = now; runSim(); }
  if (needDraw || ui.particles) { draw(); needDraw = false; }
  requestAnimationFrame(tick);
}
function loadInitialExample() { EXAMPLES[0].items[0].build(); }
function init() {
  buildPalette(); resize(); loadInitialExample(); orthogonalizeWires(); fitView(); markSim(); requestAnimationFrame(tick);
}
init();
</script>
