    }},
  ],
  '重力环境演示': [
    { name: '月球自由落体', desc: 'g=1.6，下落更慢', build: () => {
      Scene.gravity = { g: 1.6, direction: 'down', planet: 'moon' };
      Engine.setGravity(1.6, 'down');
      addBody({ type: 'ball', name: 'B1', x: 0, y: 4, radius: 18, mass: 1, mu: 0.3, restitution: 0.3 });
    }},
  ],
};

function openExamples() {
  const modal = document.getElementById('modalExamples');
  const body = document.getElementById('examplesBody');
  body.innerHTML = '';
  const cats = Object.keys(EXAMPLES);
  const catBar = document.createElement('div'); catBar.className = 'example-cats';
  const grid = document.createElement('div'); grid.className = 'example-grid';

  function renderCat(cat) {
    catBar.querySelectorAll('.example-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    grid.innerHTML = '';
    for (const ex of EXAMPLES[cat]) {
      const card = document.createElement('div');
      card.className = 'example-card';
      card.innerHTML = `<strong>${ex.name}</strong><span>${ex.desc}</span>`;
      card.addEventListener('click', () => {
        pushUndo();
        Scene.reset();
        Scene.gravity = { g: 10, direction: 'down', planet: 'earth' };
        Engine.setGravity(10, 'down');
        ex.build();
        Scene.settings.showForces = true;
        document.getElementById('btnForces').classList.add('active');
        resetView();
        modal.classList.remove('open');
        refreshProperties();
        updateStatusBar();
        toast(`已加载：${ex.name}`);
      });
      grid.appendChild(card);
    }
  }

  for (const cat of cats) {
    const btn = document.createElement('button');
    btn.className = 'example-cat-btn' + (cat === cats[0] ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.addEventListener('click', () => renderCat(cat));
    catBar.appendChild(btn);
  }
  body.appendChild(catBar);
  body.appendChild(grid);
  renderCat(cats[0]);
  modal.classList.add('open');
}

function resetView() {
  const cw = canvas.width / devicePixelRatio, ch = canvas.height / devicePixelRatio;
  view.scale = 1;
  view.panX = cw / 2; // 水平居中
  view.panY = ch - 80; // 底部往上 80px 处是地面 (y=0)
}

function addBody(opts) {
  const body = { ...opts, vx: opts.vx || 0, vy: opts.vy || 0, angle: opts.angle || 0 };
  body.name = body.name || autoName(body.type);
  body.mass = opts.mass != null ? opts.mass : (opts.isStatic ? 0 : 1);
  body.mu = opts.mu != null ? opts.mu : 0.3;
  body.restitution = opts.restitution != null ? opts.restitution : 0.1;
  body.isStatic = !!opts.isStatic;
  Scene.addBody(body);
  return body;
}

function serializeScene() {
  return {
    version: 1, gravity: Scene.gravity,
    bodies: Scene.bodies.filter(b => !b.isSystem).map(b => ({ id: b.id, type: b.type, name: b.name, x: b.x, y: b.y, w: b.w, h: b.h, radius: b.radius, mass: b.mass, mu: b.mu, restitution: b.restitution, static: b.isStatic, vx: b.vx || 0, vy: b.vy || 0, angle: b.angle || 0, density: b.density, color: b.color })),
    constraints: Scene.constraints.map(c => ({ type: c.type, bodyA: c.bodyA, bodyB: c.bodyB, anchorA: c.anchorA, anchorB: c.anchorB, length: c.length, maxForce: c.maxForce, restLength: c.restLength, stiffness: c.stiffness, damping: c.damping })),
    forces: Scene.forces.map(f => ({ id: f.id, targetId: f.targetId, magnitude: f.magnitude, angle: f.angle, continuous: f.continuous })),
    settings: { showForces: Scene.settings.showForces, showVectors: Scene.settings.showVectors, showTrail: Scene.settings.showTrail, showGrid: Scene.settings.showGrid, timeScale: Scene.settings.timeScale }
  };
}

function loadSceneFromJSON(data) {
  if (!data || typeof data !== 'object') throw new Error('无效的 JSON 对象');
  if (data.version !== 1) throw new Error('不支持的版本号');
  if (!Array.isArray(data.bodies)) throw new Error('bodies 必须是数组');

  Scene.reset();
  if (data.gravity) { Scene.gravity = { g: data.gravity.g || 10, direction: data.gravity.direction || 'down', planet: data.gravity.planet || 'earth' }; Engine.setGravity(Scene.gravity.g, Scene.gravity.direction); }

  for (const b of data.bodies) {
    if (!b.type) continue;
    const body = {
      id: b.id || Scene.allocId(), type: b.type, name: b.name || autoName(b.type), x: b.x || 0, y: b.y || 0, w: b.w, h: b.h, radius: b.radius,
      mass: b.mass != null ? b.mass : 1, mu: b.mu != null ? b.mu : 0.3, restitution: b.restitution != null ? b.restitution : 0.1,
      isStatic: !!b.static, vx: b.vx || 0, vy: b.vy || 0, angle: b.angle || 0, density: b.density, color: b.color
    };
    Scene.bodies.push(body);
    Scene.nextId = Math.max(Scene.nextId, body.id + 1);
    Engine.createBody({ ...body, id: body.id });
  }

  for (const c of (data.constraints || [])) {
    let cid = null;
    if (c.type === 'rope') cid = Engine.createRope(c.bodyA, c.bodyB, c.anchorA || { x: 0, y: 0 }, c.anchorB || { x: 0, y: 0 }, c.length || 1, c.maxForce || 1000);
    else if (c.type === 'spring') cid = Engine.createSpring(c.bodyA, c.bodyB, c.anchorA || { x: 0, y: 0 }, c.anchorB || { x: 0, y: 0 }, c.restLength || 1, c.stiffness || 200, c.damping || 0.5);
    if (cid) Scene.constraints.push({ ...c, id: cid });
  }

  for (const f of (data.forces || [])) {
    Scene.forces.push({ id: f.id || uid(), targetId: f.targetId, magnitude: f.magnitude || 0, angle: f.angle || 0, continuous: f.continuous !== false });
  }

  if (data.settings) {
    Object.assign(Scene.settings, { showForces: false, showVectors: false, showTrail: false, showGrid: true, playing: false });
    Object.assign(Scene.settings, data.settings);
    Scene.settings.playing = false;
    document.getElementById('btnForces').classList.toggle('active', Scene.settings.showForces);
    document.getElementById('btnVectors').classList.toggle('active', Scene.settings.showVectors);
    document.getElementById('btnTrail').classList.toggle('active', Scene.settings.showTrail);
    document.getElementById('btnGrid').classList.toggle('active', Scene.settings.showGrid);
    document.getElementById('btnPlay').classList.remove('active');
    document.getElementById('btnPlay').textContent = '▶ 播放';
  }

  refreshProperties(); updateStatusBar(); render();
}

document.querySelectorAll('[data-close]').forEach(btn => { btn.addEventListener('click', () => document.getElementById(btn.dataset.close).classList.remove('open')); });
document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('open'); }); });

document.getElementById('btnGravity').addEventListener('click', () => {
  const sel = document.getElementById('gravityPlanet');
  sel.value = Scene.gravity.planet || 'earth';
  document.getElementById('gravityCustomG').value = Scene.gravity.g;
  document.getElementById('gravityDirection').value = Scene.gravity.direction;
  document.getElementById('modalGravity').classList.add('open');
});
document.getElementById('gravityPlanet').addEventListener('change', e => {
  if (e.target.value !== 'custom') document.getElementById('gravityCustomG').value = GRAVITY_PRESETS[e.target.value];
});
document.getElementById('gravityApply').addEventListener('click', () => {
  const planet = document.getElementById('gravityPlanet').value;
  const g = planet === 'custom' ? parseFloat(document.getElementById('gravityCustomG').value) : GRAVITY_PRESETS[planet];
  const dir = document.getElementById('gravityDirection').value;
  if (isNaN(g) || g < 0 || g > 500) { toast('g 值必须在 0~500 之间'); return; }
  pushUndo(); Scene.gravity = { g, direction: dir, planet }; Engine.setGravity(g, dir);
  document.getElementById('modalGravity').classList.remove('open');
  toast(`重力环境：g=${g} N/kg，${dir === 'down' ? '竖直向下' : '水平向右'}`);
});

document.getElementById('btnExamples').addEventListener('click', openExamples);

document.getElementById('btnJSON').addEventListener('click', () => {
  document.getElementById('jsonText').value = JSON.stringify(serializeScene(), null, 2);
  document.getElementById('modalJSON').classList.add('open');
});
document.getElementById('jsonExport').addEventListener('click', () => {
  document.getElementById('jsonText').value = JSON.stringify(serializeScene(), null, 2);
  toast('已导出到文本框');
});
document.getElementById('jsonImport').addEventListener('click', () => {
  const raw = document.getElementById('jsonText').value.trim();
  if (!raw) { toast('请先粘贴 JSON'); return; }
  try {
    const data = JSON.parse(raw);
    pushUndo(); loadSceneFromJSON(data);
    document.getElementById('modalJSON').classList.remove('open');
    toast('导入成功');
  } catch (e) { toast('导入失败：' + (e.message || 'JSON 格式错误')); }
});

Scene.reset();
buildLibrary();
resizeCanvas();
updateStatusBar();
resetView();

(function initDemo() {
  addBody({ type: 'box', name: 'M1', x: 0, y: 0.5, w: 40, h: 40, mass: 2, mu: 0.3, restitution: 0.2 });
  Scene.selectedIds.add(Scene.bodies[Scene.bodies.length - 1].id);
  refreshProperties();
})();

requestAnimationFrame(simulationTick);
</script>
