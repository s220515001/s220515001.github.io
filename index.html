<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>灵犀导航 · 极智视界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖拽时选中文本 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 50%, #0a0f1e 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            overflow-x: hidden;
            transition: background 0.2s ease;
        }

        /* 动态光晕 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(66, 153, 225, 0.15), transparent 60%),
                        radial-gradient(circle at 85% 70%, rgba(236, 72, 153, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* 浅色模式适配 */
        body.light {
            background: linear-gradient(145deg, #f0f4fe, #e9eef8);
        }
        body.light::before {
            background: radial-gradient(circle at 20% 30%, rgba(66,153,225,0.2), transparent 70%);
        }

        .app-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem 2rem;
        }

        /* --- 顶部导航栏 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 25, 45, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 80px;
            padding: 0.6rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        body.light .top-bar {
            background: rgba(240, 245, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .logo-area h2 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #FFFFFF, #B3E5FC);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .menu-icon, .theme-toggle, .settings-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-icon:hover, .theme-toggle:hover, .settings-icon:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }
        .right-actions {
            display: flex;
            gap: 10px;
        }
        .mini-search {
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 240px;
        }
        .mini-search input {
            background: transparent;
            border: none;
            padding: 0.6rem 0;
            color: white;
            outline: none;
            width: 100%;
        }
        body.light .mini-search input {
            color: #111;
        }
        .mini-search span {
            cursor: pointer;
        }

        /* 工具行 */
        .tools-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .tool-card {
            background: rgba(30, 40, 60, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 0.6rem 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            background: rgba(60, 80, 110, 0.8);
        }

        /* 网格容器 */
        .sites-grid {
            display: grid;
            gap: 1.5rem;
            justify-content: center;
            transition: all 0.2s;
            margin-bottom: 2rem;
        }
        /* 动态列数 class 控制 */
        .grid-cols-small { grid-template-columns: repeat(auto-fill, minmax(110px, 130px)); }
        .grid-cols-medium { grid-template-columns: repeat(auto-fill, minmax(130px, 150px)); }
        .grid-cols-large { grid-template-columns: repeat(auto-fill, minmax(150px, 170px)); }

        .site-card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 1rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: grab;
        }
        .site-card:active { cursor: grabbing; }
        .site-card.dragging { opacity: 0.5; cursor: grabbing; }
        .site-card:hover { transform: translateY(-6px); background: rgba(45, 65, 95, 0.8); border-color: rgba(255,255,255,0.4); }
        .site-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 28px;
            margin-bottom: 12px;
        }
        .site-icon img { width: 48px; height: 48px; object-fit: contain; border-radius: 16px; }
        .fallback-letter {
            width: 48px; height: 48px; border-radius: 20px;
            background: linear-gradient(145deg, #2b5876, #1e3a5f);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 24px; color: white;
        }
        .site-name { font-size: 0.85rem; font-weight: 500; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 40px; color: #f0f3fc; }

        /* 模态框通用 */
        .modal-glass {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-glass.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: rgba(25, 35, 55, 0.95);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        /* 侧边菜单抽屉 */
        .side-drawer {
            position: fixed;
            top: 0;
            left: -380px;
            width: 340px;
            height: 100%;
            background: rgba(18, 25, 45, 0.96);
            backdrop-filter: blur(20px);
            z-index: 4000;
            transition: left 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-right: 1px solid rgba(255,255,255,0.2);
            padding: 1.5rem;
            overflow-y: auto;
        }
        .side-drawer.open { left: 0; }
        .drawer-header { display: flex; justify-content: space-between; margin-bottom: 2rem; font-size: 1.3rem; font-weight: bold; }
        .drawer-section { margin-bottom: 1.8rem; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; }
        .bookmark-item, .recent-item { display: flex; justify-content: space-between; margin: 0.7rem 0; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 40px; }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2a3e;
            backdrop-filter: blur(20px);
            padding: 10px 24px;
            border-radius: 60px;
            color: white;
            z-index: 5000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
        .flex-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        button.small-btn {
            background: #2c7be5;
            border: none;
            padding: 6px 12px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
        }
        .icon-only .site-name { display: none; }
        .compact-card .site-icon { width: 56px; height: 56px; }
        .compact-card .site-icon img { width: 40px; height: 40px; }
        .comfort-card .site-icon { width: 80px; height: 80px; }
        @media (max-width: 640px) { .side-drawer { width: 280px; } .tool-card { font-size: 0.8rem; padding: 0.4rem 1rem; } }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="top-bar">
        <div class="logo-area" id="logoRefresh">
            <div class="menu-icon" id="menuToggle">☰</div>
            <h2>灵犀导航</h2>
        </div>
        <div class="mini-search">
            <input type="text" id="quickSearchInput" placeholder="搜索…">
            <span id="quickSearchIcon">🔍</span>
        </div>
        <div class="right-actions">
            <div class="theme-toggle" id="themeToggleBtn">🌙</div>
            <div class="settings-icon" id="openSettingsBtn">⚙️</div>
        </div>
    </div>

    <!-- 常用工具条 -->
    <div class="tools-strip" id="toolsStrip"></div>

    <!-- 动态网格 -->
    <div class="sites-grid" id="sitesGrid"></div>
</div>

<!-- 侧边快捷菜单栏（书签/最近/导入导出/引擎切换） -->
<div class="side-drawer" id="sideDrawer">
    <div class="drawer-header">快捷中心 <span id="closeDrawer" style="cursor:pointer;">✕</span></div>
    <div class="drawer-section">
        <div><strong>🔍 快速切换引擎</strong></div>
        <div id="drawerEngineList" class="flex-btns"></div>
    </div>
    <div class="drawer-section">
        <div><strong>📌 书签收藏</strong> <button class="small-btn" id="addBookmarkBtn">+ 添加当前页</button></div>
        <div id="bookmarkList"></div>
        <div class="flex-btns"><button class="small-btn" id="exportBookmarks">导出JSON</button><button class="small-btn" id="importBookmarks">导入JSON</button><input type="file" id="importFile" accept=".json" style="display:none"></div>
    </div>
    <div class="drawer-section">
        <div><strong>🕒 最近访问</strong></div>
        <div id="recentList"></div>
        <button class="small-btn" id="clearRecent">清空记录</button>
    </div>
    <div class="drawer-section">
        <div><strong>⚡ 搜索历史</strong></div>
        <div id="searchHistoryList"></div>
    </div>
</div>

<!-- 设置面板（个性化） -->
<div class="modal-glass" id="settingsModal">
    <div class="modal-content">
        <h3>✨ 个性化设置</h3>
        <label>网格列数：</label>
        <select id="gridColsSelect"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select><br><br>
        <label>卡片尺寸：</label>
        <select id="cardSizeSelect"><option value="compact">紧凑</option><option value="comfort" selected>舒适</option><option value="loose">宽松</option></select><br><br>
        <label>主题背景：</label>
        <select id="bgThemeSelect"><option value="system">跟随系统</option><option value="dark">深色</option><option value="light">浅色</option></select><br><br>
        <label>显示网站名称：</label>
        <input type="checkbox" id="showNameToggle" checked><br><br>
        <label>图标显示模式：</label>
        <select id="iconModeSelect"><option value="both">图标+文字</option><option value="icon">仅图标</option></select><br><br>
        <button class="small-btn" id="closeSettingsBtn">保存并关闭</button>
    </div>
</div>

<!-- 工具浮层简单示例（动态生成内容） -->
<div class="modal-glass" id="toolModal">
    <div class="modal-content" id="toolModalContent" style="max-width: 500px;"></div>
</div>

<script>
    // ----- 全局数据 -----
    let defaultSites = [
        { id: "d1", name: "抖音", url: "https://www.douyin.com", domain: "douyin.com" },
        { id: "d2", name: "B站", url: "https://www.bilibili.com", domain: "bilibili.com" },
        { id: "d3", name: "快手", url: "https://www.kuaishou.com", domain: "kuaishou.com" },
        { id: "d4", name: "豆包", url: "https://www.doubao.com", domain: "doubao.com" },
        { id: "d5", name: "百度AI", url: "https://chat.baidu.com", domain: "chat.baidu.com" },
        { id: "game", name: "鱼吃鱼游戏", url: "FEF.html", domain: "", isGame: true }
    ];
    let userBookmarks = []; // {name, url, id}
    let currentCards = [];   // 合并显示顺序
    let recentSites = [];     // 最多6
    let searchHistory = [];
    let currentEngine = { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" };
    const engines = [
        { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
        { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" },
        { id: "baidu", name: "百度", url: "https://www.baidu.com/s?wd=" }
    ];
    // 配置存储
    let settings = { gridCols: "medium", cardSize: "comfort", bgTheme: "system", showName: true, iconMode: "both" };
    let dragSrcIndex = null;

    // 辅助: 保存所有数据
    function saveAllData() {
        localStorage.setItem("userBookmarks", JSON.stringify(userBookmarks));
        localStorage.setItem("currentCardsOrder", JSON.stringify(currentCards.map(c => c.id)));
        localStorage.setItem("recentSites", JSON.stringify(recentSites));
        localStorage.setItem("searchHistory", JSON.stringify(searchHistory));
        localStorage.setItem("settings", JSON.stringify(settings));
        localStorage.setItem("engine", JSON.stringify(currentEngine));
    }
    function loadAllData() {
        let book = localStorage.getItem("userBookmarks");
        if(book) userBookmarks = JSON.parse(book);
        let order = localStorage.getItem("currentCardsOrder");
        let savedRecent = localStorage.getItem("recentSites");
        if(savedRecent) recentSites = JSON.parse(savedRecent);
        let savedHistory = localStorage.getItem("searchHistory");
        if(savedHistory) searchHistory = JSON.parse(savedHistory);
        let savedSet = localStorage.getItem("settings");
        if(savedSet) settings = JSON.parse(savedSet);
        let eng = localStorage.getItem("engine");
        if(eng) currentEngine = JSON.parse(eng);
        buildCardList(order);
    }
    function buildCardList(savedOrder) {
        let allItems = [...defaultSites.map(s => ({ ...s, isBookmark: false })), ...userBookmarks.map(b => ({ ...b, isBookmark: true, domain: b.url, id: b.id }))];
        if(savedOrder && savedOrder.length) {
            let ordered = [];
            savedOrder.forEach(id => { let found = allItems.find(i => i.id == id); if(found) ordered.push(found); });
            allItems.forEach(i => { if(!ordered.find(o=>o.id==i.id)) ordered.push(i); });
            currentCards = ordered;
        } else {
            currentCards = allItems;
        }
        renderGrid();
    }
    function addRecent(url, name) {
        let exists = recentSites.find(r => r.url === url);
        if(!exists) recentSites.unshift({ url, name, time: Date.now() });
        else { recentSites = recentSites.filter(r=>r.url!==url); recentSites.unshift({url,name}); }
        if(recentSites.length > 8) recentSites.pop();
        saveAllData(); renderRecent();
    }
    function addSearchHistory(word) {
        if(!word.trim()) return;
        searchHistory = searchHistory.filter(w=>w!==word);
        searchHistory.unshift(word);
        if(searchHistory.length>10) searchHistory.pop();
        saveAllData(); renderSearchHistory();
    }
    // 渲染主网格 (支持拖拽/右键)
    function renderGrid() {
        const grid = document.getElementById('sitesGrid');
        if(!grid) return;
        let colClass = `grid-cols-${settings.gridCols}`;
        grid.className = `sites-grid ${colClass}`;
        grid.innerHTML = '';
        currentCards.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = `site-card ${settings.cardSize === 'compact' ? 'compact-card' : (settings.cardSize === 'comfort' ? '' : 'comfort-card')}`;
            if(settings.iconMode === 'icon') cardDiv.classList.add('icon-only');
            cardDiv.draggable = true;
            cardDiv.setAttribute('data-index', idx);
            let iconUrl = card.domain ? `https://api.iowen.cn/favicon/${card.domain}` : '';
            let firstChar = card.name.charAt(0);
            cardDiv.innerHTML = `
                <div class="site-icon"><img src="${iconUrl}" onerror="this.style.display='none'; this.nextSibling.style.display='flex';" style="display:block;"><div class="fallback-letter" style="display:none;">${firstChar}</div></div>
                ${settings.showName ? `<div class="site-name">${card.name}</div>` : ''}
            `;
            cardDiv.addEventListener('click', (e) => { e.stopPropagation(); window.open(card.url, '_blank'); addRecent(card.url, card.name); });
            cardDiv.addEventListener('dragstart', (e) => { dragSrcIndex = idx; e.dataTransfer.effectAllowed = 'move'; });
            cardDiv.addEventListener('dragover', (e) => e.preventDefault());
            cardDiv.addEventListener('drop', (e) => {
                e.preventDefault(); if(dragSrcIndex !== null && dragSrcIndex !== idx) {
                    let moved = currentCards[dragSrcIndex];
                    currentCards.splice(dragSrcIndex,1);
                    currentCards.splice(idx,0,moved);
                    saveAllData(); renderGrid();
                }
                dragSrcIndex = null;
            });
            cardDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(card, idx, e.clientX, e.clientY);
            });
            grid.appendChild(cardDiv);
        });
    }
    function showContextMenu(card, idx, x, y) {
        let menu = document.getElementById('contextMenu');
        if(menu) menu.remove();
        let div = document.createElement('div');
        div.id = 'contextMenu';
        div.style.position = 'fixed'; div.style.left = `${x}px`; div.style.top = `${y}px`;
        div.style.background = '#1e2a3a'; div.style.backdropFilter = 'blur(16px)'; div.style.borderRadius = '20px'; div.style.padding = '8px'; div.style.zIndex = 9999;
        div.innerHTML = `<div style="padding:6px 16px;cursor:pointer;" data-act="open">打开</div><div style="padding:6px 16px;cursor:pointer;" data-act="newtab">新标签页打开</div><div style="padding:6px 16px;cursor:pointer;" data-act="edit">编辑</div><div style="padding:6px 16px;cursor:pointer;" data-act="delete">删除</div><div style="padding:6px 16px;cursor:pointer;" data-act="bookmark">添加到收藏</div>`;
        document.body.appendChild(div);
        div.querySelectorAll('[data-act]').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.dataset.act === 'open') window.open(card.url);
                if(btn.dataset.act === 'newtab') window.open(card.url,'_blank');
                if(btn.dataset.act === 'edit') { let newName = prompt('编辑名称',card.name); if(newName) { card.name=newName; saveAllData(); renderGrid(); } }
                if(btn.dataset.act === 'delete') { if(card.isBookmark) { userBookmarks = userBookmarks.filter(b=>b.id!==card.id); } else { alert("基础网站暂不支持删除，可添加到收藏后隐藏"); } buildCardList(null); saveAllData(); }
                if(btn.dataset.act === 'bookmark') { if(!userBookmarks.find(b=>b.url===card.url)) { let newB = { id: Date.now()+Math.random(), name: card.name, url: card.url, domain: card.domain }; userBookmarks.push(newB); saveAllData(); buildCardList(null); toastMsg("已添加到书签"); } else toastMsg("已在书签中"); }
                div.remove();
            });
        });
        setTimeout(() => { if(div) div.remove(); }, 5000);
    }
    function renderRecent() { let html = ''; recentSites.forEach(r=>{ html+=`<div class="recent-item"><span>${r.name}</span><button class="small-btn" data-url="${r.url}">打开</button></div>`; }); document.getElementById('recentList').innerHTML = html||'暂无'; document.querySelectorAll('.recent-item button').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.url)));}
    function renderBookmarks() { let html = ''; userBookmarks.forEach(b=>{ html+=`<div class="bookmark-item"><span>${b.name}</span><div><button class="small-btn" data-url="${b.url}">打开</button><button class="small-btn" data-id="${b.id}" style="background:#c2410c;">删</button></div></div>`; }); document.getElementById('bookmarkList').innerHTML = html||'暂无书签'; document.querySelectorAll('.bookmark-item button[data-url]').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.url))); document.querySelectorAll('.bookmark-item button[data-id]').forEach(btn=>btn.addEventListener('click',()=>{ userBookmarks = userBookmarks.filter(b=>b.id!=btn.dataset.id); saveAllData(); buildCardList(null); renderBookmarks(); toastMsg("已删除"); }));}
    function renderSearchHistory(){ let histDiv = document.getElementById('searchHistoryList'); histDiv.innerHTML = searchHistory.map(w=>`<div style="cursor:pointer;margin:4px 0;" class="history-word">🔍 ${w}</div>`).join('')||'暂无'; document.querySelectorAll('.history-word').forEach(el=>el.addEventListener('click',()=>{ document.getElementById('quickSearchInput').value=el.innerText.slice(2); performQuickSearch(); }));}
    function toastMsg(msg){ let t = document.getElementById('toast'); if(!t){ let div=document.createElement('div'); div.id='toast'; div.className='toast-msg'; document.body.appendChild(div); t=div;} t.innerText=msg; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,1800);}
    function performQuickSearch(){ let q = document.getElementById('quickSearchInput').value; if(!q) return; addSearchHistory(q); window.open(currentEngine.url+encodeURIComponent(q), '_blank'); }
    // 工具入口实现
    const tools = [{name:"📅 日历", id:"calendar"},{name:"🧮 计算器", id:"calc"},{name:"🌤️ 天气", id:"weather"},{name:"🔢 单位换算", id:"unit"},{name:"✅ 待办", id:"todo"},{name:"🌐 翻译", id:"translate"},{name:"📱 二维码生成", id:"qrcode"},{name:"🔑 随机密码", id:"pwd"}];
    function openToolModal(toolId){
        let modal = document.getElementById('toolModal'); let content = document.getElementById('toolModalContent');
        if(toolId === 'calendar') content.innerHTML = `<h3>日历参考</h3><div>${new Date().toDateString()}</div><div style="margin-top:20px;"><button class="small-btn" onclick="closeModal()">关闭</button></div>`;
        else if(toolId === 'calc') content.innerHTML = `<h3>简单计算器</h3><input id="calcA" placeholder="数字"> <select id="calcOp"><option>+</option><option>-</option><option>*</option><option>/</option></select> <input id="calcB"><button class="small-btn" onclick="document.getElementById('calcRes').innerText=eval(document.getElementById('calcA').value+document.getElementById('calcOp').value+document.getElementById('calcB').value)">=</button><div id="calcRes"></div><button class="small-btn" onclick="closeModal()">关闭</button>`;
        else if(toolId === 'weather') content.innerHTML = `<h3>模拟天气 (北京)</h3><div>☀️ 晴 24°C 湿度45%</div><button class="small-btn" onclick="closeModal()">关闭</button>`;
        else if(toolId === 'unit') content.innerHTML = `<h3>千米转英里</h3><input id="km" placeholder="千米"> <button onclick="document.getElementById('unitRes').innerText=(document.getElementById('km').value*0.621371).toFixed(2)+'英里'">转换</button><div id="unitRes"></div><button class="small-btn" onclick="closeModal()">关闭</button>`;
        else if(toolId === 'todo') content.innerHTML = `<h3>简易待办</h3><input id="todoInput"><button onclick="let li=document.createElement('li');li.innerText=document.getElementById('todoInput').value;document.getElementById('todoList').appendChild(li)">添加</button><ul id="todoList"></ul><button onclick="closeModal()">关闭</button>`;
        else if(toolId === 'translate') content.innerHTML = `<h3>简易翻译(中->英)</h3><input id="transInput"><button onclick="document.getElementById('transOut').innerText='[演示] '+document.getElementById('transInput').value+' → Hello'">翻译</button><div id="transOut"></div><button onclick="closeModal()">关闭</button>`;
        else if(toolId === 'qrcode') content.innerHTML = `<h3>二维码生成</h3><input id="qrText" placeholder="文本/网址"><button onclick="let url='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(document.getElementById('qrText').value); document.getElementById('qrImg').src=url;">生成</button><br><img id="qrImg"><br><button onclick="closeModal()">关闭</button>`;
        else if(toolId === 'pwd') content.innerHTML = `<h3>随机密码</h3><button onclick="let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';let pwd=Array.from({length:12},()=>chars[Math.floor(Math.random()*chars.length)]).join('');document.getElementById('pwdRes').innerText=pwd;">生成</button><div id="pwdRes"></div><button onclick="closeModal()">关闭</button>`;
        modal.classList.add('active');
        window.closeModal = ()=> modal.classList.remove('active');
        document.querySelectorAll('#toolModalContent button').forEach(btn=>{ if(btn.onclick) return; btn.addEventListener('click',function(){if(this.innerText==='关闭') modal.classList.remove('active');}); });
    }
    function buildTools() { let strip = document.getElementById('toolsStrip'); strip.innerHTML = tools.map(t=>`<div class="tool-card" data-tool="${t.id}">${t.name}</div>`).join(''); document.querySelectorAll('.tool-card').forEach(el=>el.addEventListener('click',()=>openToolModal(el.dataset.tool))); }
    // 引擎切换+抽屉
    function renderDrawerEngine(){ let box = document.getElementById('drawerEngineList'); box.innerHTML = ''; engines.forEach(e=>{ let btn = document.createElement('button'); btn.className='small-btn'; btn.innerText=e.name; if(currentEngine.id===e.id) btn.style.background='#4c9aff'; btn.onclick=()=>{currentEngine=e;saveAllData();toastMsg(`引擎切换为${e.name}`);renderDrawerEngine();}; box.appendChild(btn); }); }
    // 初始化UI、事件监听
    function init(){
        loadAllData(); buildTools(); renderGrid(); renderRecent(); renderBookmarks(); renderSearchHistory(); renderDrawerEngine();
        document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sideDrawer').classList.add('open'));
        document.getElementById('closeDrawer').addEventListener('click',()=>document.getElementById('sideDrawer').classList.remove('open'));
        document.getElementById('openSettingsBtn').addEventListener('click',()=>document.getElementById('settingsModal').classList.add('active'));
        document.getElementById('closeSettingsBtn').addEventListener('click',()=>{ settings.gridCols = document.getElementById('gridColsSelect').value; settings.cardSize = document.getElementById('cardSizeSelect').value; settings.showName = document.getElementById('showNameToggle').checked; settings.iconMode = document.getElementById('iconModeSelect').value; let theme = document.getElementById('bgThemeSelect').value; if(theme==='dark') document.body.classList.remove('light'); else if(theme==='light') document.body.classList.add('light'); else { if(window.matchMedia('(prefers-color-scheme: light)').matches) document.body.classList.add('light'); else document.body.classList.remove('light'); } saveAllData(); renderGrid(); document.getElementById('settingsModal').classList.remove('active'); toastMsg("设置已应用"); });
        document.getElementById('themeToggleBtn').addEventListener('click',()=>{ document.body.classList.toggle('light'); settings.bgTheme = document.body.classList.contains('light')?'light':'dark'; saveAllData(); });
        document.getElementById('quickSearchIcon').addEventListener('click',performQuickSearch);
        document.getElementById('quickSearchInput').addEventListener('keypress',e=>{if(e.key==='Enter')performQuickSearch();});
        document.getElementById('addBookmarkBtn').addEventListener('click',()=>{ let name=prompt('网站名称'); let url=prompt('网址'); if(name&&url){ let newId=Date.now()+''; userBookmarks.push({id:newId,name,url}); saveAllData(); buildCardList(null); renderBookmarks(); toastMsg("收藏添加成功"); } });
        document.getElementById('exportBookmarks').addEventListener('click',()=>{ let dataStr=JSON.stringify(userBookmarks); let blob=new Blob([dataStr],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bookmarks.json'; a.click(); });
        document.getElementById('importBookmarks').addEventListener('click',()=>{ let fileInput=document.getElementById('importFile'); fileInput.onchange=(e)=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=ev=>{ let imported=JSON.parse(ev.target.result); userBookmarks.push(...imported); saveAllData(); buildCardList(null); renderBookmarks(); toastMsg("导入完成"); }; reader.readAsText(file); }; fileInput.click(); });
        document.getElementById('clearRecent').addEventListener('click',()=>{ recentSites=[]; saveAllData(); renderRecent(); });
        document.getElementById('logoRefresh').addEventListener('click',()=>location.reload());
        window.addEventListener('keydown',(e)=>{ if(e.key === '/' || (e.ctrlKey && e.key === 'k')){ e.preventDefault(); document.getElementById('quickSearchInput').focus(); } if(e.key === 'Escape'){ document.querySelectorAll('.modal-glass.active').forEach(m=>m.classList.remove('active')); document.getElementById('sideDrawer').classList.remove('open'); } });
        // 语音搜索
        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition){ let recog = new SpeechRecognition(); recog.lang='zh-CN'; document.getElementById('quickSearchInput').parentElement.insertAdjacentHTML('beforeend','<span id="micBtn" style="cursor:pointer;">🎤</span>'); document.getElementById('micBtn').addEventListener('click',()=>{ recog.start(); recog.onresult=(event)=>{ document.getElementById('quickSearchInput').value=event.results[0][0].transcript; performQuickSearch(); }; }); }
        toastMsg("✨ 灵犀导航增强版 | 拖拽排序 / 右键菜单 / 快捷键 / 侧边栏");
    }
    init();
</script>
</body>
</html>
