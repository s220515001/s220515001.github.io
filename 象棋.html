<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>知冷暖 · 沉浸天气</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 16px;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            background: #1a1a2e;
        }
        /* Canvas 背景层 */
        #weatherCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        /* 内容层 */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== 毛玻璃卡片 ===== */
        .glass {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.20);
            border-radius: 28px;
            transition: all 0.3s ease;
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
        }

        /* ===== 暗色模式（微调） ===== */
        [data-theme="dark"] .glass {
            background: rgba(20, 30, 50, 0.50);
            border-color: rgba(255, 255, 255, 0.06);
        }
        [data-theme="dark"] .glass-light {
            background: rgba(20, 30, 50, 0.30);
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 60px;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        .logo i {
            color: #fdcb6e;
            filter: drop-shadow(0 2px 8px rgba(253, 203, 110, 0.3));
        }
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            padding: 2px 2px 2px 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            transition: 0.3s;
        }
        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.20);
            border-color: #fdcb6e;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            padding: 6px 0;
            font-size: 0.9rem;
            color: #fff;
            width: 100px;
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .search-box button {
            background: #fdcb6e;
            border: none;
            border-radius: 40px;
            padding: 5px 14px;
            font-weight: 700;
            color: #2d3436;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-box button:hover {
            background: #f9ca24;
            transform: scale(1.02);
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            padding: 6px 14px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.20);
        }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            padding: 6px 12px;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.20);
            transform: rotate(15deg);
        }

        /* ===== 预警 ===== */
        .alert-banner {
            background: rgba(255, 0, 0, 0.20);
            border-left: 8px solid #ff6b6b;
            padding: 14px 20px;
            border-radius: 24px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 0, 0.15);
            transition: 0.3s;
        }
        .alert-banner.hidden {
            display: none;
        }
        .alert-content {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }
        .alert-content i {
            font-size: 2rem;
            color: #ff6b6b;
        }
        .alert-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }
        .alert-desc {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffd93d;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .alert-list {
            margin-top: 4px;
            font-size: 0.9rem;
            opacity: 0.9;
            color: #fff;
        }
        .alert-close {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
            margin-left: auto;
        }
        .alert-close:hover {
            background: rgba(255, 255, 255, 0.30);
        }

        /* ===== 当前天气（主卡片） ===== */
        .current-weather {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: stretch;
            padding: 22px 26px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 36px;
            gap: 14px;
        }
        .weather-main {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 2 1 280px;
        }
        .weather-icon-big {
            font-size: 4.5rem;
            line-height: 1;
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.15));
            animation: floatIcon 4s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.04);
            }
        }
        .temp-group {
            display: flex;
            flex-direction: column;
        }
        .temp-big {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 70%, rgba(255, 255, 255, 0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.10);
            filter: drop-shadow(0 4px 16px rgba(253, 203, 110, 0.15));
        }
        .temp-big sup {
            font-size: 1.6rem;
            top: -0.4em;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.7);
        }
        .weather-desc-big {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.95;
            margin-top: 2px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
        }
        .city-name {
            font-size: 0.95rem;
            opacity: 0.75;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 1px;
            color: #fff;
        }

        /* 右侧高亮 */
        .weather-highlights {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            flex: 1 1 160px;
            gap: 6px;
        }
        .precip-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .precip-badge i {
            color: #74b9ff;
        }
        .feels-like {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.80);
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* 数据网格（直观化） */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            width: 100%;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }
        .data-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .data-item .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            color: #fff;
        }
        .data-item .value {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .data-item .bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }
        .data-item .bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* ===== 空气质量卡片 ===== */
        .aqi-card {
            padding: 16px 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .aqi-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0;
            background: none;
            backdrop-filter: none;
            border: none;
            border-radius: 0;
        }
        .aqi-card .header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.8;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .aqi-value {
            font-size: 2.2rem;
            font-weight: 800;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .aqi-value .label {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.6;
        }
        .aqi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .aqi-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 6px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .aqi-item .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            opacity: 0.4;
            color: #fff;
        }
        .aqi-item .value {
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
        }

        /* ===== 分钟级降水 ===== */
        .rain-chart {
            padding: 16px 20px 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .rain-chart h3 {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.8;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .rain-bars {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 60px;
            padding: 4px 0;
        }
        .rain-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            height: 100%;
            justify-content: flex-end;
        }
        .rain-bar {
            width: 100%;
            max-width: 24px;
            min-height: 2px;
            border-radius: 4px 4px 0 0;
            background: #74b9ff;
            transition: height 0.4s ease;
            position: relative;
        }
        .rain-bar-wrap .time {
            font-size: 0.45rem;
            opacity: 0.4;
            color: #fff;
            margin-top: 2px;
        }
        .rain-bar-wrap .val {
            font-size: 0.5rem;
            font-weight: 600;
            opacity: 0.6;
            color: #fff;
        }

        /* ===== 穿衣指南 ===== */
        .dress-guide {
            padding: 16px 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .dress-guide h3 {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.8;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .dress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .dress-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .dress-card .day {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }
        .dress-card .temp-range {
            font-size: 0.7rem;
            opacity: 0.6;
            color: #fff;
            margin: 2px 0 4px;
        }
        .dress-card .advice {
            font-size: 0.8rem;
            color: #fff;
            opacity: 0.9;
            line-height: 1.4;
        }
        .dress-card .advice i {
            margin-right: 4px;
            color: #fdcb6e;
        }

        /* ===== 小时预报 ===== */
        .forecast-module {
            padding: 16px 20px 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .forecast-module h3 {
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            font-size: 0.95rem;
            color: #fff;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.20);
            border-radius: 4px;
            outline: none;
            transition: 0.2s;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fdcb6e;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
        }
        .slider-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fdcb6e;
            cursor: pointer;
            border: none;
        }
        .slider-time-label {
            font-weight: 700;
            min-width: 50px;
            text-align: center;
            font-size: 0.85rem;
            color: #fff;
        }
        .hourly-detail-card {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 10px;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .hourly-detail-card .detail {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #fff;
        }
        .hourly-mini {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        .hourly-mini::-webkit-scrollbar {
            height: 3px;
        }
        .hourly-mini::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .mini-item {
            flex: 0 0 52px;
            text-align: center;
            padding: 4px 0;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .mini-item.active {
            background: rgba(253, 203, 110, 0.15);
            border-color: #fdcb6e;
        }
        .mini-item .time {
            font-size: 0.55rem;
            opacity: 0.6;
            color: #fff;
        }
        .mini-item .icon {
            font-size: 1.1rem;
            margin: 1px 0;
        }
        .mini-item .temp {
            font-weight: 700;
            font-size: 0.75rem;
            color: #fff;
        }

        /* ===== 7天预报 + 天文 ===== */
        .daily-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 700px) {
            .daily-grid {
                grid-template-columns: 1fr;
            }
        }
        .daily-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 16px 18px;
        }
        .daily-card h3 {
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #fff;
        }
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .daily-row .day {
            font-weight: 600;
            width: 44px;
            color: #fff;
            font-size: 0.8rem;
        }
        .daily-row .d-icon {
            font-size: 1rem;
            width: 28px;
            text-align: center;
        }
        .daily-row .d-temp {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .daily-row .d-temp .min {
            opacity: 0.4;
            margin-left: 4px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
        }
        .daily-row .d-precip {
            font-size: 0.6rem;
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 3px;
            color: #fff;
        }

        /* 天文弧线 */
        .astro-arc {
            width: 100%;
            margin: 4px 0 6px 0;
        }
        .astro-arc svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .arc-label {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: center;
            margin-top: 2px;
            color: #fff;
        }
        .arc-label span {
            display: inline-block;
            margin: 0 6px;
        }
        .arc-time-list {
            font-size: 0.6rem;
            opacity: 0.5;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            justify-content: center;
            color: #fff;
        }

        /* ===== 更多参数（折叠） ===== */
        .extra-data {
            margin-top: 4px;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .extra-data summary {
            cursor: pointer;
            font-weight: 600;
            opacity: 0.5;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 0.85rem;
        }
        .extra-data summary:hover {
            opacity: 1;
        }
        .extra-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .extra-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .extra-item .label {
            font-size: 0.5rem;
            opacity: 0.4;
            color: #fff;
        }
        .extra-item .value {
            font-weight: 600;
            margin-top: 1px;
            color: #fff;
            font-size: 0.8rem;
        }

        /* ===== 加载 ===== */
        .skeleton {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,

        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {

            }
            .aqi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>

<body>

    <!-- Canvas 动效背景 -->
    <canvas id="weatherCanvas"></canvas>

    <!-- Toast -->
    <div id="toast" class="toast"><i class="fas fa-info-circle"></i> <span id="toastMsg"></span></div>

    <div class="app">
        <!-- 顶部导航 -->
        <header class="header glass">
            <div class="logo"><i class="fas fa-cloud-sun"></i> 知冷暖</div>
            <div class="controls">

                    <input type="text" id="searchInput" placeholder="城市..." autofocus />
                    <button id="searchBtn"><i class="fas fa-search"></i></button>

        <!-- 预警 -->
        <div id="alertBanner" class="alert-banner hidden">

        <div id="weatherContent">
            <!-- 加载骨架 -->

                        <div class="data-item"><div class="label">风速</div><div class="value" id="windVal">-- km/h</div><div class="bar"><div class="fill" id="windBar" style="width:0%;background:#a29bfe;"></div></div></div>
                        <div class="data-item"><div class="label">气压</div><div class="value" id="pressureVal">-- hPa</div><div class="bar"><div class="fill" id="pressureBar" style="width:0%;background:#fd79a8;"></div></div></div>
                        <div class="data-item"><div class="label">紫外线</div><div class="value" id="uvVal">--</div><div class="bar"><div class="fill" id="uvBar" style="width:0%;background:#fdcb6e;"></div></div></div>

                        <div class="aqi-item"><div class="label">CO</div><div class="value" id="aqiCo">--</div></div>
                    </div>

                <!-- 分钟级降水 -->
                <div class="rain-chart glass" id="rainChart">
                    <h3><i class="fas fa-cloud-rain"></i> 未来90分钟降水</h3>
                    <div class="rain-bars" id="rainBars"></div>
                </div>

                <!-- 穿衣指南 -->
                <div class="dress-guide glass" id="dressGuide">
                    <h3><i class="fas fa-vest"></i> 未来3天穿衣指南</h3>
                    <div class="dress-grid" id="dressGrid"></div>
                </div>

                <!-- 小时预报 -->
                <div class="forecast-module glass">
                    <h3><i class="fas fa-clock"></i> 逐小时预报</h3>
                    <div class="slider-row">
                        <input type="range" id="hourlySlider" min="0" max="0" value="0" step="1">
                        <span class="slider-time-label" id="sliderTimeLabel">现在</span>
                    </div>
                    <div class="hourly-detail-card" id="hourlyDetail">
                        <div class="detail"><i class="fas fa-thermometer-half"></i> <span id="detailTemp">--°C</span></div>
                        <div class="detail"><i class="fas fa-cloud"></i> <span id="detailIcon"><i class="fas fa-cloud"></i> --</span></div>
                        <div class="detail"><i class="fas fa-tint"></i> <span id="detailPrecip">-- mm</span></div>
                        <div class="detail"><i class="fas fa-wind"></i> <span id="detailWind">-- km/h</span></div>
                    </div>
                    <div class="hourly-mini" id="hourlyMiniPreview"></div>

                <!-- 7天预报 + 天文 -->
                <div class="daily-grid">
                    <div class="daily-card glass">
                        <h3><i class="fas fa-calendar-week"></i> 7天预报</h3>
                        <div class="daily-list" id="dailyContainer"></div>
                    </div>
                    <div class="daily-card glass" id="astroCard">
                        <h3><i class="fas fa-sun"></i> 日出日落 · 月出月落</h3>
                        <div id="astroContainer"></div>
                    </div>
                </div>

                <!-- 更多参数 -->
                <details class="extra-data glass" style="padding:12px 20px;border-radius:28px;margin-bottom:16px;">
                    <summary><i class="fas fa-chevron-down"></i> 更多参数</summary>
                    <div class="extra-grid" id="extraGrid"></div>
                </details>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. Canvas 背景动效
        // ============================================================
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let particles = [];
        let weatherType = 'clear'; // sunny, cloudy, rainy, snowy, thunder, mist

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 粒子系统
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.6 + 0.3;
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
                this.type = 'rain';
                this.wobble = Math.random() * 100;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobble) * 0.2;
                this.wobble += this.wobbleSpeed;
                this.life--;
                if (this.y > H + 20 || this.x < -20 || this.x > W + 20 || this.life <= 0) {
                    this.reset();
                    this.y = -10 - Math.random() * 20;
                    this.x = Math.random() * W;
                    this.life = this.maxLife;
                }
            }
            draw(ctx) {
                ctx.globalAlpha = this.opacity * (this.life / this.maxLife);
                ctx.fillStyle = '#fff';
                if (weatherType === 'rainy' || weatherType === 'thunder') {
                    ctx.strokeStyle = `rgba(150, 200, 255, ${this.opacity * 0.6})`;
                    ctx.lineWidth = this.size * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.speedX * 2, this.y + this.speedY * 4);
                    ctx.stroke();
                } else if (weatherType === 'snowy') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.7})`;
                    ctx.fill();
                } else if (weatherType === 'sunny') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity * 0.3})`;
                    ctx.fill();
                } else if (weatherType === 'mist') {
                    ctx.fillStyle = `rgba(200, 210, 220, ${this.opacity * 0.08})`;
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, this.size * 10, this.size * 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function initParticles(count, type) {
            particles = [];
            weatherType = type;
            for (let i = 0; i < count; i++) {
                const p = new Particle();
                p.type = type;
                if (type === 'snowy') { p.speedY = Math.random() * 0.8 + 0.3;
                    p.size = Math.random() * 4 + 2;
                    p.speedX = (Math.random() - 0.5) * 0.3; }
                if (type === 'sunny') { p.speedY = (Math.random() - 0.5) * 0.2;
                    p.speedX = (Math.random() - 0.5) * 0.2;
                    p.size = Math.random() * 3 + 1;
                    p.opacity = Math.random() * 0.3 + 0.1; }
                if (type === 'mist') { p.speedY = (Math.random() - 0.5) * 0.1;
                    p.speedX = (Math.random() - 0.5) * 0.2;
                    p.size = Math.random() * 5 + 3;
                    p.opacity = Math.random() * 0.2 + 0.05; }
                if (type === 'thunder') { p.speedY = Math.random() * 4 + 2;
                    p.size = Math.random() * 2 + 1; }
                particles.push(p);
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, W, H);
            // 雷暴闪电
            if (weatherType === 'thunder' && Math.random() < 0.02) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3 + 0.1})`;
                ctx.fillRect(0, 0, W, H);
            }
            particles.forEach(p => { p.update();
                p.draw(ctx); });
            requestAnimationFrame(drawCanvas);
        }

        // 切换天气动效
        function setWeatherEffect(code) {
            let type = 'clear';
            let count = 30;
            if ([0, 1].includes(code)) { type = 'sunny';
                count = 40; } else if ([2, 3].includes(code)) { type = 'cloudy';
                count = 25; } else if ([45, 48].includes(code)) { type = 'mist';
                count = 30; } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) { type = 'rainy';
                count = 160; } else if ([71, 73, 75].includes(code)) { type = 'snowy';
                count = 120; } else if ([95, 96, 99].includes(code)) { type = 'thunder';
                count = 180; } else { type = 'clear';
                count = 30; }
            if (weatherType !== type) {
                initParticles(count, type);
            }
        }

        // 启动Canvas
        initParticles(60, 'clear');
        drawCanvas();

        // ============================================================
        // 2. API 配置
        // ============================================================
        const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';
        const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
        const ASTRONOMY_API = 'https://api.open-meteo.com/v1/astronomy';
        const AIR_API = 'https://api.open-meteo.com/v1/air-quality';
        const CACHE_KEY = 'weather_cache_v2';
        const CACHE_TTL = 10 * 60 * 1000;

        const WMO_MAP = {
            0: { icon: 'fa-sun', desc: '晴' },
            1: { icon: 'fa-cloud-sun', desc: '少云' },
            2: { icon: 'fa-cloud', desc: '多云' },
            3: { icon: 'fa-cloud', desc: '阴' },
            45: { icon: 'fa-smog', desc: '雾' },
            48: { icon: 'fa-smog', desc: '雾' },
            51: { icon: 'fa-cloud-rain', desc: '小毛毛雨' },
            53: { icon: 'fa-cloud-rain', desc: '毛毛雨' },
            55: { icon: 'fa-cloud-rain', desc: '大毛毛雨' },
            61: { icon: 'fa-cloud-rain', desc: '小雨' },
            63: { icon: 'fa-cloud-rain', desc: '中雨' },
            65: { icon: 'fa-cloud-rain', desc: '大雨' },
            71: { icon: 'fa-snowflake', desc: '小雪' },
            73: { icon: 'fa-snowflake', desc: '中雪' },
            75: { icon: 'fa-snowflake', desc: '大雪' },
            80: { icon: 'fa-cloud-showers-heavy', desc: '阵雨' },
            81: { icon: 'fa-cloud-showers-heavy', desc: '阵雨' },
            82: { icon: 'fa-cloud-showers-heavy', desc: '阵雨' },
            95: { icon: 'fa-bolt', desc: '雷暴' },
            96: { icon: 'fa-bolt', desc: '雷暴' },
            99: { icon: 'fa-bolt', desc: '雷暴' },
        };

        function getWeatherInfo(code) { return WMO_MAP[code] || { icon: 'fa-cloud', desc: '未知' }; }

        // ============================================================
        // 3. 状态
        // ============================================================
        let hourlyData = [],
            sliderIndex = 0,
            isDark = false,
            currentCity = '未知',
            currentCoords = { lat: 39.9042, lon: 116.4074 },
            isLoading = false,
            refreshTimer = null;
        const $ = id => document.getElementById(id);
        const loadingSkeleton = $('loadingSkeleton'),
            dataContainer = $('dataContainer');
        const mainIcon = $('mainIcon'),
            currentTemp = $('currentTemp'),
            weatherDesc = $('weatherDesc'),
            cityName = $('cityName');
        const feelsLike = $('feelsLike'),
            precipPercent = $('precipPercent');
        const humidityVal = $('humidityVal'),
            windVal = $('windVal'),
            pressureVal = $('pressureVal'),
            uvVal = $('uvVal');
        const humidityBar = $('humidityBar'),
            windBar = $('windBar'),
            pressureBar = $('pressureBar'),
            uvBar = $('uvBar');
        const suggestionsContainer = $('suggestionsContainer'),
            dailyContainer = $('dailyContainer'),
            astroContainer = $('astroContainer');
        const extraGrid = $('extraGrid'),
            searchInput = $('searchInput'),
            searchBtn = $('searchBtn'),
            locateBtn = $('locateBtn');
        const refreshBtn = $('refreshBtn'),
            themeToggle = $('themeToggle'),
            alertBanner = $('alertBanner'),
            alertTitle = $('alertTitle');
        const alertDesc = $('alertDesc'),
            alertList = $('alertList'),
            alertClose = $('alertClose');
        const hourlySlider = $('hourlySlider'),
            sliderTimeLabel = $('sliderTimeLabel'),
            detailTemp = $('detailTemp');
        const detailIcon = $('detailIcon'),
            detailPrecip = $('detailPrecip'),
            detailWind = $('detailWind');
        const hourlyMiniPreview = $('hourlyMiniPreview'),
            toast = $('toast'),
            toastMsg = $('toastMsg');
        const rainBars = $('rainBars'),
            dressGrid = $('dressGrid');
        const aqiValue = $('aqiValue'),
            aqiLevel = $('aqiLevel'),
            aqiPm25 = $('aqiPm25'),
            aqiPm10 = $('aqiPm10'),
            aqiO3 = $('aqiO3'),
            aqiNo2 = $('aqiNo2'),
            aqiSo2 = $('aqiSo2'),
            aqiCo = $('aqiCo');

        // ============================================================
        // 4. 工具
        // ============================================================
        function showToast(msg, icon = 'fa-info-circle') {
            toastMsg.textContent = msg;
            toast.querySelector('i').className = 'fas ' + icon;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showLoading(show) { loadingSkeleton.style.display = show ? 'block' : 'none';
            dataContainer.style.display = show ? 'none' : 'block'; }

        function getCurrentPosition() { return new Promise((resolve, reject) => { if (!navigator.geolocation) reject(
                    new Error('定位不支持'));
                navigator.geolocation.getCurrentPosition(pos => resolve({ lat: pos.coords.latitude, lon: pos.coords
                        .longitude }), err => reject(err)); }); }

        async function fetchCityName(lat, lon) {
            const res = await fetch(`${GEO_API}?latitude=${lat}&longitude=${lon}&count=1&language=zh`);
            const data = await res.json();
            if (data.results && data.results.length) return data.results[0].name;
            return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
        }

        async function searchCity(city) {
            const res = await fetch(`${GEO_API}?name=${encodeURIComponent(city)}&count=1&language=zh`);
            const data = await res.json();
            if (data.results && data.results.length) { const r = data.results[0]; return { lat: r.latitude, lon: r
                        .longitude, name: r.name }; }
            throw new Error('未找到该城市');
        }

        function saveCache(data, city, coords) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, city, coords,
                    timestamp: Date.now() })); } catch (e) {} }

        function getCache() { try { const raw = localStorage.getItem(CACHE_KEY); if (!raw) return null; const cache = JSON
                    .parse(raw); if (Date.now() - cache.timestamp > CACHE_TTL) return null; return cache; } catch { return null; } }

        function formatTime(date) { if (!date) return '--:--'; return date.getHours().toString().padStart(2, '0') + ':' + date
                .getMinutes().toString().padStart(2, '0'); }

        function getAQILevel(aqi) {
            if (aqi <= 50) return { level: '优', color: '#00e400' };
            if (aqi <= 100) return { level: '良', color: '#ffff00' };
            if (aqi <= 150) return { level: '轻度污染', color: '#ff7e00' };
            if (aqi <= 200) return { level: '中度污染', color: '#ff0000' };
            if (aqi <= 300) return { level: '重度污染', color: '#8f3f97' };
            return { level: '严重污染', color: '#7e0023' };
        }

        // ============================================================
        // 5. 核心数据获取
        // ============================================================
        async function fetchAllData(lat, lon) {
            const weatherParams = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,pressure_msl,visibility,cloud_cover,uv_index',
                hourly: 'temperature_2m,precipitation,weather_code,wind_speed_10m',
                minutely_15: 'precipitation',
                daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset',
                timezone: 'auto',
                forecast_days: '7',
                alerts: 'true'
            });
            const astroParams = new URLSearchParams({ latitude: lat, longitude: lon, daily: 'moonrise,moonset',
                timezone: 'auto', forecast_days: '7' });
            const airParams = new URLSearchParams({ latitude: lat, longitude: lon, current: 'us_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide',
                timezone: 'auto' });

            const [weatherRes, astroRes, airRes] = await Promise.all([
                fetch(`${WEATHER_API}?${weatherParams}`),
                fetch(`${ASTRONOMY_API}?${astroParams}`),
                fetch(`${AIR_API}?${airParams}`)
            ]);

            if (!weatherRes.ok) throw new Error('获取天气数据失败');
            const weatherData = await weatherRes.json();
            let astroData = null,
                airData = null;
            if (astroRes.ok) astroData = await astroRes.json();
            if (airRes.ok) airData = await airRes.json();

            if (astroData && astroData.daily) { weatherData.daily.moonrise = astroData.daily.moonrise;
                weatherData.daily.moonset = astroData.daily.moonset; } else { weatherData.daily.moonrise = [];
                weatherData.daily.moonset = []; }
            if (airData && airData.current) { weatherData.air_quality = airData.current; }

            return weatherData;
        }

        // ============================================================
        // 6. 渲染（全部）
        // ============================================================
        function renderAll(data, city, coords) {
            const current = data.current,
                hourly = data.hourly,
                daily = data.daily,
                minutely = data.minutely_15 || { precipitation: [] },
                alerts = data.alerts || [],
                air = data.air_quality || {};

            const code = current.weather_code;
            setWeatherEffect(code);
            document.body.style.background = 'transparent';

            const info = getWeatherInfo(code);
            mainIcon.innerHTML = `<i class="fas ${info.icon}"></i>`;
            currentTemp.innerHTML = `${Math.round(current.temperature_2m)}<sup>°C</sup>`;
            weatherDesc.textContent = info.desc;
            cityName.querySelector('span').textContent = city;
            feelsLike.textContent = Math.round(current.apparent_temperature) + '°C';

            // 降水概率
            let pChance = 0;
            if (current.precipitation > 0) pChance = 100;
            else {
                const now = new Date();
                const idx = hourly.time.findIndex(t => new Date(t) >= now);
                for (let i = idx; i < Math.min(idx + 4, hourly.time.length); i++) { if (hourly.precipitation[i] > 0) { pChance =
                            60 + i * 10; break; } }
            }
            precipPercent.textContent = Math.min(100, pChance) + '%';

            // 数据网格
            const hum = Math.round(current.relative_humidity_2m);
            const wind = Math.round(current.wind_speed_10m);
            const pres = current.pressure_msl ? Math.round(current.pressure_msl) : 1013;
            const uv = current.uv_index || 0;
            humidityVal.textContent = hum + '%';
            windVal.textContent = wind + ' km/h';
            pressureVal.textContent = pres + ' hPa';
            uvVal.textContent = uv.toFixed(1);
            humidityBar.style.width = Math.min(100, hum) + '%';
            windBar.style.width = Math.min(100, (wind / 60) * 100) + '%';
            pressureBar.style.width = Math.min(100, ((pres - 980) / 60) * 100) + '%';
            uvBar.style.width = Math.min(100, (uv / 11) * 100) + '%';

            // 预警
            if (alerts.length) {
                alertBanner.classList.remove('hidden');
                const first = alerts[0];
                alertTitle.textContent = first.event || '天气预警';
                alertDesc.textContent = (first.headline || '') + ' ' + (first.description || '').substring(0, 100) + '...';
                alertDesc.style.fontSize = '1.2rem';
                alertDesc.style.fontWeight = 'bold';
                alertDesc.style.color = '#ffd93d';
                if (alerts.length > 1) alertList.innerHTML = alerts.slice(1).map(a =>
                    `• ${a.event||'预警'}: ${(a.headline||'').substring(0,40)}`).join('<br>');
                else alertList.innerHTML = '';
            } else alertBanner.classList.add('hidden');

            // ---- 空气质量 ----
            const aqi = air.us_aqi || 0;
            const aqiInfo = getAQILevel(aqi);
            aqiValue.innerHTML = `${Math.round(aqi)} <span class="label">AQI</span>`;
            aqiLevel.textContent = aqiInfo.level;
            aqiLevel.style.color = aqiInfo.color;
            aqiPm25.textContent = air.pm2_5 ? air.pm2_5.toFixed(1) : '--';
            aqiPm10.textContent = air.pm10 ? air.pm10.toFixed(1) : '--';
            aqiO3.textContent = air.ozone ? air.ozone.toFixed(1) : '--';
            aqiNo2.textContent = air.nitrogen_dioxide ? air.nitrogen_dioxide.toFixed(1) : '--';
            aqiSo2.textContent = air.sulphur_dioxide ? air.sulphur_dioxide.toFixed(1) : '--';
            aqiCo.textContent = air.carbon_monoxide ? air.carbon_monoxide.toFixed(1) : '--';

            // ---- 分钟级降水（未来90分钟，6个点） ----
            const rainData = minutely.precipitation || [];
            const now = new Date();
            const startIdx = minutely.time ? minutely.time.findIndex(t => new Date(t) >= now) : 0;
            const rainSlice = [];
            for (let i = startIdx; i < Math.min(startIdx + 6, rainData.length); i++) {
                rainSlice.push({ time: new Date(minutely.time[i]), val: rainData[i] || 0 });
            }
            while (rainSlice.length < 6) { rainSlice.push({ time: new Date(now.getTime() + rainSlice.length * 15 * 60000),
                    val: 0 }); }
            let rainHTML = '';
            const maxRain = Math.max(0.1, ...rainSlice.map(d => d.val));
            rainSlice.forEach((d, i) => {
                const h = maxRain > 0 ? (d.val / maxRain) * 100 : 0;
                const label = i === 0 ? '现在' : (i * 15 + 15) + "'";
                rainHTML += `<div class="rain-bar-wrap">
                        <div class="val">${d.val.toFixed(1)}</div>
                        <div class="rain-bar" style="height:${Math.max(4, h)}%;background:${d.val>0 ? '#74b9ff' : 'rgba(255,255,255,0.08)'};"></div>
                        <div class="time">${label}</div>
                    </div>`;
            });
            rainBars.innerHTML = rainHTML;

            // ---- 穿衣指南（未来3天） ----
            const days = ['今天', '明天', '后天'];
            let dressHTML = '';
            for (let i = 0; i < Math.min(3, daily.time.length); i++) {
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const prec = daily.precipitation_sum[i] || 0;
                const wCode = daily.weather_code[i];
                const isRain = [51, 53, 55, 61, 63, 65, 80, 81, 82].includes(wCode);
                const isSnow = [71, 73, 75].includes(wCode);
                const isCold = max < 5;
                const isHot = max > 28;
                let advice = '';
                if (isCold) advice = '❄️ 羽绒服+厚毛衣，戴帽子手套';
                else if (max < 10) advice = '🧥 厚外套+毛衣，注意保暖';
                else if (max < 16) advice = '🧥 风衣/夹克+长袖';
                else if (max < 22) advice = '👕 长袖T恤+薄外套';
                else if (max < 28) advice = '👕 短袖+薄衫，舒适';
                else advice = '🩳 短袖+防晒，多喝水';
                if (isRain) advice += ' 🌂 带伞';
                if (isSnow) advice += ' ⛄ 防滑鞋';
                if (prec > 10) advice += ' 💧 注意防水';
                dressHTML += `<div class="dress-card">
                        <div class="day">${days[i]}</div>
                        <div class="temp-range">${max}° / ${min}°  ${isRain?'🌧':isSnow?'❄️':''}</div>
                        <div class="advice">${advice}</div>
                    </div>`;
            }
            dressGrid.innerHTML = dressHTML;

            // ---- 小时预报 ----
            const now2 = new Date();
            const sIdx = hourly.time.findIndex(t => new Date(t) >= now2);
            const eIdx = Math.min(sIdx + 24, hourly.time.length);
            hourlyData = [];
            for (let i = sIdx; i < eIdx; i++) {
                hourlyData.push({ time: new Date(hourly.time[i]), temp: hourly.temperature_2m[i], code: hourly
                        .weather_code[i], precip: hourly.precipitation[i], wind: hourly.wind_speed_10m[i] });
            }
            if (hourlyData.length === 0) hourlyData = [{ time: now2, temp: 0, code: 0, precip: 0, wind: 0 }];
            hourlySlider.max = hourlyData.length - 1;
            hourlySlider.value = 0;
            updateSlider(0);
            renderMiniPreview();

            // ---- 7天预报 ----
            const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            let dHTML = '';
            for (let i = 0; i < Math.min(7, daily.time.length); i++) {
                const d = new Date(daily.time[i]);
                const day = week[d.getDay()];
                const icon = getWeatherInfo(daily.weather_code[i]).icon;
                const max = Math.round(daily.temperature_2m_max[i]),
                    min = Math.round(daily.temperature_2m_min[i]);
                const p = daily.precipitation_sum[i] || 0;
                const ratio = (max + 10) / 50;
                const hue = 210 - ratio * 180;
                const color = `hsl(${Math.min(210, Math.max(30, hue))}, 80%, 55%)`;
                dHTML += `<div class="daily-row">
                        <span class="day">${day}</span>
                        <span class="d-icon"><i class="fas ${icon}" style="color:${color};"></i></span>
                        <span class="d-temp" style="color:${color};">${max}° <span class="min">${min}°</span></span>
                        <span class="d-precip"><i class="fas fa-tint"></i> ${p.toFixed(1)}mm</span>
                    </div>`;
            }
            dailyContainer.innerHTML = dHTML;

            // ---- 天文弧线 ----
            const tIdx = 0;
            const sunrise = daily.sunrise && daily.sunrise[tIdx] ? new Date(daily.sunrise[tIdx]) : null;
            const sunset = daily.sunset && daily.sunset[tIdx] ? new Date(daily.sunset[tIdx]) : null;
            const moonrise = daily.moonrise && daily.moonrise[tIdx] ? new Date(daily.moonrise[tIdx]) : null;
            const moonset = daily.moonset && daily.moonset[tIdx] ? new Date(daily.moonset[tIdx]) : null;
            let astroHTML = '';
            if (sunrise && sunset) {
                astroHTML += buildArcSVG(sunrise, sunset, now2, 'sun', formatTime(sunrise), formatTime(sunset));
            } else astroHTML += `<div class="arc-label" style="opacity:0.5;">日出日落不可用</div>`;
            if (moonrise && moonset) {
                astroHTML += buildArcSVG(moonrise, moonset, now2, 'moon', formatTime(moonrise), formatTime(moonset));
            } else astroHTML += `<div class="arc-label" style="opacity:0.5;">月出月落不可用</div>`;
            let futureList = '';
            for (let i = 1; i < Math.min(7, daily.time.length); i++) {
                const d = new Date(daily.time[i]);
                const day = week[d.getDay()];
                const rise = daily.sunrise[i] ? new Date(daily.sunrise[i]).toLocaleTimeString('zh-CN', { hour: '2-digit',
                    minute: '2-digit' }) : '--';
                const set = daily.sunset[i] ? new Date(daily.sunset[i]).toLocaleTimeString('zh-CN', { hour: '2-digit',
                    minute: '2-digit' }) : '--';
                futureList += `<span>${day} ☀ ${rise} / ${set}</span>`;
            }
            if (futureList) astroHTML += `<div class="arc-time-list">${futureList}</div>`;
            astroContainer.innerHTML = astroHTML;

            // ---- 更多参数 ----
            const extra = [
                { label: '今日最高', value: daily.temperature_2m_max[0] ? Math.round(daily.temperature_2m_max[0]) + '°C' :
                        '--' },
                { label: '今日最低', value: daily.temperature_2m_min[0] ? Math.round(daily.temperature_2m_min[0]) + '°C' :
                        '--' },
                { label: '降水总量', value: daily.precipitation_sum[0] ? daily.precipitation_sum[0].toFixed(1) + 'mm' :
                        '--' },
                { label: '最大风速', value: daily.wind_speed_10m_max[0] ? Math.round(daily.wind_speed_10m_max[0]) +
                        'km/h' : '--' },
                { label: '体感最高', value: daily.apparent_temperature_max[0] ? Math.round(daily.apparent_temperature_max[
                        0]) + '°C' : '--' },
                { label: '体感最低', value: daily.apparent_temperature_min[0] ? Math.round(daily.apparent_temperature_min[
                        0]) + '°C' : '--' },
                { label: '能见度', value: current.visibility ? (current.visibility / 1000).toFixed(1) + ' km' : '--' },
                { label: '云量', value: current.cloud_cover ? Math.round(current.cloud_cover) + '%' : '--' },
            ];
            extraGrid.innerHTML = extra.map(item =>
                `<div class="extra-item"><div class="label">${item.label}</div><div class="value">${item.value}</div></div>`
                ).join('');

            saveCache(data, city, coords);
            showLoading(false);
            isLoading = false;

            if (refreshTimer) clearTimeout(refreshTimer);
            let nextRefresh = 120 * 60 * 1000;
            if (current.precipitation > 0.1) nextRefresh = 5 * 60 * 1000;
            else if ([95, 96, 99].includes(current.weather_code)) nextRefresh = 3 * 60 * 1000;
            refreshTimer = setTimeout(() => { loadWeatherByCoords(coords.lat, coords.lon, city); }, nextRefresh);
        }

        // ---- 弧线辅助 ----
        function buildArcSVG(startTime, endTime, currentTime, iconType, labelStart, labelEnd) {
            if (!startTime || !endTime) return '';
            const start = startTime.getTime(),
                end = endTime.getTime(),
                now = currentTime.getTime();
            let t = 0;
            if (now < start) t = 0;
            else if (now > end) t = 1;
            else t = (now - start) / (end - start);
            t = Math.min(1, Math.max(0, t));
            const p0x = 10,
                p0y = 50,
                p1x = 50,
                p1y = 10,
                p2x = 90,
                p2y = 50;
            const cx = (1 - t) * (1 - t) * p0x + 2 * t * (1 - t) * p1x + t * t * p2x;
            const cy = (1 - t) * (1 - t) * p0y + 2 * t * (1 - t) * p1y + t * t * p2y;
            const color = iconType === 'sun' ? '#fdcb6e' : '#b0b0b0';
            const iconLabel = iconType === 'sun' ? '☀️' : '🌙';
            const path = `M ${p0x},${p0y} Q ${p1x},${p1y} ${p2x},${p2y}`;
            return `<div class="astro-arc">
                    <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
                        <path d="${path}" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" stroke-linecap="round" />
                        <circle cx="${cx}" cy="${cy}" r="5" fill="${color}" stroke="#fff" stroke-width="1.5" />
                        <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="10" fill="${color}" dominant-baseline="bottom">${iconLabel}</text>
                        <circle cx="${p0x}" cy="${p0y}" r="2" fill="rgba(255,255,255,0.2)" />
                        <circle cx="${p2x}" cy="${p2y}" r="2" fill="rgba(255,255,255,0.2)" />
                    </svg>
                    <div class="arc-label">
                        <span><i class="fas fa-arrow-right"></i> ${labelStart}</span>
                        <span><i class="fas fa-arrow-left"></i> ${labelEnd}</span>
                    </div>
                </div>`;
        }

        // ---- 小时滑块 ----
        function renderMiniPreview() {
            let html = '';
            for (let i = 0; i < hourlyData.length; i++) {
                const h = hourlyData[i];
                const timeStr = h.time.getHours().toString().padStart(2, '0') + ':' + h.time.getMinutes().toString()
                .padStart(2, '0');
                const icon = getWeatherInfo(h.code).icon;
                const temp = Math.round(h.temp);
                const active = (i === sliderIndex) ? 'active' : '';
                html +=
                    `<div class="mini-item ${active}" data-idx="${i}"><div class="time">${timeStr}</div><div class="icon"><i class="fas ${icon}"></i></div><div class="temp">${temp}°</div></div>`;
            }
            hourlyMiniPreview.innerHTML = html;
            document.querySelectorAll('.mini-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    hourlySlider.value = idx;
                    updateSlider(idx);
                });
            });
        }

        function updateSlider(index) {
            if (index < 0 || index >= hourlyData.length) return;
            const data = hourlyData[index];
            sliderIndex = index;
            const now = new Date();
            const isNow = Math.abs(data.time - now) < 60000;
            sliderTimeLabel.textContent = isNow ? '现在' : data.time.getHours().toString().padStart(2, '0') + ':' + data.time
                .getMinutes().toString().padStart(2, '0');
            detailTemp.textContent = Math.round(data.temp) + '°C';
            const info = getWeatherInfo(data.code);
            detailIcon.innerHTML = `<i class="fas ${info.icon}"></i> ${info.desc}`;
            detailPrecip.textContent = (data.precip || 0).toFixed(1) + ' mm';
            detailWind.textContent = Math.round(data.wind || 0) + ' km/h';
            document.querySelectorAll('.mini-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.idx) === index);
            });
        }

        // ============================================================
        // 7. 主加载
        // ============================================================
        async function loadWeatherByCoords(lat, lon, cityNameOverride = null) {
            if (isLoading) return;
            isLoading = true;
            showLoading(true);
            try {
                let city = cityNameOverride;
                if (!city) city = await fetchCityName(lat, lon);
                currentCity = city;
                currentCoords = { lat, lon };
                let data = null;
                let retries = 2;
                while (retries > 0) {
                    try { data = await fetchAllData(lat, lon); break; } catch (e) { retries--; if (retries === 0) throw e;
                        await new Promise(r => setTimeout(r, 1000)); }
                }
                if (data) { renderAll(data, city, { lat, lon }); return; }
            } catch (err) {
                console.warn('Fetch error:', err);
                const cache = getCache();
                if (cache && cache.city === currentCity) {
                    showToast('使用缓存数据（网络异常）', 'fa-exclamation-triangle');
                    renderAll(cache.data, cache.city, cache.coords);
                    return;
                }
                showToast('获取天气失败，请稍后重试', 'fa-exclamation-circle');
                showLoading(false);
                dataContainer.style.display = 'block';
                document.body.style.background = '#1a1a2e';
                // 填充默认占位
                mainIcon.innerHTML = '<i class="fas fa-cloud"></i>';
                currentTemp.innerHTML = '--<sup>°C</sup>';
                weatherDesc.textContent = '无法获取';
                cityName.querySelector('span').textContent = cityNameOverride || '未知';
                feelsLike.textContent = '--°C';
                precipPercent.textContent = '--%';
                humidityVal.textContent = '--%';
                windVal.textContent = '-- km/h';
                pressureVal.textContent = '-- hPa';
                uvVal.textContent = '--';
                ['humidityBar', 'windBar', 'pressureBar', 'uvBar'].forEach(id => $(id).style.width = '0%');
                dailyContainer.innerHTML = '<div style="opacity:0.5;padding:10px;">暂无数据</div>';
                astroContainer.innerHTML = '<div style="opacity:0.5;padding:10px;">天文数据不可用</div>';
                rainBars.innerHTML = '';
                dressGrid.innerHTML = '<div style="opacity:0.5;padding:10px;">暂无数据</div>';
                aqiValue.innerHTML = '-- <span class="label">AQI</span>';
                aqiLevel.textContent = '--';
                isLoading = false;
            }
            isLoading = false;
        }

        // ============================================================
        // 8. 事件
        // ============================================================
        async function handleAutoLocate() {
            try { const pos = await getCurrentPosition();
                await loadWeatherByCoords(pos.lat, pos.lon); } catch { showToast('定位失败，使用默认城市（北京）',
                    'fa-exclamation-triangle');
                await loadWeatherByCoords(39.9042, 116.4074, '北京'); }
        }

        async function handleSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            try { const result = await searchCity(q);
                await loadWeatherByCoords(result.lat, result.lon, result.name);
                searchInput.value = ''; } catch (err) { showToast(err.message, 'fa-exclamation-circle'); }
        }

        function handleRefresh() { if (currentCity) { loadWeatherByCoords(currentCoords.lat, currentCoords.lon,
                currentCity); } else { handleAutoLocate(); } }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSearch(); });
        locateBtn.addEventListener('click', handleAutoLocate);
        refreshBtn.addEventListener('click', handleRefresh);
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });
        alertClose.addEventListener('click', () => alertBanner.classList.add('hidden'));
        hourlySlider.addEventListener('input', function() { updateSlider(parseInt(this.value)); });

        // ============================================================
        // 9. 启动
        // ============================================================
        (async function init() {
            const cache = getCache();
            if (cache) {
                renderAll(cache.data, cache.city, cache.coords);
                try {
                    const newData = await fetchAllData(cache.coords.lat, cache.coords.lon);
                    renderAll(newData, cache.city, cache.coords);
                    showToast('天气已更新', 'fa-check-circle');
                } catch (e) {}
            } else {
                await handleAutoLocate();
            }
        })();
    </script>
