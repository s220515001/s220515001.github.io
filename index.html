<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>元素暗号 · 拼音转化学式加密工具</title>
    <!-- 现代无emoji，纯SVG图标，高性能动效 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #0a2540;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 极简科技风 header */
        .app-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e5072, #2c7a5a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .app-header p {
            color: #4a6f8f;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* 双列布局 卡片面板 */
        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-bottom: 1.2rem;
        }

        .card {
            flex: 1;
            min-width: 300px;
            background: #ffffff;
            border-radius: 1.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
            border-color: #cbdde6;
        }

        .card-header {
            padding: 1.4rem 1.6rem 0.6rem 1.6rem;

            align-items: center;
            gap: 12px;

        label {
            font-weight: 500;

            color: #2c5a74;
        }

        label svg {
            width: 18px;
            height: 18px;
            stroke: #3f7e66;
        }

        textarea, input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #fafdfe;
            border: 1.5px solid #dde7ed;

        }

        textarea:focus, input:focus {
            border-color: #3b8f7a;

            box-shadow: 0 0 0 3px rgba(59, 143, 122, 0.15);
            background: #ffffff;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
            align-items: center;
        }

        button {
            background: #eaedf2;
            border: none;
            font-weight: 600;
            padding: 0.65rem 1.3rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1f4e6c;
            font-family: inherit;
        }

        button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        .btn-primary {
            background: #1f5e4a;
            color: white;
            box-shadow: 0 2px 6px rgba(31, 94, 74, 0.2);
        }

        .btn-primary svg {
            stroke: white;
        }

        .btn-primary:hover {
            background: #0f4a3a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f4f8;
            border: 1px solid #cbdde6;
        }

        .btn-secondary:hover {
            background: #e2e9f0;
            transform: translateY(-1px);
        }

        .result-area {
            background: #f8fbfd;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-top: 1.3rem;
            border: 1px solid #e0edf2;
            font-family: 'SF Mono', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            white-space: pre-wrap;
            color: #155f4b;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .result-text {
            flex: 1;
            font-weight: 500;
        }

        .copy-btn {
            background: none;
            padding: 5px 10px;
            color: #3b7b68;
            border-radius: 2rem;
            font-size: 0.75rem;
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
        }

        .copy-btn:hover {
            background: #e2ece8;
        }

        .toast-msg {
            font-size: 0.7rem;
            color: #3b8a72;
            margin-left: 0.5rem;
        }

        hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid #e2edf2;
        }

        .info-note {
            background: #eff6fa;
            border-radius: 1rem;
            padding: 0.8rem;
            font-size: 0.75rem;
            color: #3f6b82;
            margin-top: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 2.2rem;
            font-size: 0.75rem;
            color: #5f8aa8;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-area {
            animation: fadeSlide 0.25s ease-out;
        }

        @media (max-width: 780px) {
            body { padding: 1rem; }
            .card-header h2 { font-size: 1.3rem; }
        }
    </style>
    <!-- 拼音转换库: pinyin-pro (高性能, 准确率99%+, 支持多音字/声调) -->
    <script src="https://unpkg.com/pinyin-pro@3.25.0/dist/index.js"></script>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>拼音化学式加密 · 元素暗号系统</h1>
        <p>中文 ↔ 拼音 ↔ 化学式 + 随机伪装 | 完全可逆 & 精准还原</p>
    </div>

    <div class="dashboard-grid">
        <!-- 加密卡片 -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none">
                    <rect x="5" y="11" width="14" height="11" rx="2" />
                    <path d="M7 11V8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8V11" />
                    <circle cx="12" cy="16" r="1.5" fill="currentColor" />
                </svg>
                <h2>加密 · 密语生成</h2>
            </div>
            <div class="card-body">
                <div class="input-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
                        中文原文 / 拼音
                    </label>
                    <textarea id="plainInput" rows="3" placeholder="例如：你好世界 或者直接拼音 ni3 hao3 shi4 jie4"></textarea>
                    <div class="action-group">
                        <button id="convertToPinyinBtn" class="btn-secondary">
                            <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M21 12L12 3L3 12M12 5v14"/></svg>
                            中文 → 带调拼音
                        </button>
                        <button id="doEncryptBtn" class="btn-primary">
                            <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                            加密为化学密文
                        </button>
                    </div>
                </div>
                <div class="result-area" id="encryptResultArea">
                    <div class="result-text" id="encryptResultText">等待加密</div>
                    <button class="copy-btn" id="copyEncryptBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        复制
                    </button>
                </div>
                <div class="info-note">
                    💡 支持中英文混合，中文自动转拼音（带声调数字格式 1-4），拼音支持声调数字格式（如 xiao3）。加密时随机选择元素+伪装下标/括号，每次结果不同但可逆。
                </div>
            </div>
        </div>

        <!-- 解密卡片 -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none">
                    <rect x="5" y="11" width="14" height="11" rx="2" />
                    <path d="M8 11V8C8 5.79 9.79 4 12 4C14.21 4 16 5.79 16 8V11" />
                    <path d="M12 16V14M15 19L12 16L9 19" />
                </svg>
                <h2>解密 · 化学式→拼音</h2>
            </div>
            <div class="card-body">
                <div class="input-group">
                    <label>
                        <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        化学式密文
                    </label>
                    <textarea id="cipherInput" rows="3" placeholder="例：(Xe1IArO)'&quot;  PErNGd&quot;  YOU'&quot;  MgErN-"></textarea>
                    <div class="action-group">
                        <button id="doDecryptBtn" class="btn-primary">
                            <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M21 12L12 3L3 12M12 5v14"/></svg>
                            解密还原拼音
                        </button>
                    </div>
                </div>
                <div class="result-area" id="decryptResultArea">
                    <div class="result-text" id="decryptResultText">等待解密</div>
                    <button class="copy-btn" id="copyDecryptBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        复制
                    </button>
                </div>
                <div class="info-note">
                    🔄 密文自动滤除数字下标和括号，基于化学符号映射表精确还原拼音（带声调），完全可逆。
                </div>
            </div>
        </div>
    </div>
    <footer>⚛️ 元素映射表 | 拼音字母 ⇄ 化学符号 (Ag, Ar, Cm ...) + 声调编码(' "-) | 随机下标/括号伪装 | 高准确率中文拼音转换</footer>
</div>

<script>
    // ---------- 1. 核心映射表 (与原始C++一致) ----------
    const mapping = {
        'a': ['Ag', 'Ar'], 'b': ['B', 'Bh', 'Br'], 'c': ['C', 'Cd', 'Cr'],
        'd': ['Dy'], 'e': ['Er'], 'f': ['F', 'Fr'], 'g': ['Gd'],
        'h': ['H', 'Hg'], 'i': ['I', 'Ir'], 'j': ['Cm'], 'k': ['K', 'Kr'],
        'l': ['Lr'], 'm': ['Md', 'Mg'], 'n': ['N', 'Nd', 'Nh'], 'o': ['O', 'Og'],
        'p': ['P', 'Pd', 'Pr'], 'q': ['Cf'], 'r': ['Rg', 'Rh'], 's': ['S', 'Sg', 'Sr'],
        't': ['Th'], 'u': ['U'], 'v': ['V'], 'w': ['W'], 'x': ['Xe'], 'y': ['Y'], 'z': ['Zr']
    };
    const toneToSym = {1: "'", 2: "\"", 3: "'\"", 4: "\"\"", 0: "-"};
    const symToTone = {"'": 1, "\"": 2, "'\"": 3, "\"\"": 4, "-": 0};

    // 反向化学符号 -> 字母映射
    const symbolToLetter = new Map();
    for (const [letter, symbols] of Object.entries(mapping)) {
        for (const sym of symbols) {
            symbolToLetter.set(sym, letter);
        }
    }
    const validSymbolsSet = new Set(symbolToLetter.keys());

    // 辅助随机
    function randInt(max) { return Math.floor(Math.random() * max); }
    function randomSubscript() { return String(randInt(3) + 1); }

    // ---------- 加密伪装 ----------
    function addFake(block) {
        // 分离声调后缀
        let tonePart = "";
        let body = block;
        const toneChars = ["'", '"', '-'];
        let pos = body.length;
        while (pos > 0 && toneChars.includes(body[pos-1])) pos--;
        if (pos < body.length) {
            tonePart = body.slice(pos);
            body = body.slice(0, pos);
        }
        // 解析元素符号
        let elements = [];
        let i = 0;
        while (i < body.length) {
            if (i+1 < body.length && validSymbolsSet.has(body.substr(i,2))) {
                elements.push(body.substr(i,2));
                i += 2;
            } else if (validSymbolsSet.has(body.substr(i,1))) {
                elements.push(body.substr(i,1));
                i += 1;
            } else { i++; }
        }
        let newBody = "";
        for (let elem of elements) {
            newBody += elem;
            if (Math.random() < 0.5) newBody += randomSubscript();
        }
        const r = Math.random() * 100;
        if (r < 30) newBody = "(" + newBody + ")";
        else if (r < 40) newBody = "[" + newBody + "]";
        return newBody + tonePart;
    }

    function encrypt(pinyinStr) {
        const syllables = pinyinStr.trim().split(/\s+/);
        const encrypted = [];
        for (let syl of syllables) {
            if (syl.length === 0) continue;
            let letters = "";
            let toneDigit = 0;
            let idx = 0;
            while (idx < syl.length && /[a-zA-Z]/.test(syl[idx])) {
                letters += syl[idx];
                idx++;
            }
            if (idx < syl.length && /[0-9]/.test(syl[idx])) {
                toneDigit = parseInt(syl[idx], 10);
            }
            let chemSeq = "";
            for (let ch of letters) {
                const low = ch.toLowerCase();
                const candidates = mapping[low];
                if (!candidates) { chemSeq += "?"; continue; }
                chemSeq += candidates[randInt(candidates.length)];
            }
            const toneSymbol = toneToSym[toneDigit];
            const raw = chemSeq + toneSymbol;
            encrypted.push(addFake(raw));
        }
        return encrypted.join(" ");
    }

    // 清洗：去除所有数字、括号等非字母/空格/声调符号
    function removeFake(s) {
        return s.replace(/[^a-zA-Z\s'\"\-]/g, '');
    }

    function decrypt(cipherStr) {
        const cleaned = removeFake(cipherStr);
        const blocks = cleaned.trim().split(/\s+/);
        const syllables = [];
        for (let block of blocks) {
            if (block.length === 0) continue;
            // 提取声调符号尾部
            let toneChars = [];
            let p = block.length;
            while (p > 0) {
                const ch = block[p-1];
                if (ch === "'" || ch === '"' || ch === '-') {
                    toneChars.unshift(ch);
                    p--;
                } else break;
            }
            const toneSymStr = toneChars.join('');
            const toneDigit = symToTone[toneSymStr] ?? 0;
            const body = block.substring(0, p);
            // 解析元素符号 -> 字母序列
            let letters = "";
            let i = 0;
            while (i < body.length) {
                if (i+1 < body.length && validSymbolsSet.has(body.substr(i,2))) {
                    const sym = body.substr(i,2);
                    letters += symbolToLetter.get(sym);
                    i += 2;
                } else if (validSymbolsSet.has(body.substr(i,1))) {
                    const sym = body.substr(i,1);
                    letters += symbolToLetter.get(sym);
                    i += 1;
                } else {
                    i++;
                }
            }
            syllables.push(letters + toneDigit);
        }
        return syllables.join(" ");
    }

    // ---------- 中文转拼音 (核心新增高标准) ----------
    // 使用 pinyin-pro 库，将中文转换为带声调数字的拼音串 (例如 ni3 hao3)
    // 该库准确率99%+，支持多音字智能识别。
    function chineseToNumberedPinyin(chineseText) {
        if (!chineseText.trim()) return "";
        try {
            // pinyin-pro 的 pinyin 方法默认返回带声调符号的拼音，我们转换成数字音调风格
            // 使用 pattern: 'pinyinNum' 直接获取 ni3 hao3 格式 (数字后缀)
            if (window.pinyinPro && window.pinyinPro.pinyin) {
                const result = window.pinyinPro.pinyin(chineseText, { pattern: 'pinyinNum', toneType: 'num' });
                // 结果类似 "ni3 hao3 shi4 jie4"
                return result.trim();
            } else if (window.pinyin) {
                // 兼容备用 (老式库 fallback)
                const pinyinArr = window.pinyin(chineseText, { style: 'tone2', heteronym: false });
                if (Array.isArray(pinyinArr)) {
                    return pinyinArr.map(item => item[0]).join(' ');
                }
                return chineseText;
            } else {
                console.warn("拼音库未完全加载, 返回原文");
                return chineseText;
            }
        } catch(e) {
            console.error("拼音转换出错", e);
            return chineseText;
        }
    }

    // 智能预处理：若输入包含中文，先行转为拼音（数字声调格式）；若已经是拼音格式则直接使用
    function preparePinyin(inputStr) {
        const hasChinese = /[\u4e00-\u9fa5]/.test(inputStr);
        if (hasChinese) {
            return chineseToNumberedPinyin(inputStr);
        } else {
            // 已经包含字母+数字空格 直接返回
            return inputStr.trim();
        }
    }

    // ---------- UI逻辑 & 复制功能 ----------
    // 显示加密结果并显示复制按钮
    function setEncryptResult(text) {
        const resultDiv = document.getElementById("encryptResultText");
        const copyBtn = document.getElementById("copyEncryptBtn");
        if (!text) {
            resultDiv.innerText = "暂无结果";
            copyBtn.style.display = "none";
            return;
        }
        resultDiv.innerText = text;
        copyBtn.style.display = "inline-flex";
    }

    function setDecryptResult(text) {
        const resultDiv = document.getElementById("decryptResultText");
        const copyBtn = document.getElementById("copyDecryptBtn");
        if (!text) {
            resultDiv.innerText = "暂无结果";
            copyBtn.style.display = "none";
            return;
        }
        resultDiv.innerText = text;
        copyBtn.style.display = "inline-flex";
    }

    // 复制通用方法
    async function copyToClipboard(text, btnElement) {
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = `<svg viewBox="0 0 24 24" stroke="currentColor"><path d="M20 6L9 17L4 12"/></svg> 已复制`;
            setTimeout(() => {
                btnElement.innerHTML = originalHtml;
            }, 1500);
        } catch (err) {
            alert("复制失败, 可手动复制");
        }
    }

    // 加密流程: 先保证拼音格式 (中文自动转)
    document.getElementById("doEncryptBtn").addEventListener("click", async () => {
        let rawInput = document.getElementById("plainInput").value;
        if (!rawInput.trim()) {
            setEncryptResult("请输入文本内容");
            return;
        }
        // 转换为拼音格式 (数字声调)
        let pinyinReady = preparePinyin(rawInput);
        if (!pinyinReady) {
            setEncryptResult("转换拼音失败，请检查输入");
            return;
        }
        // 执行加密算法
        try {
            const cipher = encrypt(pinyinReady);
            setEncryptResult(cipher);
        } catch(e) {
            setEncryptResult("加密出错: " + e.message);
        }
    });

    // 中文一键转拼音按钮 (用于预览)
    document.getElementById("convertToPinyinBtn").addEventListener("click", () => {
        let rawInput = document.getElementById("plainInput").value;
        if (!rawInput.trim()) {
            setEncryptResult("请先输入中文或拼音文本");
            return;
        }
        const hasChinese = /[\u4e00-\u9fa5]/.test(rawInput);
        if (hasChinese) {
            const pinyinStr = chineseToNumberedPinyin(rawInput);
            document.getElementById("plainInput").value = pinyinStr;
            setEncryptResult("已转换为拼音: " + pinyinStr);
        } else {
            setEncryptResult("当前已是拼音格式，可直接加密");
        }
    });

    // 解密
    document.getElementById("doDecryptBtn").addEventListener("click", () => {
        const cipherText = document.getElementById("cipherInput").value;
        if (!cipherText.trim()) {
            setDecryptResult("请输入化学式密文");
            return;
        }
        try {
            const plainPinyin = decrypt(cipherText);
            setDecryptResult(plainPinyin);
        } catch(e) {
            setDecryptResult("解密失败, 请检查密文格式: " + e.message);
        }
    });

    // 复制按钮绑定
    document.getElementById("copyEncryptBtn").addEventListener("click", () => {
        const text = document.getElementById("encryptResultText").innerText;
        if (text && text !== "等待加密" && text !== "暂无结果") {
            copyToClipboard(text, document.getElementById("copyEncryptBtn"));
        }
    });
    document.getElementById("copyDecryptBtn").addEventListener("click", () => {
        const text = document.getElementById("decryptResultText").innerText;
        if (text && text !== "等待解密" && text !== "暂无结果") {
            copyToClipboard(text, document.getElementById("copyDecryptBtn"));
        }
    });

    // 初始示例默认值友好展示
