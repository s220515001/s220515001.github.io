<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件目录</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f8fa; --fg:#1f2328; --muted:#656d76;
  --card:#ffffff; --border:#d0d7de; --accent:#0969da; --hover:#eef2f6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e;
    --card:#161b22; --border:#30363d; --accent:#58a6ff; --hover:#1f2630;
  }
}
*{box-sizing:border-box}
body{
  margin:0; padding:28px 16px 80px;
  background:var(--bg); color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.wrap{max-width:860px;margin:0 auto}
header{margin-bottom:18px}
h1{font-size:19px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;word-break:break-all}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar button{
  padding:8px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);font-size:13.5px;cursor:pointer;
  transition:.15s;font-family:inherit;
}
.toolbar button:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}
.toolbar button:disabled{opacity:.45;cursor:not-allowed}
.toolbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar button.primary:hover{filter:brightness(1.08)}
.searchbar{margin-bottom:10px}
.searchbar input{
  width:100%;padding:9px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);color:var(--fg);
  font-size:14px;outline:none;transition:.15s;font-family:inherit;
}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.15)}
.searchbar input:disabled{opacity:.5;cursor:not-allowed}
.breadcrumb{
  display:flex;flex-wrap:wrap;align-items:center;gap:2px;
  font-size:13.5px;margin-bottom:10px;min-height:28px;
}
.breadcrumb .crumb{
  background:none;border:none;color:var(--accent);
  cursor:pointer;padding:3px 6px;border-radius:6px;font-size:inherit;
  font-family:inherit;
}
.breadcrumb .crumb:hover{background:var(--hover)}
.breadcrumb .crumb.current{color:var(--fg);cursor:default;font-weight:500}
.breadcrumb .crumb.current:hover{background:none}
.breadcrumb .sep{color:var(--muted);user-select:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.15s;user-select:none;
}
.row:hover{background:var(--hover);border-color:var(--accent);transform:translateY(-1px)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{font-size:20px;line-height:1;flex:none;width:24px;text-align:center}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size{color:var(--muted);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.badge{
  flex:none;font-size:11.5px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--border);color:var(--muted);
}
.badge.open{color:var(--accent);border-color:currentColor}
.badge.dir{color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.prompt{max-width:480px;margin:0 auto;text-align:center}
.prompt-icon{font-size:48px;margin-bottom:12px;line-height:1}
.prompt h2{font-size:18px;margin:0 0 10px;color:var(--fg);font-weight:600}
.prompt p{color:var(--muted);font-size:13.5px;line-height:1.7;margin:8px 0}
.prompt .hint{font-size:12px;margin-top:14px;opacity:.85}
.prompt button{
  margin:10px 4px 0;padding:10px 20px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);color:var(--fg);
  font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;
}
.prompt button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.prompt button:hover{filter:brightness(1.08)}
body.dragging::after{
  content:'松开鼠标上传到当前文件夹';
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(9,105,218,.12);
  border:3px dashed var(--accent);
  color:var(--accent);font-size:20px;font-weight:600;
  pointer-events:none;backdrop-filter:blur(2px);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📁 文件目录</h1>
    <div class="sub" id="sub">选择一个文件夹开始</div>
  </header>

  <div class="toolbar">
    <button id="btnPick" class="primary" type="button">选择文件夹</button>
    <button id="btnUpload" type="button" disabled>上传文件</button>
    <button id="btnNewFolder" type="button" disabled>新建文件夹</button>
    <button id="btnRefresh" type="button" disabled>刷新</button>
  </div>

  <div class="searchbar">
    <input type="search" id="search" placeholder="搜索当前文件夹…" disabled autocomplete="off">
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <ul id="list"></ul>
  <div class="empty" id="empty"></div>
</div>

<script>
(function () {
  'use strict';

  /* ===================== 常量 ===================== */
  const HTML_RE = /\.(html?|xhtml)$/i;

  const ICONS = {
    html:'🌐', htm:'🌐', xhtml:'🌐',
    pdf:'📕', md:'📝', txt:'📄', log:'📄', csv:'📊',
    png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️', ico:'🖼️', bmp:'🖼️',
    mp4:'🎬', mov:'🎬', webm:'🎬', mkv:'🎬', avi:'🎬',
    mp3:'🎵', wav:'🎵', flac:'🎵', ogg:'🎵', m4a:'🎵',
    zip:'🗜️', rar:'🗜️', '7z':'🗜️', gz:'🗜️', tar:'🗜️',
    doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', ppt:'📙', pptx:'📙',
    js:'⚙️', mjs:'⚙️', css:'🎨', json:'🔧', xml:'🔧', yml:'🔧', yaml:'🔧',
    py:'🐍', java:'☕', c:'📐', cpp:'📐', go:'🐹', rs:'🦀', sh:'⌨️',
    exe:'💾', apk:'📦', dmg:'📦', iso:'💿', ttf:'🔤', otf:'🔤', woff:'🔤', woff2:'🔤'
  };

  /* ===================== DOM ===================== */
  const $ = function (id) { return document.getElementById(id); };
  const el = {
    sub: $('sub'),
    breadcrumb: $('breadcrumb'),
    list: $('list'),
    empty: $('empty'),
    search: $('search'),
    btnPick: $('btnPick'),
    btnUpload: $('btnUpload'),
    btnNewFolder: $('btnNewFolder'),
    btnRefresh: $('btnRefresh')
  };

  /* ===================== 状态 ===================== */
  let rootHandle = null;
  let currentHandle = null;
  let pathStack = [];       // [{name, handle}]
  let entries = [];
  let query = '';
  let loading = false;

  /* ===================== 工具 ===================== */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fmtSize(n) {
    if (n == null || isNaN(n) || n < 0) return '';
    if (n < 1024) return n + ' B';
    const units = ['KB', 'MB', 'GB', 'TB'];
    let i = -1, v = n;
    do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
    return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[i];
  }

  function iconFor(name, kind) {
    if (kind === 'directory') return '📁';
    const m = /\.([^.]+)$/.exec(name);
    return (m && ICONS[m[1].toLowerCase()]) || '📄';
  }

  /* ===================== IndexedDB（记住上次目录） ===================== */
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      const req = indexedDB.open('dirbrowser', 1);
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains('kv')) {
          req.result.createObjectStore('kv');
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  /* ===================== 权限 ===================== */
  async function ensurePermission(handle, mode) {
    mode = mode || 'readwrite';
    try {
      if (handle.queryPermission) {
        const q = await handle.queryPermission({ mode: mode });
        if (q === 'granted') return true;
      }
      if (handle.requestPermission) {
        const r = await handle.requestPermission({ mode: mode });
        return r === 'granted';
      }
      return true;
    } catch (e) {
      console.warn('权限检查失败', e);
      return false;
    }
  }

  /* ===================== 目录遍历 ===================== */
  async function listEntries(handle) {
    const out = [];
    if (typeof handle.entries === 'function') {
      for await (const pair of handle.entries()) {
        out.push(pair);
      }
    } else if (typeof handle.values === 'function') {
      for await (const h of handle.values()) {
        out.push([h.name, h]);
      }
    }
    return out;
  }

  /* ===================== 加载目录 ===================== */
  async function loadDir(handle) {
    if (loading) return;
    loading = true;
    currentHandle = handle;
    query = '';
    el.search.value = '';
    el.list.innerHTML = '';
    el.empty.hidden = true;
    el.sub.textContent = '正在读取…';
    setBusy(true);

    try {
      const raw = await listEntries(handle);
      const arr = [];
      for (let i = 0; i < raw.length; i++) {
        const name = raw[i][0];
        const h = raw[i][1];
        let size = null;
        if (h.kind === 'file') {
          try {
            const f = await h.getFile();
            size = f.size;
          } catch (e) { /* 忽略读取失败的文件 */ }
        }
        arr.push({ name: name, kind: h.kind, handle: h, size: size });
      }
      entries = arr;
    } catch (e) {
      el.sub.textContent = '读取目录失败：' + (e && e.message ? e.message : e);
      loading = false;
      setBusy(false);
      return;
    }

    render();
    renderBreadcrumb();
    updateToolbar();
    loading = false;
    setBusy(false);
  }

  /* ===================== 渲染 ===================== */
  function setBusy(b) {
    el.btnPick.disabled = b;
    if (b) {
      el.btnUpload.disabled = true;
      el.btnNewFolder.disabled = true;
      el.btnRefresh.disabled = true;
    }
  }

  function updateToolbar() {
    const has = !!currentHandle;
    el.btnPick.disabled = false;
    el.btnUpload.disabled = !has;
    el.btnNewFolder.disabled = !has;
    el.btnRefresh.disabled = !has;
    el.search.disabled = !has;
  }

  function renderBreadcrumb() {
    el.breadcrumb.innerHTML = '';
    if (!pathStack.length) return;
    pathStack.forEach(function (item, i) {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '/';
        el.breadcrumb.appendChild(sep);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'crumb' + (i === pathStack.length - 1 ? ' current' : '');
      btn.textContent = item.name;
      btn.disabled = (i === pathStack.length - 1);
      btn.addEventListener('click', function () { goTo(i); });
      el.breadcrumb.appendChild(btn);
    });
  }

  function render() {
    const q = query.trim().toLowerCase();
    const items = entries.filter(function (e) {
      return !q || e.name.toLowerCase().indexOf(q) !== -1;
    });
    items.sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === 'directory' ? -1 : 1;
      return a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
    });

    el.list.innerHTML = '';
    el.empty.className = 'empty';

    if (!items.length) {
      el.empty.hidden = false;
      el.empty.textContent = entries.length ? '没有匹配的文件' : '这个文件夹是空的';
      el.sub.textContent = entries.length + ' 个条目';
      return;
    }
    el.empty.hidden = true;

    const frag = document.createDocumentFragment();
    items.forEach(function (item) {
      const isDir = item.kind === 'directory';
      const isHtml = !isDir && HTML_RE.test(item.name);

      const row = document.createElement('div');
      row.className = 'row';
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.title = isDir ? '进入文件夹' : (isHtml ? '打开：' : '下载：') + item.name;

      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.textContent = iconFor(item.name, item.kind);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;

      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = fmtSize(item.size);

      const badge = document.createElement('span');
      badge.className = 'badge' + (isDir ? ' dir' : (isHtml ? ' open' : ''));
      badge.textContent = isDir ? '进入' : (isHtml ? '打开' : '下载');

      row.appendChild(ico);
      row.appendChild(name);
      row.appendChild(size);
      row.appendChild(badge);

      function activate() { handleRowClick(item); }
      row.addEventListener('click', activate);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });

      const li = document.createElement('li');
      li.appendChild(row);
      frag.appendChild(li);
    });

    el.list.appendChild(frag);
    el.sub.textContent = items.length + (q ? ' / ' + entries.length : '') + ' 个条目';
  }

  /* ===================== 行点击 ===================== */
  async function handleRowClick(item) {
    if (item.kind === 'directory') {
      await enterFolder(item);
    } else if (HTML_RE.test(item.name)) {
      await openHtml(item.handle);
    } else {
      await downloadFile(item.handle);
    }
  }

  async function enterFolder(item) {
    pathStack.push({ name: item.name, handle: item.handle });
    await loadDir(item.handle);
  }

  async function goTo(index) {
    if (index >= pathStack.length - 1) return;
    pathStack = pathStack.slice(0, index + 1);
    await loadDir(pathStack[index].handle);
  }

  /* ===================== 打开 / 下载 ===================== */
  async function openHtml(handle) {
    const win = window.open('about:blank', '_blank');
    try {
      const file = await handle.getFile();
      const url = URL.createObjectURL(file);
      if (!win) {
        URL.revokeObjectURL(url);
        alert('弹窗被拦截，请允许本站弹出窗口后再试。');
        return;
      }
      try { win.location.href = url; } catch (e) { /* 窗口已被关闭 */ }
      setTimeout(function () { URL.revokeObjectURL(url); }, 300000);
    } catch (e) {
      try { if (win) win.close(); } catch (e2) { /* 忽略 */ }
      alert('打开失败：' + (e && e.message ? e.message : e));
    }
  }

  async function downloadFile(handle) {
    try {
      const file = await handle.getFile();
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    } catch (e) {
      alert('下载失败：' + (e && e.message ? e.message : e));
    }
  }

  /* ===================== 上传 ===================== */
  async function fileExists(dir, name) {
    try {
      await dir.getFileHandle(name);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function saveFiles(files) {
    if (!currentHandle || !files.length) return;

    const names = files.map(function (f) { return f.name; });
    const existing = [];
    for (let i = 0; i < names.length; i++) {
      if (await fileExists(currentHandle, names[i])) existing.push(names[i]);
    }
    if (existing.length) {
      const ok = confirm(
        '以下文件已存在，继续将覆盖它们：\n\n' +
        existing.join('\n') + '\n\n是否继续？'
      );
      if (!ok) return;
    }

    let okCount = 0, failCount = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      try {
        const fh = await currentHandle.getFileHandle(f.name, { create: true });
        const w = await fh.createWritable();
        await w.write(f);
        await w.close();
        okCount++;
      } catch (e) {
        console.error('写入失败：', f.name, e);
        failCount++;
      }
    }

    await loadDir(currentHandle);
    if (failCount) {
      alert('上传完成：成功 ' + okCount + ' 个，失败 ' + failCount + ' 个。');
    }
  }

  function pickUpload() {
    if (!currentHandle) return;
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.style.display = 'none';
    input.addEventListener('change', async function () {
      if (input.files && input.files.length) {
        await saveFiles(Array.prototype.slice.call(input.files));
      }
      input.remove();
    });
    document.body.appendChild(input);
    input.click();
  }

  /* ===================== 新建文件夹 ===================== */
  async function newFolder() {
    if (!currentHandle) return;
    const name = prompt('新建文件夹，请输入名称：');
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) { alert('名称不能为空'); return; }
    if (/[\\/:*?"<>|]/.test(trimmed)) {
      alert('名称包含非法字符：\\ / : * ? " < > |');
      return;
    }
    if (trimmed === '.' || trimmed === '..') { alert('名称无效'); return; }

    try {
      let exists = false;
      try {
        await currentHandle.getDirectoryHandle(trimmed);
        exists = true;
      } catch (e) { /* 不存在 */ }
      if (exists) { alert('同名文件夹已存在'); return; }

      await currentHandle.getDirectoryHandle(trimmed, { create: true });
      await loadDir(currentHandle);
    } catch (e) {
      alert('创建失败：' + (e && e.message ? e.message : e));
    }
  }

  /* ===================== 选择文件夹 ===================== */
  async function pickDirectory() {
    if (!('showDirectoryPicker' in window)) {
      alert('当前浏览器不支持 File System Access API。\n请使用最新版 Chrome、Edge 或 Opera。');
      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      const ok = await ensurePermission(handle, 'readwrite');
      if (!ok) {
        alert('未获得读写权限，无法浏览该文件夹。');
        return;
      }
      rootHandle = handle;
      pathStack = [{ name: handle.name || '根目录', handle: handle }];
      idbSet('lastDir', handle).catch(function () {});
      await loadDir(handle);
      updateToolbar();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      console.error(e);
      alert('打开文件夹失败：' + (e && e.message ? e.message : e));
    }
  }

  /* ===================== 引导界面 ===================== */
  function showPickPrompt() {
    el.list.innerHTML = '';
    el.breadcrumb.innerHTML = '';
    el.sub.textContent = '选择一个文件夹开始';
    el.empty.hidden = false;
    el.empty.className = 'empty';
    el.empty.innerHTML =
      '<div class="prompt">' +
        '<div class="prompt-icon">📂</div>' +
        '<h2>选择一个文件夹</h2>' +
        '<p>请选择 <b>index.html 所在的文件夹</b>（或任意你希望浏览的文件夹）。' +
        '选定后，这里会列出其中的所有文件和子文件夹。</p>' +
        '<p>HTML 文件点击后直接打开，其他格式点击后下载；' +
        '文件夹可以点进去查看下级内容，也可以上传文件、新建文件夹。</p>' +
        '<button type="button" class="primary" id="promptPick">选择文件夹</button>' +
        '<p class="hint">所有读写都在你本机的浏览器中完成，不会上传到任何服务器。' +
        '出于安全考虑，浏览器要求每次访问新文件夹时由你手动授权。</p>' +
      '</div>';
    document.getElementById('promptPick').addEventListener('click', pickDirectory);
  }

  function showRestore(saved) {
    el.list.innerHTML = '';
    el.breadcrumb.innerHTML = '';
    el.sub.textContent = '需要重新授权';
    el.empty.hidden = false;
    el.empty.className = 'empty';
    el.empty.innerHTML =
      '<div class="prompt">' +
        '<div class="prompt-icon">🔒</div>' +
        '<h2>需要重新授权</h2>' +
        '<p>上次使用的文件夹「' + escapeHtml(saved.name || '未命名') + '」需要你再次确认访问权限。</p>' +
        '<button type="button" class="primary" id="promptRestore">恢复访问</button>' +
        '<button type="button" id="promptPickNew">选择其他文件夹</button>' +
      '</div>';

    document.getElementById('promptRestore').addEventListener('click', async function () {
      try {
        const perm = await saved.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { alert('未获得权限'); return; }
        rootHandle = saved;
        pathStack = [{ name: saved.name || '根目录', handle: saved }];
        await loadDir(saved);
        updateToolbar();
      } catch (e) {
        alert('恢复失败：' + (e && e.message ? e.message : e));
      }
    });
    document.getElementById('promptPickNew').addEventListener('click', pickDirectory);
  }

  function showUnsupported() {
    el.list.innerHTML = '';
    el.breadcrumb.innerHTML = '';
    el.sub.textContent = '浏览器不支持';
    el.empty.hidden = false;
    el.empty.className = 'empty';
    el.empty.innerHTML =
      '<div class="prompt">' +
        '<div class="prompt-icon">😕</div>' +
        '<h2>浏览器不支持</h2>' +
        '<p>本页面使用 <b>File System Access API</b> 读写本地文件夹，' +
        '目前仅 Chrome、Edge、Opera 等 Chromium 内核浏览器支持。</p>' +
        '<p>请更换浏览器后再打开本页面。</p>' +
      '</div>';
    el.btnPick.disabled = true;
  }

  /* ===================== 事件绑定 ===================== */
  el.btnPick.addEventListener('click', pickDirectory);
  el.btnUpload.addEventListener('click', pickUpload);
  el.btnNewFolder.addEventListener('click', newFolder);
  el.btnRefresh.addEventListener('click', function () {
    if (currentHandle) loadDir(currentHandle);
  });
  el.search.addEventListener('input', function () {
    query = el.search.value;
    render();
  });

  /* ===================== 拖拽上传 ===================== */
  document.addEventListener('dragover', function (e) {
    if (!currentHandle) return;
    e.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', function (e) {
    if (e.relatedTarget === null) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', async function (e) {
    if (!currentHandle) return;
    e.preventDefault();
    document.body.classList.remove('dragging');

    const dt = e.dataTransfer;
    if (!dt) return;

    // 检查是否包含文件夹（暂不支持）
    if (dt.items && dt.items.length) {
      let hasDir = false;
      for (let i = 0; i < dt.items.length; i++) {
        const it = dt.items[i];
        if (it.webkitGetAsEntry) {
          const ent = it.webkitGetAsEntry();
          if (ent && ent.isDirectory) { hasDir = true; break; }
        }
      }
      if (hasDir) {
        alert('暂不支持拖拽文件夹，请拖拽文件，或先用「上传文件」按钮选择。');
        return;
      }
    }

    const files = dt.files ? Array.prototype.slice.call(dt.files) : [];
    if (files.length) await saveFiles(files);
  });

  /* ===================== 初始化 ===================== */
  (async function init() {
    updateToolbar();

    if (!('showDirectoryPicker' in window)) {
      showUnsupported();
      return;
    }

    let saved = null;
    try { saved = await idbGet('lastDir'); } catch (e) { /* 忽略 */ }

    if (saved) {
      try {
        if (saved.queryPermission) {
          const perm = await saved.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            rootHandle = saved;
            pathStack = [{ name: saved.name || '根目录', handle: saved }];
            await loadDir(saved);
            return;
          }
        }
      } catch (e) { /* 忽略 */ }
      showRestore(saved);
      return;
    }

    showPickPrompt();
  })();

})();
</script>
</body>
</html>
