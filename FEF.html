<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>深海生态 · 鱼吃鱼</title>
<style>
    :root {
        --gold: #f0c060;
        --danger: #ff4d6a;
        --safe: #4dff88;
        --stamina: #5bc0be;
        --hunger: #ff8c42;
        --ui-bg: rgba(2, 30, 50, 0.92);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; }
    body { background: #001a2e; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #fff; }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

    /* ---------- 菜单 ---------- */
    .menu-overlay {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: rgba(2, 20, 40, 0.92);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: opacity 0.4s;
    }
    .menu-overlay.hidden { opacity: 0; pointer-events: none; }
    .menu-box {
        background: rgba(2, 35, 55, 0.95);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 30px 26px;
        max-width: 440px; width: 92%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .menu-title {
        font-size: 32px; font-weight: 900; letter-spacing: 6px; margin-bottom: 4px;
        background: linear-gradient(180deg, #a0e0ff, #5bc0be);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .menu-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 22px; letter-spacing: 3px; }
    .diff-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .diff-btn {
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
        border-radius: 10px; color: rgba(255,255,255,0.8); font-weight: 700;
        padding: 9px 20px; cursor: pointer; transition: 0.2s;
        letter-spacing: 2px; font-size: 14px;
    }
    .diff-btn.active { background: var(--safe); border-color: var(--safe); color: #002a1e; font-weight: 900; box-shadow: 0 0 16px rgba(77,255,136,0.3); }
    .settings-section {
        background: rgba(0,0,0,0.25); border-radius: 14px;
        padding: 14px 16px; margin-bottom: 20px; text-align: left;
    }
    .setting-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 10px; font-size: 13px; color: rgba(255,255,255,0.9);
    }
    .setting-row:last-child { margin-bottom: 0; }
    .toggle {
        position: relative; width: 44px; height: 24px;
        background: rgba(255,255,255,0.2); border-radius: 12px;
        cursor: pointer; transition: 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--safe); }
    .toggle::after {
        content: ''; position: absolute; top: 3px; left: 3px;
        width: 18px; height: 18px; background: #fff; border-radius: 50%;
        transition: 0.2s;
    }
    .toggle.on::after { left: 23px; }
    .start-btn {
        background: linear-gradient(135deg, #f0c060, #e0a830);
        border: none; border-radius: 14px;
        padding: 15px 30px; font-size: 18px; font-weight: 900;
        color: #002a1e; cursor: pointer; letter-spacing: 4px;
        width: 100%; transition: 0.2s;
        box-shadow: 0 8px 24px rgba(240,192,96,0.25);
    }
    .start-btn:hover { background: linear-gradient(135deg, #ffd78a, #f0c060); transform: translateY(-1px); }

    /* ---------- 底部 UI ---------- */
    .ui-bottom {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
        pointer-events: none; padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 4px;
        max-width: 520px; margin: 0 auto;
    }
    .bar-row { display: flex; gap: 6px; }
    .bar-box {
        flex: 1; background: rgba(2,30,50,0.8);
        border-radius: 8px; padding: 3px 10px;
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(8px);
        display: flex; align-items: center; gap: 6px;
        font-size: 11px; color: #fff;
    }
    .bar-label { font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .bar-label svg { width: 14px; height: 14px; }
    .bar-track { flex: 1; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s; }
    .bar-num { min-width: 32px; text-align: right; font-weight: 700; font-size: 12px; }
    .main-panel {
        background: var(--ui-bg); border-radius: 14px;
        padding: 10px 14px; border: 2px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        display: flex; align-items: center; gap: 10px;
    }
    .power-block { flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
    .power-icon {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.3);
    }
    .power-icon svg { width: 18px; height: 18px; }
    .power-num { font-size: 26px; font-weight: 900; min-width: 44px; text-align: center; text-shadow: 0 0 18px rgba(255,255,255,0.5); }
    .info-block { flex: 1; min-width: 0; }
    .stage-line { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }
    .stage-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .stage-icon svg { width: 22px; height: 22px; }
    .progress-bar { height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4dff88, #f0c060, #ff6b6b); transition: width 0.3s; }
    .next-line { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 2px; text-align: right; }
    .target-block {
        flex-shrink: 0; background: linear-gradient(135deg, #1a3a5c, #0d2137);
        border-radius: 8px; padding: 6px 8px; text-align: center;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .target-label { font-size: 9px; color: rgba(255,255,255,0.6); }
    .target-icon { width: 26px; height: 26px; margin: 2px auto; color: var(--gold); }
    .target-icon svg { width: 100%; height: 100%; }
    .target-text { font-size: 9px; color: var(--gold); font-weight: 700; }
    .skills-bar {
        background: rgba(2,30,50,0.85); backdrop-filter: blur(8px);
        border-radius: 12px; margin-top: 6px; padding: 6px 12px;
        border: 1px solid rgba(255,215,0,0.3);
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .skills-title { font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
    .skills-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .skill-chip {
        display: flex; align-items: center; gap: 5px;
        background: rgba(0,0,0,0.5); border-radius: 24px;
        padding: 2px 8px 2px 6px; font-size: 11px;
        border-left: 2px solid var(--gold);
    }
    .skill-chip .icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; color: var(--gold); }
    .skill-chip .icon svg { width: 16px; height: 16px; }
    .skill-chip .name { color: #eee; font-weight: 500; }
    .no-skills { font-size: 10px; color: #aaa; }

    /* ---------- 设置按钮/面板 ---------- */
    .settings-btn {
        position: fixed; top: 16px; right: 16px; z-index: 30;
        width: 44px; height: 44px; border-radius: 50%;
        background: rgba(2,30,50,0.85); border: 2px solid rgba(255,255,255,0.3);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: 0.2s;
    }
    .settings-btn:hover { background: rgba(2,50,80,0.9); }
    .settings-btn svg { width: 20px; height: 20px; }
    .settings-panel {
        position: fixed; top: 60px; right: 16px; z-index: 30;
        background: rgba(2,30,50,0.95); border-radius: 12px;
        padding: 14px; border: 2px solid rgba(255,255,255,0.25);
        display: none; flex-direction: column; gap: 10px;
        min-width: 210px; backdrop-filter: blur(10px);
    }
    .settings-panel.open { display: flex; }
    .settings-reset { color: #ffb347; font-size: 11px; text-align: center; cursor: pointer; margin-top: 4px; }

    /* ---------- 提示 ---------- */
    .hint {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none; z-index: 20;
        font-size: 26px; font-weight: 900; color: #fff;
        text-shadow: 0 0 30px rgba(255,200,50,0.9);
        white-space: nowrap; text-align: center;
    }
    .hint.show { animation: hintPop 1.6s ease-out forwards; }
    @keyframes hintPop {
        0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
        25%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
        60%  { transform: translate(-50%,-50%) scale(0.95); opacity: 1; }
        100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
    }

    /* ---------- 开发者工具 ---------- */
    .dev-panel {
        position: fixed; z-index: 200;
        background: rgba(10,25,45,0.95); backdrop-filter: blur(10px);
        border-radius: 16px; border: 2px solid var(--gold);
        width: 360px; max-height: 80vh;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s;
        display: flex; flex-direction: column; overflow: hidden;
    }
    .dev-panel.open { opacity: 1; pointer-events: auto; }
    .dev-panel.collapsed .dev-body { display: none; }
    .dev-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 16px; background: rgba(240,192,96,0.18);
        cursor: move;
    }
    .dev-head h3 { color: var(--gold); letter-spacing: 2px; font-size: 16px; flex: 1; }
    .dev-head-btns { display: flex; gap: 4px; }
    .dev-head-btns button {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
        border-radius: 6px; color: #fff; cursor: pointer;
        width: 30px; height: 28px; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
    }
    .dev-head-btns button:hover { background: rgba(255,255,255,0.25); }
    .dev-close { color: var(--danger) !important; border-color: rgba(255,77,106,0.5) !important; }
    .dev-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .dev-sec { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.12); }
    .dev-sec-t { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px; }
    .dev-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; font-size: 12px; }
    .dev-row:last-child { margin-bottom: 0; }
    .dev-row label { font-size: 12px; white-space: nowrap; min-width: 45px; }
    .dev-row input[type=range] { flex: 1; min-width: 50px; accent-color: var(--gold); }
    .dev-row input[type=number] {
        width: 55px; background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
        color: #fff; padding: 3px 5px; font-size: 12px; text-align: center;
    }
    .lock-btn {
        width: 32px; height: 26px; border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.08);
        cursor: pointer; font-size: 11px; color: #fff;
        display: flex; align-items: center; justify-content: center;
    }
    .lock-btn.locked { background: rgba(255,77,106,0.5); border-color: var(--danger); }
    .dev-row button {
        background: var(--gold); border: none; border-radius: 6px;
        padding: 5px 10px; color: #002a1e; font-weight: 700;
        cursor: pointer; font-size: 11px; letter-spacing: 1px;
    }
    .dev-row button:hover { background: #ffd78a; }
    .dev-row button.danger { background: var(--danger); color: #fff; }
    .dev-info { font-size: 10px; color: rgba(255,255,255,0.7); display: flex; justify-content: space-between; margin-bottom: 2px; }
    .dev-info span:last-child { color: var(--safe); font-weight: 600; }

    /* ---------- 触摸控件 ---------- */
    .joystick {
        position: fixed; bottom: 30px; left: 30px;
        width: 140px; height: 140px;
        background: rgba(30,40,60,0.55);
        border-radius: 50%;
        backdrop-filter: blur(8px);
        z-index: 200; display: none; touch-action: none;
    }
    .joystick-base {
        position: absolute; top: 50%; left: 50%;
        width: 110px; height: 110px;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        transform: translate(-50%, -50%);
    }
    .joystick-thumb {
        position: absolute; top: 50%; left: 50%;
        width: 54px; height: 54px;
        background: rgba(255,255,255,0.9);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px var(--safe);
        pointer-events: none;
    }
    .sprint-btn {
        position: fixed; bottom: 40px; right: 30px;
        width: 76px; height: 76px; border-radius: 50%;
        background: rgba(240,192,96,0.9);
        border: 3px solid #fff;
        font-size: 15px; font-weight: 700; color: #002a1e;
        z-index: 200; display: none;
        align-items: center; justify-content: center;
        cursor: pointer; touch-action: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .sprint-btn:active { transform: scale(0.95); background: #ffb347; }
    @media (max-width: 820px) {
        .joystick, .sprint-btn { display: flex; }
        .ui-bottom { bottom: 130px; }
    }
</style>
</head>

<canvas id="gameCanvas"></canvas>
<div class="hint" id="hint"></div>

<!-- 主菜单 -->
<div class="menu-overlay" id="menu">
    <div class="menu-box">
        <div class="menu-title">深海生态</div>
        <div class="menu-sub">进化 · 技能 · 陷阱狩猎</div>
        <div class="diff-row" id="diffRow">
            <div class="diff-btn" data-diff="easy">简单</div>
            <div class="diff-btn active" data-diff="normal">普通</div>
            <div class="diff-btn" data-diff="hard">困难</div>
        </div>

<script>
(function () {
    'use strict';

    // ============================================================
    // 配置
    // ============================================================
    const CONFIG = {
        world: { width: 3500, height: 2400, margin: 40, seabedHeight: 160 },

        },
        ai: {

        },

        },

        evolution: [
            { name: '小鱼苗', iconId: 'icon-small-fish', minPower: 0, maxPower: 15, color: '#a8d8ea', shape: 'small', skill: null },
            { name: '小丑鱼', iconId: 'icon-clownfish', minPower: 15, maxPower: 30, color: '#ff8c42', shape: 'clownfish', skill: 'predatorInstinct' },
            { name: '热带鱼', iconId: 'icon-tropical', minPower: 30, maxPower: 50, color: '#ff6b9d', shape: 'tropical', skill: 'stealthCamouflage' },
            { name: '金枪鱼', iconId: 'icon-tuna', minPower: 50, maxPower: 70, color: '#4488cc', shape: 'tuna', skill: 'energyRecycle' },
            { name: '鲨鱼', iconId: 'icon-shark', minPower: 70, maxPower: 90, color: '#8899aa', shape: 'shark', skill: 'lastStand' },
            { name: '抹香鲸', iconId: 'icon-whale', minPower: 90, maxPower: 999, color: '#3d5068', shape: 'whale', skill: 'abyssalFear' }
        ],
        skills: {
            predatorInstinct: { name: '捕食本能', icon: 'icon-skill-run', desc: '直线移动1.5秒后冲刺体力消耗减半' },
            stealthCamouflage: { name: '深海伪装', icon: 'icon-skill-stealth', desc: '静止1.5秒后隐身，AI无法察觉' },
            energyRecycle: { name: '能量回收', icon: 'icon-skill-recycle', desc: '吃鱼额外恢复10体力+5饥饿' },
            lastStand: { name: '背水一战', icon: 'icon-skill-sword', desc: '生命低于当前阶段30%时移速+30%，受伤-40%' },
            abyssalFear: { name: '深海震慑', icon: 'icon-skill-eye', desc: '吃鱼时震慑周围300px内敌人1秒' }
        },
        difficulty: {
            easy: { aiMin: 15, aiMax: 22, hungerMult: 0.6, staminaRegenMult: 1.4, playerSpeedMult: 1.1, bossMult: 0.8, bossInterval: 240, bossEatHeal: 0.3, bossEatRange: 0.8 },
            normal: { aiMin: 20, aiMax: 28, hungerMult: 1.0, staminaRegenMult: 1.0, playerSpeedMult: 1.0, bossMult: 1.0, bossInterval: 180, bossEatHeal: 0.5, bossEatRange: 1.0 },
            hard: { aiMin: 25, aiMax: 34, hungerMult: 1.5, staminaRegenMult: 0.7, playerSpeedMult: 0.9, bossMult: 1.2, bossInterval: 120, bossEatHeal: 0.7, bossEatRange: 1.2 }
        },
        konami: 'wwssadad'
    };

    // ============================================================
    // 工具函数
    // ============================================================
    const M = {
        clamp: (v, lo, hi) => v < lo ? lo : v > hi ? hi : v,
        lerp: (a, b, t) => a + (b - a) * t,
        dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
        distSq: (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; },
        // 角度差，返回 [-PI, PI]
        angleDiff: (a, b) => {
            let d = a - b;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return d;
        },
        // 帧率无关的指数插值
        damp: (cur, target, rate, dt) => {
            const f = 1 - Math.pow(1 - rate, dt * 60);
            return cur + (target - cur) * f;
        },
        // 帧率无关的衰减因子
        decayFactor: (base, dt) => Math.pow(base, dt * 60),
        rand: (a, b) => a + Math.random() * (b - a),
        randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
        pick: arr => arr[Math.floor(Math.random() * arr.length)],
        setText: (el, text) => { if (el.__lastText !== text) { el.textContent = text; el.__lastText = text; } },
        setStyle: (el, prop, val) => { if (el.__style[prop] !== val) { el.style[prop] = val; el.__style[prop] = val; } }
    };

    // 为元素初始化 style 缓存
    function cacheEl(el) { if (el && !el.__style) el.__style = {}; return el; }

    // ============================================================
    // 状态
    // ============================================================
    const State = {
        running: false,
        paused: false,
        gameTime: 0,
        lastTime: 0,
        difficulty: 'normal',
        params: null,
        settings: { aiHarm: true, aiVision: true, hunger: true, stealth: true, blood: true, bloodMega: true },
        locks: { power: false, hunger: false, stamina: false, streak: false },
        cheats: { invincible: false, infStamina: false, oneShot: false },
        devMode: false,
        devCollapsed: false,
        inputBuffer: '',
        screenFlash: 0,
        screenRedTimer: 0,
        screenShakeTimer: 0,
        lavaWindows: [],
        fpsHistory: [],
        currentFPS: 0
    };

    // ============================================================
    // 玩家 / 世界 / 实体
    // ============================================================
    const player = {
        x: CONFIG.world.width / 2, y: CONFIG.world.height / 2,
        vx: 0, vy: 0,
        power: CONFIG.player.startPower,
        targetPower: CONFIG.player.startPower,
        displayPower: CONFIG.player.startPower,
        radius: CONFIG.player.baseRadius,
        angle: 0, targetAngle: 0, lastAngle: 0,
        trail: [],
        invincibleTimer: 0,
        glowTimer: 0,
        stillTimer: 0,
        killStreak: 0,
        lastKillTime: 0,
        unlockedSkills: new Set(),
        straightMoveTimer: 0,
        stealthInvisible: false,
        lastStandActive: false,
        tentacleBuffTimer: 0,
        entangledTimer: 0,
        entangleCooldown: 0,
        dead: false,
        deadReason: ''
    };

    const world = {
        ai: [],
        particles: [],
        bubbles: [],
        seaweeds: [],
        bloodZones: [],
        floatingTexts: [],
        traps: [],
        seabedRocks: [],
        planktons: [],
        boss: null,
        bossSpawnTimer: 0,
        bossSpawnWarning: 0
    };

    const staminaState = { current: CONFIG.stamina.max, sprinting: false, sprintKey: false };
    const hungerState = { current: CONFIG.hunger.max };

    // 输入
    const input = {
        keys: {},
        touch: { x: 0, y: 0, active: false, sprint: false }
    };

    // 相机
    const camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

    // 画布
    let canvasW = 0, canvasH = 0, dpr = 1;

    // 阶段索引缓存
    let lastStageIndex = 0;
    let skillsDirty = true;

    // ============================================================
    // DOM 引用
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const UI = {
        menu: document.getElementById('menu'),
        startBtn: document.getElementById('startBtn'),
        diffRow: document.getElementById('diffRow'),
        powerNum: cacheEl(document.getElementById('powerNum')),
        stageIcon: cacheEl(document.getElementById('stageIcon')),
        stageName: cacheEl(document.getElementById('stageName')),
        progressFill: cacheEl(document.getElementById('progressFill')),
        nextLine: cacheEl(document.getElementById('nextLine')),
        staminaFill: cacheEl(document.getElementById('staminaFill')),
        staminaNum: cacheEl(document.getElementById('staminaNum')),
        hungerFill: cacheEl(document.getElementById('hungerFill')),
        hungerNum: cacheEl(document.getElementById('hungerNum')),
        skillsList: cacheEl(document.getElementById('skillsList')),
        hint: document.getElementById('hint'),
        settingsBtn: document.getElementById('settingsBtn'),
        settingsPanel: document.getElementById('settingsPanel'),
        settingsReset: document.getElementById('settingsReset'),
        devPanel: document.getElementById('devPanel'),
        devHead: document.getElementById('devHead'),
        devFold: document.getElementById('devFold'),
        devClose: document.getElementById('devClose'),
        // 开发者输入
        dvPower: document.getElementById('dvPower'),
        dvPowerNum: document.getElementById('dvPowerNum'),
        dvHunger: document.getElementById('dvHunger'),
        dvHungerNum: document.getElementById('dvHungerNum'),
        dvStamina: document.getElementById('dvStamina'),
        dvStaminaNum: document.getElementById('dvStaminaNum'),
        dvStreak: document.getElementById('dvStreak'),
        cheatInv: document.getElementById('cheatInv'),
        cheatSta: document.getElementById('cheatSta'),
        cheatOne: document.getElementById('cheatOne'),
        dvAddAI: document.getElementById('dvAddAI'),
        dvClearAI: document.getElementById('dvClearAI'),
        dvBoss: document.getElementById('dvBoss'),
        dvResetPlayer: document.getElementById('dvResetPlayer'),
        dvSave: document.getElementById('dvSave'),
        dvLoad: document.getElementById('dvLoad'),
        dvResetGame: document.getElementById('dvResetGame'),
        infoFPS: document.getElementById('infoFPS'),
        infoAI: document.getElementById('infoAI'),
        infoPos: document.getElementById('infoPos'),
        infoBoss: document.getElementById('infoBoss'),
        infoBuff: document.getElementById('infoBuff'),
        infoEnt: document.getElementById('infoEnt'),
        // 触摸
        joystick: document.getElementById('joystick'),
        sprintBtn: document.getElementById('sprintBtn')
    };

    // ============================================================
    // 阶段 / 技能
    // ============================================================
    function getStageByPower(p) {
        const arr = CONFIG.evolution;
        for (let i = arr.length - 1; i >= 0; i--) {
            if (p >= arr[i].minPower) return { stage: arr[i], index: i };
        }
        return { stage: arr[0], index: 0 };
    }

    function getNextStage(p) {
        const { index } = getStageByPower(p);
        return index < CONFIG.evolution.length - 1 ? CONFIG.evolution[index + 1] : null;
    }

    function unlockSkillsUpTo(power) {
        const { index } = getStageByPower(power);
        for (let i = 1; i <= index; i++) {
            const skillId = CONFIG.evolution[i].skill;
            if (skillId && !player.unlockedSkills.has(skillId)) {
                player.unlockedSkills.add(skillId);
                skillsDirty = true;
                showHint('获得技能: ' + CONFIG.skills[skillId].name);
            }
        }
    }

    // ============================================================
    // 提示 / 漂浮文字
    // ============================================================
    function showHint(text) {
        UI.hint.textContent = text;
        UI.hint.classList.remove('show');
        void UI.hint.offsetWidth;
        UI.hint.classList.add('show');
    }

    function addFloatingText(x, y, text, color) {
        world.floatingTexts.push({ x, y, text, color: color || '#4dff88', life: 1.2, maxLife: 1.2 });
    }

    // ============================================================
    // 初始化世界
    // ============================================================
    function initSeaweeds() {
        world.seaweeds = [];
        for (let i = 0; i < 55; i++) {
            world.seaweeds.push({
                x: Math.random() * CONFIG.world.width,
                y: CONFIG.world.height - 20 - Math.random() * 200,
                height: 50 + Math.random() * 170,
                width: 6 + Math.random() * 18,
                swayOffset: Math.random() * Math.PI * 2,
                swaySpeed: 0.3 + Math.random() * 0.8,
                color: 'hsl(' + (130 + Math.random() * 40) + ',' + (50 + Math.random() * 30) + '%,' + (15 + Math.random() * 25) + '%)',
                segments: 4 + Math.floor(Math.random() * 6)
            });
        }
        world.seaweeds.sort((a, b) => b.y - a.y);
    }

    function initBubbles() {
        world.bubbles = [];
        for (let i = 0; i < 55; i++) {
            world.bubbles.push({
                x: Math.random() * CONFIG.world.width,
                y: Math.random() * CONFIG.world.height,
                radius: 1 + Math.random() * 6,
                speed: 0.2 + Math.random() * 2.5,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.2 + Math.random() * 0.9,
                opacity: 0.3 + Math.random() * 0.6
            });
        }
    }

    function initSeabedRocks() {
        world.seabedRocks = [];
        for (let i = 0; i < 35; i++) {
            world.seabedRocks.push({
                x: Math.random() * CONFIG.world.width,
                y: CONFIG.world.height - 30 - Math.random() * 90,
                width: 20 + Math.random() * 70,
                height: 15 + Math.random() * 45,
                color: 'hsl(' + (30 + Math.random() * 20) + ',' + (20 + Math.random() * 20) + '%,' + (15 + Math.random() * 15) + '%)'
            });
        }
    }

    function initPlanktons() {
        world.planktons = [];
        for (let i = 0; i < 110; i++) {
            world.planktons.push({
                x: Math.random() * CONFIG.world.width,
                y: Math.random() * CONFIG.world.height,
                size: 0.5 + Math.random() * 2.5,
                speed: 0.1 + Math.random() * 0.4,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.2 + Math.random() * 0.7,
                opacity: 0.15 + Math.random() * 0.5,
                color: Math.random() < 0.5 ? 'rgba(210,240,255,0.5)' : 'rgba(180,255,210,0.4)'
            });
        }
    }

    function initTraps() {
        world.traps = [];
        const W = CONFIG.world;
        const t = CONFIG.traps;
        for (let i = 0; i < t.count; i++) {
            let x, y, attempts = 0;
            do {
                x = 150 + Math.random() * (W.width - 300);
                y = 150 + Math.random() * (W.height - 500);
                attempts++;
            } while (Math.hypot(x - player.x, y - player.y) < t.safeDistance && attempts < 20);
            const type = Math.random() < 0.5 ? 'coral' : 'volcano';
            world.traps.push({ x, y, type, radius: t.radius, active: true, cooldown: 0, maxCooldown: t.cooldown });
        }
    }

    // ============================================================
    // AI 生成
    // ============================================================
    function rollAIPower(playerPower) {
        const r = Math.random();
        if (playerPower < 20) {
            if (r < 0.55) return M.rand(3, 15);
            if (r < 0.85) return M.rand(12, 30);
            if (r < 0.95) return M.rand(25, 50);
            return M.rand(45, 80);
        }
        if (playerPower < 50) {
            if (r < 0.35) return M.rand(3, 18);
            if (r < 0.65) return M.rand(15, 45);
            if (r < 0.88) return M.rand(30, 60);
            return M.rand(50, 95);
        }
        if (playerPower < 80) {
            if (r < 0.25) return M.rand(5, 25);
            if (r < 0.55) return M.rand(20, 55);
            if (r < 0.8) return M.rand(40, 75);
            return M.rand(60, 110);
        }
        if (r < 0.2) return M.rand(8, 33);
        if (r < 0.5) return M.rand(25, 65);
        if (r < 0.75) return M.rand(45, 85);
        return M.rand(65, 120);
    }

    function spawnAIFish() {
        const W = CONFIG.world;
        let x, y, attempts = 0;
        do {
            x = 100 + Math.random() * (W.width - 200);
            y = 80 + Math.random() * (W.height - 200);
            attempts++;
        } while (Math.hypot(x - player.x, y - player.y) < 350 && attempts < 30);

        const power = Math.max(3, Math.min(120, Math.round(rollAIPower(player.power))));
        const stageInfo = getStageByPower(power);
        const angle = Math.random() * Math.PI * 2;
        const speed = M.rand(0.5, 3);

        world.ai.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            power, targetPower: power, displayPower: power,
            radius: 14 + power * 0.7,
            angle, targetAngle: angle,
            speed,
            turnTimer: M.rand(2, 7),
            turnCooldown: 0,
            stage: stageInfo.stage,
            stageIndex: stageInfo.index,
            flee: false, chase: false,
            tailWag: 0,
            tailWagSpeed: M.rand(4, 12),
            flashTimer: 0,
            viewAngle: CONFIG.ai.viewAngle + Math.random() * 0.4,
            viewRange: CONFIG.ai.viewRangeBase + power * CONFIG.ai.viewRangePerPower,
            stunTimer: 0
        });
    }

    function maintainAI() {
        const p = State.params;
        while (world.ai.length < p.aiMin) spawnAIFish();
        // 剔除过远或出界的（保留最低数量）
        world.ai = world.ai.filter(f => {
            const d = Math.hypot(f.x - player.x, f.y - player.y);
            if (d > CONFIG.ai.cullDistance && world.ai.length > p.aiMin) return false;
            const m = CONFIG.ai.despawnMargin;
            if (f.x < -m || f.x > CONFIG.world.width + m || f.y < -m || f.y > CONFIG.world.height + m) {
                return world.ai.length <= p.aiMin;
            }
            return true;
        });
        while (world.ai.length < p.aiMin) spawnAIFish();
        // 超出上限时从最弱的开始淘汰（保留最强的，血海 Mega 不会被砍）
        if (world.ai.length > p.aiMax) {
            world.ai.sort((a, b) => a.power - b.power);
            world.ai = world.ai.slice(world.ai.length - p.aiMax);
        }
    }

    // ============================================================
    // 粒子 / 血区
    // ============================================================
    function spawnParticles(x, y, count, color, type) {
        const max = CONFIG.particles.max;
        const space = max - world.particles.length;
        if (space <= 0) return;
        count = Math.min(count, space);
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            world.particles.push({
                x, y,
                vx: Math.cos(a) * (1 + Math.random() * 5),
                vy: Math.sin(a) * (1 + Math.random() * 5),
                life: 0.4 + Math.random() * 0.8,
                maxLife: CONFIG.particles.defaultLife,
                radius: 1.5 + Math.random() * 4,
                color,
                type: type || 'eat'
            });
        }
    }

    function addBloodZone(x, y, strength) {
        if (!State.settings.blood) return;
        const cfg = CONFIG.blood;
        const s = Math.min(cfg.maxStrength, strength);
        world.bloodZones.push({
            x, y, strength: s,
            radius: cfg.radiusBase + s * cfg.radiusPerStrength,
            life: cfg.lifeBase + s * cfg.lifePerStrength,
            maxLife: cfg.lifeBase + s * cfg.lifePerStrength
        });
    }

    // ============================================================
    // 玩家更新
    // ============================================================
    function updatePlayer(dt) {
        if (player.dead) return;

        // 输入
        let inputX = 0, inputY = 0;
        if (input.touch.active && (input.touch.x !== 0 || input.touch.y !== 0)) {
            inputX = input.touch.x;
            inputY = input.touch.y;
        } else {
            if (input.keys['w'] || input.keys['arrowup']) inputY -= 1;
            if (input.keys['s'] || input.keys['arrowdown']) inputY += 1;
            if (input.keys['a'] || input.keys['arrowleft']) inputX -= 1;
            if (input.keys['d'] || input.keys['arrowright']) inputX += 1;
        }
        const hasInput = inputX !== 0 || inputY !== 0;
        if (hasInput) {
            const len = Math.hypot(inputX, inputY);
            inputX /= len;
            inputY /= len;
            player.targetAngle = Math.atan2(inputY, inputX);
            player.stillTimer = 0;
        } else {
            player.stillTimer += dt;
        }

        // 直线判定（捕食本能）
        const aDiff = Math.abs(M.angleDiff(player.angle, player.lastAngle));
        if (hasInput && aDiff < 0.26) player.straightMoveTimer += dt;
        else player.straightMoveTimer = 0;
        player.lastAngle = player.angle;

        // 体力
        const P = CONFIG.player;
        const S = CONFIG.stamina;
        const p = State.params;
        const staminaRegen = S.regen * p.staminaRegenMult;
        const wantSprint = (staminaState.sprintKey || input.touch.sprint) && hasInput && staminaState.current > 0;
        staminaState.sprinting = wantSprint;

        if (!State.locks.stamina) {
            if (State.cheats.infStamina) {
                staminaState.current = S.max;
            } else if (wantSprint) {
                let drain = S.drain;
                if (player.unlockedSkills.has('predatorInstinct') && player.straightMoveTimer > S.straightThreshold) {
                    drain *= S.predatorFactor;
                }
                staminaState.current = Math.max(0, staminaState.current - drain * dt);
            } else {
                staminaState.current = Math.min(S.max, staminaState.current + staminaRegen * dt);
            }
        }

        // Debuff / Buff 计时
        let entangleSlow = 1;
        if (player.entangledTimer > 0) {
            entangleSlow = 0.8;
            player.entangledTimer = Math.max(0, player.entangledTimer - dt);
        }
        if (player.entangleCooldown > 0) player.entangleCooldown -= dt;
        if (player.tentacleBuffTimer > 0) {
            player.tentacleBuffTimer = Math.max(0, player.tentacleBuffTimer - dt);
        }

        // 移速
        let baseSpeed = P.baseSpeed * p.playerSpeedMult;
        const speedMul = Math.max(P.minSpeedMul, 1 - (player.power - 10) * P.powerSpeedFactor);
        let moveSpeed = baseSpeed * speedMul * entangleSlow;
        if (wantSprint) moveSpeed *= P.sprintMul;

        // 背水一战
        player.lastStandActive = false;
        if (player.unlockedSkills.has('lastStand') && player.power > 0) {
            const { stage } = getStageByPower(player.power);
            const range = stage.maxPower - stage.minPower;
            const threshold = stage.minPower + range * 0.3;
            if (player.power <= threshold) {
                moveSpeed *= 1.3;
                player.lastStandActive = true;
            }
        }

        if (hasInput) {
            player.vx += inputX * moveSpeed * 2 * dt;
            player.vy += inputY * moveSpeed * 2 * dt;
        }
        const damp = M.decayFactor(P.damping, dt);
        player.vx *= damp;
        player.vy *= damp;

        const spd = Math.hypot(player.vx, player.vy);
        if (spd > moveSpeed) {
            const s = moveSpeed / spd;
            player.vx *= s;
            player.vy *= s;
        }
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        const m = CONFIG.world.margin;
        if (player.x < m) { player.x = m; player.vx *= -0.3; }
        if (player.x > CONFIG.world.width - m) { player.x = CONFIG.world.width - m; player.vx *= -0.3; }
        if (player.y < m) { player.y = m; player.vy *= -0.3; }
        if (player.y > CONFIG.world.height - m) { player.y = CONFIG.world.height - m; player.vy *= -0.3; }

        // 朝向插值
        const ad = M.angleDiff(player.targetAngle, player.angle);
        player.angle += ad * Math.min(1, dt * P.turnLerp);

        player.radius = P.baseRadius + player.power * P.radiusPerPower;
        player.displayPower += (player.targetPower - player.displayPower) * Math.min(1, dt * 6);
        player.power = player.targetPower;

        // 潜行
        if (State.settings.stealth && player.unlockedSkills.has('stealthCamouflage')) {
            player.stealthInvisible = spd < 8 && player.stillTimer > 1.5;
        } else {
            player.stealthInvisible = false;
        }

        if (player.invincibleTimer > 0) player.invincibleTimer -= dt;
        if (player.glowTimer > 0) player.glowTimer -= dt;

        // 拖尾
        if (spd > 15) player.trail.push({ x: player.x, y: player.y, life: 0.35, maxLife: 0.35 });
        for (let i = 0; i < player.trail.length; i++) player.trail[i].life -= dt;
        player.trail = player.trail.filter(t => t.life > 0);
        if (player.trail.length > 25) player.trail = player.trail.slice(-25);

        // 饥饿
        const H = CONFIG.hunger;
        if (State.settings.hunger && !State.locks.hunger) {
            const decay = (H.baseDecay + player.power * H.sizeFactor) * p.hungerMult;
            hungerState.current = Math.max(0, hungerState.current - decay * dt);
            if (hungerState.current <= 0) {
                killPlayer('你饿死了...');
                return;
            }
            if (hungerState.current < H.critical) {
                player.targetPower = Math.max(3, player.targetPower - H.criticalDamageRate * dt);
            }
        }

        // 进化
        if (!State.locks.power) {
            const { index: ci } = getStageByPower(player.power);
            if (ci > lastStageIndex) {
                for (let i = lastStageIndex + 1; i <= ci; i++) {
                    const skillId = CONFIG.evolution[i].skill;
                    if (skillId && !player.unlockedSkills.has(skillId)) {
                        player.unlockedSkills.add(skillId);
                        skillsDirty = true;
                        showHint('获得技能: ' + CONFIG.skills[skillId].name);
                    }
                }
                lastStageIndex = ci;
                player.glowTimer = 1.5;
                spawnParticles(player.x, player.y, 40, CONFIG.evolution[ci].color, 'evolve');
                showHint(CONFIG.evolution[ci].name === '抹香鲸' ? '进化成抹香鲸！' : '进化！' + CONFIG.evolution[ci].name);
            }
        }
    }

    // ============================================================
    // AI 更新
    // ============================================================
    function updateAIFish(f, dt) {
        // 同步力量（AI 互吃后会变化）
        if (f.power !== f.targetPower) {
            f.power = f.targetPower;
            f.stageIndex = getStageByPower(f.power).index;
            f.stage = getStageByPower(f.power).stage;
        }
        f.radius = 14 + f.power * 0.7;

        if (f.stunTimer > 0) {
            f.stunTimer -= dt;
            f.flashTimer = 0.3;
            return;
        }
        f.turnCooldown -= dt;
        f.turnTimer -= dt;

        const dxP = player.x - f.x;
        const dyP = player.y - f.y;
        const distP = Math.hypot(dxP, dyP);

        // 感知玩家
        const perceptionMod = getPerceptionMod();
        const effRange = f.viewRange * perceptionMod;
        let playerVisible;
        if (State.settings.stealth && player.stealthInvisible && player.unlockedSkills.has('stealthCamouflage')) {
            playerVisible = false;
        } else if (State.settings.aiVision) {
            playerVisible = distP < effRange && isInVision(f, player.x, player.y);
        } else {
            playerVisible = distP < f.viewRange;
        }

        f.flee = playerVisible && f.power < player.power * CONFIG.ai.fleeRatio;
        f.chase = playerVisible && f.power > player.power * CONFIG.ai.chaseMin && f.power < player.power * CONFIG.ai.chaseMax;

        if (f.flee && distP < 400) {
            f.targetAngle = Math.atan2(-dyP, -dxP) + M.rand(-0.4, 0.4);
            f.speed = M.rand(CONFIG.ai.fleeSpeedMin, CONFIG.ai.fleeSpeedMax);
        } else if (f.chase && distP < 500 && distP > 60) {
            f.targetAngle = Math.atan2(dyP, dxP) + M.rand(-0.2, 0.2);
            f.speed = M.rand(CONFIG.ai.chaseSpeedMin, CONFIG.ai.chaseSpeedMax);
        } else if (State.settings.blood && world.bloodZones.length > 0) {
            let nearest = null, minD = Infinity;
            for (const bz of world.bloodZones) {
                const d = Math.hypot(f.x - bz.x, f.y - bz.y);
                if (d < bz.radius && d < minD) { minD = d; nearest = bz; }
            }
            if (nearest && f.power > player.power * 0.8) {
                f.targetAngle = Math.atan2(nearest.y - f.y, nearest.x - f.x);
                f.speed = M.rand(2.5, 5.5);
            } else if (f.turnTimer <= 0 && f.turnCooldown <= 0) {
                f.targetAngle = Math.random() * Math.PI * 2;
                f.speed = M.rand(CONFIG.ai.wanderSpeedMin, CONFIG.ai.wanderSpeedMax);
                f.turnTimer = M.rand(CONFIG.ai.wanderTimeMin, CONFIG.ai.wanderTimeMax);
                f.turnCooldown = CONFIG.ai.turnCooldown;
            }
        } else if (f.turnTimer <= 0 && f.turnCooldown <= 0) {
            f.targetAngle = Math.random() * Math.PI * 2;
            f.speed = M.rand(CONFIG.ai.wanderSpeedMin, CONFIG.ai.wanderSpeedMax);
            f.turnTimer = M.rand(CONFIG.ai.wanderTimeMin, CONFIG.ai.wanderTimeMax);
            f.turnCooldown = CONFIG.ai.turnCooldown;
        }

        const mrg = 80;
        if (f.x < mrg) f.targetAngle = 0;
        if (f.x > CONFIG.world.width - mrg) f.targetAngle = Math.PI;
        if (f.y < mrg) f.targetAngle = Math.PI / 2;
        if (f.y > CONFIG.world.height - mrg) f.targetAngle = -Math.PI / 2;

        const ad = M.angleDiff(f.targetAngle, f.angle);
        f.angle += ad * Math.min(1, dt * CONFIG.ai.turnLerp);

        f.vx = Math.cos(f.angle) * f.speed;
        f.vy = Math.sin(f.angle) * f.speed;
        f.x += f.vx * dt * 60;
        f.y += f.vy * dt * 60;
        f.x = M.clamp(f.x, 10, CONFIG.world.width - 10);
        f.y = M.clamp(f.y, 10, CONFIG.world.height - 10);

        f.tailWag += f.tailWagSpeed * dt;
        f.displayPower += (f.power - f.displayPower) * Math.min(1, dt * CONFIG.ai.growLerp);
        if (f.flashTimer > 0) f.flashTimer -= dt;
    }

    function isInVision(f, tx, ty) {
        const dx = tx - f.x, dy = ty - f.y;
        const dist = Math.hypot(dx, dy);
        if (dist > f.viewRange) return false;
        const angleToTarget = Math.atan2(dy, dx);
        const diff = Math.abs(M.angleDiff(angleToTarget, f.angle));
        if (diff > f.viewAngle / 2) return false;
        const perception = dist < f.viewRange * 0.3 ? 1 : dist < f.viewRange * 0.7 ? 0.7 : 0.3;
        return Math.random() < perception;
    }

    function getPerceptionMod() {
        if (!State.settings.stealth) return 1;
        const speed = Math.hypot(player.vx, player.vy);
        if (speed < 5 && player.stillTimer > 1.5) {
            let mod = 0.4;
            for (const sw of world.seaweeds) {
                if (Math.hypot(player.x - sw.x, player.y - (sw.y - sw.height * 0.5)) < sw.width * 2 + 20) {
                    mod *= 0.85;
                    break;
                }
            }
            return mod;
        }
        if (staminaState.sprinting) return 1.4;
        return 1;
    }

    // AI 互吃
    function aiInteract() {
        if (!State.settings.aiHarm) return;
        const arr = world.ai;
        for (let i = 0; i < arr.length; i++) {
            const a = arr[i];
            if (!a) continue;
            for (let j = i + 1; j < arr.length; j++) {
                const b = arr[j];
                if (!b) continue;
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d < a.radius + b.radius - 6) {
                    if (a.power > b.power * 1.05) {
                        a.targetPower += b.power * CONFIG.ai.eatPowerGain;
                        spawnParticles(b.x, b.y, 8, b.stage.color, 'eat');
                        arr.splice(j, 1);
                        j--;
                    } else if (b.power > a.power * 1.05) {
                        b.targetPower += a.power * CONFIG.ai.eatPowerGain;
                        spawnParticles(a.x, a.y, 8, a.stage.color, 'eat');
                        arr.splice(i, 1);
                        i--;
                        break;
                    }
                }
            }
        }
    }

    // ============================================================
    // Boss
    // ============================================================
    function spawnBoss() {
        if (world.boss) return;
        const B = CONFIG.boss;
        const p = State.params;
        const type = Math.random() < 0.5 ? 'megalodon' : 'kraken';
        let power;
        if (type === 'megalodon') {
            power = M.clamp(Math.round(player.power * B.megaPowerMul * p.bossMult), B.megaMin, B.megaMax);
        } else {
            power = M.clamp(Math.round(player.power * B.krakenPowerMul * p.bossMult), B.krakenMin, B.krakenMax);
        }
        const angle = Math.random() * Math.PI * 2;
        const dist = M.rand(400, 800);
        let bx = player.x + Math.cos(angle) * dist;
        let by = player.y + Math.sin(angle) * dist;
        bx = M.clamp(bx, 80, CONFIG.world.width - 80);
        by = M.clamp(by, 80, CONFIG.world.height - 80);

        world.boss = {
            x: bx, y: by, vx: 0, vy: 0,
            power, maxPower: power,
            radius: 20 + power * 0.9,
            type,
            abilityTimer: 0, stunTimer: 0, trail: [],
            angle: Math.atan2(player.y - by, player.x - bx),
            targetAngle: Math.atan2(player.y - by, player.x - bx),
            speed: M.rand(2.5, 4) * 1.2,
            flashTimer: 0,
            huntingTarget: null, huntCooldown: 0
        };
        showHint(type === 'megalodon' ? '巨齿鲨现身！' : '大王乌贼现身！');
        spawnParticles(bx, by, 30, '#ff3333', 'evolve');
    }

    function updateBoss(dt) {
        const boss = world.boss;
        if (!boss) return;
        const B = CONFIG.boss;

        if (boss.stunTimer > 0) {
            boss.stunTimer -= dt;
            boss.flashTimer = 0.3;
            return;
        }

        const dxP = player.x - boss.x, dyP = player.y - boss.y;
        const distP = Math.hypot(dxP, dyP);

        if (boss.type === 'megalodon') {
            boss.abilityTimer -= dt;
            if (boss.abilityTimer <= 0 && distP < B.megaDashRange) {
                boss.abilityTimer = B.megaDashInterval;
                boss.speed *= B.megaDashSpeedMul;
                boss.stunTimer = B.megaDashStun;
                boss.flashTimer = 0.3;
                for (let i = 0; i < 5; i++) boss.trail.push({ x: boss.x, y: boss.y, life: 0.5, maxLife: 0.5 });
            }
        } else {
            boss.abilityTimer -= dt;
            if (distP < B.krakenRange && boss.abilityTimer <= 0 && player.entangleCooldown <= 0 && player.entangledTimer <= 0) {
                player.entangledTimer = B.krakenDuration;
                player.entangleCooldown = B.krakenCooldown;
                boss.abilityTimer = 4;
                showHint('被触手缠绕！减速20%');
            }
        }

        if (distP < 500) {
            boss.targetAngle = Math.atan2(dyP, dxP);
            boss.speed = M.rand(2.5, 4) * 1.2;
            boss.huntingTarget = null;
        } else {
            bossEatFish(dt);
        }

        const mrg = 60;
        if (boss.x < mrg) boss.targetAngle = 0;
        if (boss.x > CONFIG.world.width - mrg) boss.targetAngle = Math.PI;
        if (boss.y < mrg) boss.targetAngle = Math.PI / 2;
        if (boss.y > CONFIG.world.height - mrg) boss.targetAngle = -Math.PI / 2;

        const ad = M.angleDiff(boss.targetAngle, boss.angle);
        boss.angle += ad * Math.min(1, dt * 4);
        boss.vx = Math.cos(boss.angle) * boss.speed;
        boss.vy = Math.sin(boss.angle) * boss.speed;
        boss.x += boss.vx * dt * 60;
        boss.y += boss.vy * dt * 60;
        boss.x = M.clamp(boss.x, 40, CONFIG.world.width - 40);
        boss.y = M.clamp(boss.y, 40, CONFIG.world.height - 40);
        boss.radius = 20 + boss.power * 0.9;

        for (let i = 0; i < boss.trail.length; i++) boss.trail[i].life -= dt;
        boss.trail = boss.trail.filter(t => t.life > 0);
        if (boss.trail.length > 20) boss.trail = boss.trail.slice(-20);
        if (boss.flashTimer > 0) boss.flashTimer -= dt;
    }

    function bossEatFish(dt) {
        const boss = world.boss;
        if (!boss) return;
        const B = CONFIG.boss;
        const p = State.params;

        if (boss.huntCooldown > 0) { boss.huntCooldown -= dt; return; }
        if (boss.power >= boss.maxPower * B.healResetRatio) return;

        if (State.difficulty !== 'hard') {
            const d = Math.hypot(player.x - boss.x, player.y - boss.y);
            if (d < 500) return;
        }

        let target = null, minD = Infinity;
        const detectRange = boss.radius * B.detectRangeFactor * (p.bossEatRange || 1);
        for (const f of world.ai) {
            if (boss.power <= f.power * 1.2) continue;
            const d = Math.hypot(boss.x - f.x, boss.y - f.y);
            if (d < detectRange && d < minD) { minD = d; target = f; }
        }

        if (!target) { boss.huntingTarget = null; return; }
        boss.huntingTarget = target;
        boss.targetAngle = Math.atan2(target.y - boss.y, target.x - boss.x);
        boss.speed = M.rand(2.5, 4) * 0.9;

        if (minD < boss.radius + target.radius - 5) {
            const heal = target.power * p.bossEatHeal;
            boss.power = Math.min(boss.maxPower, boss.power + heal);
            spawnParticles(target.x, target.y, 10, '#88ff44', 'eat');
            addFloatingText(target.x, target.y, '+' + Math.round(heal), '#4dff88');
            world.ai = world.ai.filter(f => f !== target);
            boss.huntingTarget = null;
            boss.huntCooldown = B.eatCooldown;
            boss.flashTimer = 0.2;
        }
    }

    function defeatBoss() {
        const boss = world.boss;
        if (!boss) return;
        const type = boss.type;
        spawnParticles(boss.x, boss.y, 50, type === 'megalodon' ? '#ff8844' : '#cc2244', 'evolve');
        State.screenShakeTimer = 0.3;
        State.screenFlash = 0.3;

        if (type === 'megalodon') {
            if (!State.locks.power) player.targetPower += 25;
            staminaState.current = Math.min(CONFIG.stamina.max, staminaState.current + 50);
            hungerState.current = Math.min(CONFIG.hunger.max, hungerState.current + 30);
            showHint('击败巨齿鲨！+25力量 +50体力 +30饥饿');
        } else {
            if (!State.locks.power) player.targetPower += 20;
            player.tentacleBuffTimer = 30;
            showHint('击败大王乌贼！触手Buff 30秒');
        }
        UI.powerNum.classList.add('power-grow');
        setTimeout(() => UI.powerNum.classList.remove('power-grow'), 400);
        world.boss = null;
        world.bossSpawnTimer = State.params.bossInterval;
        world.bossSpawnWarning = 0;
    }

    // ============================================================
    // 陷阱
    // ============================================================
    function updateTraps(dt) {
        for (const trap of world.traps) {
            if (!trap.active) {
                trap.cooldown -= dt;
                if (trap.cooldown <= 0) { trap.cooldown = 0; trap.active = true; }
            }
        }
    }

    function checkBossTrapCollisions() {
        const boss = world.boss;
        if (!boss) return;
        const T = CONFIG.traps;
        for (const trap of world.traps) {
            if (!trap.active) continue;
            const d = Math.hypot(boss.x - trap.x, boss.y - trap.y);
            if (d < boss.radius + trap.radius) {
                if (Math.random() < CONFIG.boss.missChance) {
                    showHint('Boss敏捷地躲开了陷阱！');
                } else {
                    const dmg = M.rand(T.damageMin, T.damageMax);
                    boss.power -= dmg;
                    boss.flashTimer = 0.4;
                    spawnParticles(trap.x, trap.y, 25, trap.type === 'coral' ? '#55ff99' : '#ff6633', 'evolve');
                    State.screenShakeTimer = Math.max(State.screenShakeTimer, 0.15);
                    showHint('Boss触发' + (trap.type === 'coral' ? '尖刺珊瑚' : '海底火山') + '！' + Math.round(dmg) + ' 伤害');
                }
                trap.active = false;
                trap.cooldown = trap.maxCooldown;
                if (boss.power <= 0) { defeatBoss(); return; }
                break;
            }
        }
    }

    function checkPlayerTrapCollisions() {
        if (player.dead) return;
        for (const trap of world.traps) {
            if (!trap.active) continue;
            const d = Math.hypot(player.x - trap.x, player.y - trap.y);
            if (d < player.radius + trap.radius) {
                if (trap.type === 'coral') {
                    State.screenShakeTimer = Math.max(State.screenShakeTimer, 3.0);
                    showHint('碰到尖刺珊瑚！屏幕剧烈抖动');
                } else {
                    State.screenRedTimer = 5.0;
                    initLavaWindows();
                    showHint('碰到海底火山！视野被岩浆覆盖');
                }
                trap.active = false;
                trap.cooldown = trap.maxCooldown;
                spawnParticles(trap.x, trap.y, 15, trap.type === 'coral' ? '#55ff99' : '#ff6633', 'evolve');
                break;
            }
        }
    }

    function initLavaWindows() {
        State.lavaWindows = [];
        for (let i = 0; i < 8; i++) {
            State.lavaWindows.push({
                x: Math.random() * canvasW,
                y: Math.random() * canvasH,
                radius: M.rand(30, 70),
                vx: M.rand(-30, 30),
                vy: M.rand(-30, 30)
            });
        }
    }

    function updateLavaWindows(dt) {
        for (const w of State.lavaWindows) {
            w.x += w.vx * dt;
            w.y += w.vy * dt;
            if (w.x < -50) w.x = canvasW + 50;
            if (w.x > canvasW + 50) w.x = -50;
            if (w.y < -50) w.y = canvasH + 50;
            if (w.y > canvasH + 50) w.y = -50;
            w.radius = M.clamp(w.radius + M.rand(-10, 10) * dt, 20, 80);
        }
    }

    // ============================================================
    // 碰撞：玩家 vs AI / Boss
    // ============================================================
    function killPlayer(reason) {
        if (player.dead) return;
        player.dead = true;
        player.deadReason = reason;
        player.targetPower = 0;
        player.power = 0;
        State.running = false;
        showHint(reason);
        if (world.boss) {
            spawnParticles(world.boss.x, world.boss.y, 20, '#ff4d6a', 'hurt');
            world.boss = null;
        }
        world.bossSpawnWarning = 0;
        world.bossSpawnTimer = State.params.bossInterval;
        setTimeout(() => location.reload(), 2000);
    }

    function checkCollisions() {
        if (player.dead) return;
        if (player.invincibleTimer > 0 && !State.cheats.invincible) return;

        // 玩家 vs AI
        for (let i = world.ai.length - 1; i >= 0; i--) {
            const f = world.ai[i];
            if (!f) continue;
            const d = Math.hypot(player.x - f.x, player.y - f.y);
            const atk = player.tentacleBuffTimer > 0 ? 1.15 : 1;
            const collideDist = (player.radius + f.radius - 6) * atk;
            if (d >= collideDist) continue;

            if (State.cheats.oneShot || player.power > f.power * 1.02) {
                // 玩家吃掉 AI
                const gain = State.cheats.oneShot ? f.power * 0.5 : Math.max(0.5, f.power * 0.12);
                if (!State.locks.power) player.targetPower += gain;
                if (!State.locks.hunger) hungerState.current = Math.min(CONFIG.hunger.max, hungerState.current + 15 + f.power * 0.2);

                if (player.unlockedSkills.has('energyRecycle')) {
                    staminaState.current = Math.min(CONFIG.stamina.max, staminaState.current + CONFIG.stamina.energyRecycleStamina);
                    hungerState.current = Math.min(CONFIG.hunger.max, hungerState.current + CONFIG.stamina.energyRecycleHunger);
                }
                if (player.unlockedSkills.has('abyssalFear')) {
                    for (const other of world.ai) {
                        if (other === f) continue;
                        if (Math.hypot(player.x - other.x, player.y - other.y) < 300) {
                            other.stunTimer = 1.0;
                            other.flashTimer = 0.3;
                        }
                    }
                }
                spawnParticles(f.x, f.y, State.cheats.oneShot ? 25 : 15, getStageByPower(f.power).stage.color, 'eat');
                addBloodZone(f.x, f.y, 50);
                if (!State.locks.streak) player.killStreak++;
                player.lastKillTime = State.gameTime;

                // 血海 Mega
                if (State.settings.bloodMega && player.killStreak >= 5) {
                    spawnParticles(f.x, f.y, 30, '#ff0000', 'blood');
                    showHint('血海扩散！巨型掠食者被吸引...');
                    const megaPower = 110 + Math.random() * 30;
                    const ms = getStageByPower(megaPower);
                    world.ai.unshift({
                        x: f.x, y: f.y, vx: 0, vy: 0,
                        power: megaPower, targetPower: megaPower, displayPower: megaPower,
                        radius: 14 + megaPower * 0.7,
                        angle: 0, targetAngle: 0, speed: 0.8,
                        turnTimer: 5, turnCooldown: 0,
                        stage: ms.stage, stageIndex: ms.index,
                        flee: false, chase: true,
                        tailWag: 0, tailWagSpeed: 4, flashTimer: 0,
                        viewAngle: Math.PI * 1.2, viewRange: 400 + megaPower * 2.5,
                        stunTimer: 0
                    });
                    if (!State.locks.streak) player.killStreak = 0;
                }

                world.ai.splice(i, 1);
                if (world.ai.length < State.params.aiMin) spawnAIFish();
                player.glowTimer = Math.min(player.glowTimer + 0.2, 0.6);
                UI.powerNum.classList.add('power-grow');
                setTimeout(() => UI.powerNum.classList.remove('power-grow'), 400);
            } else if (!State.cheats.invincible && f.power > player.power * 1.03) {
                // AI 吃掉玩家（扣血）
                let loss = Math.max(1, player.power * 0.18);
                if (player.unlockedSkills.has('lastStand') && player.lastStandActive) loss *= 0.6;
                if (!State.locks.power) player.targetPower = Math.max(0, player.targetPower - loss);
                player.invincibleTimer = CONFIG.player.invincibleAfterHit;
                State.screenShakeTimer = Math.max(State.screenShakeTimer, 0.3);
                spawnParticles(player.x, player.y, 20, '#ff4d6a', 'hurt');
                addBloodZone(player.x, player.y, 80);
                const pa = Math.atan2(player.y - f.y, player.x - f.x);
                player.vx += Math.cos(pa) * CONFIG.player.knockbackSmall;
                player.vy += Math.sin(pa) * CONFIG.player.knockbackSmall;
                f.flashTimer = 0.3;
                UI.powerNum.classList.add('power-shrink');
                setTimeout(() => UI.powerNum.classList.remove('power-shrink'), 400);
                if (player.targetPower <= 0) { killPlayer('你被吃掉了...'); return; }
            }
        }

        // 玩家 vs Boss
        const boss = world.boss;
        if (boss && !player.dead) {
            const d = Math.hypot(player.x - boss.x, player.y - boss.y);
            const atk = player.tentacleBuffTimer > 0 ? 1.15 : 1;
            const collideDist = (player.radius + boss.radius - 8) * atk;
            if (d < collideDist) {
                if (State.cheats.oneShot) {
                    defeatBoss();
                } else if (player.power > boss.power * 0.6) {
                    const bossDmg = Math.max(5, player.power * 0.08);
                    boss.power -= bossDmg;
                    boss.flashTimer = 0.3;
                    spawnParticles(boss.x, boss.y, 8, '#ff6633', 'hurt');
                    if (!State.cheats.invincible) {
                        const pd = Math.max(1, player.power * 0.06);
                        if (!State.locks.power) player.targetPower = Math.max(0, player.targetPower - pd);
                        State.screenShakeTimer = Math.max(State.screenShakeTimer, 0.15);
                    }
                    if (boss.power <= 0 || boss.power < player.power * 0.3) defeatBoss();
                } else if (!State.cheats.invincible) {
                    let loss = Math.max(1, player.power * 0.18 * 1.5);
                    if (player.unlockedSkills.has('lastStand') && player.lastStandActive) loss *= 0.6;
                    if (!State.locks.power) player.targetPower = Math.max(0, player.targetPower - loss);
                    player.invincibleTimer = CONFIG.player.invincibleAfterHit;
                    State.screenShakeTimer = Math.max(State.screenShakeTimer, 0.3);
                    spawnParticles(player.x, player.y, 25, '#ff4d6a', 'hurt');
                    addBloodZone(player.x, player.y, 80);
                    const pa = Math.atan2(player.y - boss.y, player.x - boss.x);
                    player.vx += Math.cos(pa) * CONFIG.player.knockbackBoss;
                    player.vy += Math.sin(pa) * CONFIG.player.knockbackBoss;
                    boss.flashTimer = 0.3;
                    UI.powerNum.classList.add('power-shrink');
                    setTimeout(() => UI.powerNum.classList.remove('power-shrink'), 400);
                    if (player.targetPower <= 0) { killPlayer('你被吃掉了...'); return; }
                }
            }
        }
    }

    // ============================================================
    // 世界更新
    // ============================================================
    function updateParticles(dt) {
        for (const p of world.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.type === 'evolve') p.vy -= 40 * dt;
        }
        world.particles = world.particles.filter(p => p.life > 0);
    }

    function updateBubbles(dt) {
        for (const b of world.bubbles) {
            b.y -= b.speed * dt * 60;
            b.wobble += b.wobbleSpeed * dt;
            b.x += Math.sin(b.wobble) * 0.5;
            if (b.y < -20) {
                b.y = CONFIG.world.height + 20;
                b.x = Math.random() * CONFIG.world.width;
            }
        }
    }

    function updatePlanktons(dt) {
        for (const p of world.planktons) {
            p.wobble += p.wobbleSpeed * dt;
            p.x += Math.sin(p.wobble) * 0.3;
            p.y -= p.speed * dt;
            if (p.y < -20) {
                p.y = CONFIG.world.height + 20;
                p.x = Math.random() * CONFIG.world.width;
            }
        }
    }

    function updateBloodZones(dt) {
        for (const bz of world.bloodZones) {
            bz.life -= dt;
            if (bz.maxLife > 0) {
                bz.radius = (bz.life / bz.maxLife) * (CONFIG.blood.radiusBase + bz.strength * CONFIG.blood.radiusPerStrength);
            }
        }
        world.bloodZones = world.bloodZones.filter(bz => bz.life > 0);
    }

    function updateFloatingTexts(dt) {
        for (const ft of world.floatingTexts) {
            ft.life -= dt;
            ft.y -= 30 * dt;
        }
        world.floatingTexts = world.floatingTexts.filter(ft => ft.life > 0);
    }

    function updateCamera(dt) {
        camera.targetX = M.clamp(player.x - canvasW / 2, 0, Math.max(0, CONFIG.world.width - canvasW));
        camera.targetY = M.clamp(player.y - canvasH / 2, 0, Math.max(0, CONFIG.world.height - canvasH));
        camera.x = M.damp(camera.x, camera.targetX, 0.08, dt);
        camera.y = M.damp(camera.y, camera.targetY, 0.08, dt);
    }

    function checkBossSpawn(dt) {
        if (player.dead) return;
        if (world.boss) return;
        const B = CONFIG.boss;
        if (world.bossSpawnWarning > 0) {
            world.bossSpawnWarning -= dt;
            if (world.bossSpawnWarning <= 0) {
                world.bossSpawnWarning = 0;
                if (player.invincibleTimer > 0 || player.power <= 0) {
                    world.bossSpawnWarning = B.retryWarning;
                    showHint('深海巨兽感知到异常...稍后出现');
                } else {
                    spawnBoss();
                }
            }
        } else {
            world.bossSpawnTimer -= dt;
            if (world.bossSpawnTimer <= 0) {
                world.bossSpawnTimer = 9999;
                world.bossSpawnWarning = B.warningTime;
                showHint('深海巨兽正在靠近');
            }
        }
    }

    // ============================================================
    // 绘制
    // ============================================================
    function resize() {
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(canvasW * dpr);
        canvas.height = Math.floor(canvasH * dpr);
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvasH);
        grad.addColorStop(0, '#0a7eb5');
        grad.addColorStop(0.25, '#0a6d9e');
        grad.addColorStop(0.6, '#054a68');
        grad.addColorStop(1, '#022335');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvasW, canvasH);

        // 光线
        for (let i = 0; i < 6; i++) {
            const sx = (canvasW * 0.2 + i * canvasW * 0.15 + Math.sin(State.gameTime * 0.3 + i) * 60) - camera.x * 0.1;
            const sy = -50 - camera.y * 0.1;
            const g = ctx.createLinearGradient(sx, sy, sx + 30, sy + canvasH * 0.8);
            g.addColorStop(0, 'rgba(255,255,180,0.12)');
            g.addColorStop(0.7, 'rgba(255,255,200,0.02)');
            g.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(sx - 25, sy);
            ctx.lineTo(sx + 25, sy);
            ctx.lineTo(sx + 60, sy + canvasH * 0.8);
            ctx.lineTo(sx - 40, sy + canvasH * 0.8);
            ctx.closePath();
            ctx.fill();
        }

        // 海床
        const seabedY = CONFIG.world.height - CONFIG.world.seabedHeight;
        const sby = seabedY - camera.y;
        if (sby < canvasH + 200 && sby + 200 > 0) {
            const sandGrad = ctx.createLinearGradient(0, sby, 0, sby + 200);
            sandGrad.addColorStop(0, 'rgba(180,140,80,0.3)');
            sandGrad.addColorStop(0.5, 'rgba(140,100,50,0.5)');
            sandGrad.addColorStop(1, 'rgba(80,60,30,0.7)');
            ctx.fillStyle = sandGrad;
            ctx.fillRect(0, sby, canvasW, canvasH - sby);

            for (const rock of world.seabedRocks) {
                const rx = rock.x - camera.x, ry = rock.y - camera.y;
                if (rx < -150 || rx > canvasW + 150 || ry < -100 || ry > canvasH + 100) continue;
                ctx.fillStyle = rock.color;
                ctx.beginPath();
                ctx.ellipse(rx, ry, rock.width, rock.height, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(rx + 4, ry - 2, rock.width * 0.6, rock.height * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawPlanktons() {
        for (const p of world.planktons) {
            const sx = p.x - camera.x, sy = p.y - camera.y;
            if (sx < -20 || sx > canvasW + 20 || sy < -20 || sy > canvasH + 20) continue;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.beginPath();
            ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawBloodZones() {
        for (const bz of world.bloodZones) {
            const sx = bz.x - camera.x, sy = bz.y - camera.y;
            if (sx < -bz.radius || sx > canvasW + bz.radius || sy < -bz.radius || sy > canvasH + bz.radius) continue;
            const alpha = (bz.life / bz.maxLife) * 0.35;
            const g = ctx.createRadialGradient(sx, sy, bz.radius * 0.1, sx, sy, bz.radius);
            g.addColorStop(0, 'rgba(255,30,30,' + alpha + ')');
            g.addColorStop(1, 'rgba(255,30,30,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(sx, sy, bz.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawSeaweeds() {
        for (const sw of world.seaweeds) {
            const sx = sw.x - camera.x, sy = sw.y - camera.y;
            if (sx < -100 || sx > canvasW + 100 || sy < -300 || sy > canvasH + 100) continue;
            ctx.save();
            ctx.globalAlpha = 0.65;
            const sway = Math.sin(State.gameTime * sw.swaySpeed + sw.swayOffset) * 20;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            let cx = sx, cy = sy;
            for (let i = 0; i < sw.segments; i++) {
                const t = i / sw.segments;
                cx = sx + sway * t * 1.5;
                cy = sy - sw.height / sw.segments * (i + 1);
                ctx.lineTo(cx, cy);
            }
            ctx.strokeStyle = sw.color;
            ctx.lineWidth = sw.width;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + sway * 0.3, cy - 6, sw.width * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = sw.color;
            ctx.fill();
            ctx.restore();
        }
    }

    function drawBubbles() {
        for (const b of world.bubbles) {
            const bx = b.x - camera.x, by = b.y - camera.y;
            if (bx < -20 || bx > canvasW + 20 || by < -20 || by > canvasH + 20) continue;
            ctx.save();
            ctx.globalAlpha = b.opacity;
            ctx.beginPath();
            ctx.arc(bx, by, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(200,230,255,0.4)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawTraps() {
        for (const trap of world.traps) {
            const sx = trap.x - camera.x, sy = trap.y - camera.y;
            if (sx < -150 || sx > canvasW + 150 || sy < -150 || sy > canvasH + 150) continue;
            const r = trap.radius;
            ctx.save();
            ctx.translate(sx, sy);
            if (trap.type === 'coral') {
                const numSpikes = 9, spikeH = r * 1.2, baseR = r * 0.5;
                if (trap.active) { ctx.shadowColor = '#55ff99'; ctx.shadowBlur = 15; }
                ctx.beginPath();
                ctx.arc(0, 0, baseR, 0, Math.PI * 2);
                ctx.fillStyle = trap.active ? '#2d8a4e' : '#3a5a4a';
                ctx.fill();
                ctx.strokeStyle = trap.active ? '#66ffaa' : '#5a7a6a';
                ctx.lineWidth = 2;
                ctx.stroke();
                for (let i = 0; i < numSpikes; i++) {
                    const a = (i / numSpikes) * Math.PI * 2 + Math.sin(State.gameTime * 3 + i) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * baseR, Math.sin(a) * baseR);
                    ctx.lineTo(Math.cos(a) * (baseR + spikeH * 0.8), Math.sin(a) * (baseR + spikeH * 0.8));
                    ctx.strokeStyle = trap.active ? '#88ffbb' : '#6a8a7a';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            } else {
                if (trap.active) { ctx.shadowColor = '#ff6633'; ctx.shadowBlur = 20; }
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 0.8, r * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = trap.active ? '#8b3a3a' : '#5a4a4a';
                ctx.fill();
                ctx.strokeStyle = trap.active ? '#ff6644' : '#7a5a5a';
                ctx.lineWidth = 3;
                ctx.stroke();
                if (trap.active) {
                    for (let i = 0; i < 6; i++) {
                        const by = -r * 0.3 - Math.sin(State.gameTime * 5 + i) * r * 0.5;
                        ctx.beginPath();
                        ctx.arc(Math.cos(i * 1.2) * r * 0.4, by, 3 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,' + (100 + Math.floor(Math.random() * 100)) + ',50,0.7)';
                        ctx.fill();
                    }
                }
            }
            if (!trap.active) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(trap.cooldown) + 's', 0, 4);
            }
            ctx.restore();
        }
    }

    // 鱼身绘制（按形状）
    function drawFishBody(x, y, radius, angle, stageInfo, isPlayer, invincibleTimer, flashTimer) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        let alpha = 1;
        if (isPlayer && invincibleTimer > 0) alpha *= 0.4 + 0.6 * Math.abs(Math.sin(State.gameTime * 20));
        if (isPlayer && player.stealthInvisible) alpha *= 0.4;
        if (flashTimer > 0) alpha *= 0.5 + 0.5 * Math.abs(Math.sin(State.gameTime * 40));
        ctx.globalAlpha = alpha;

        const shape = stageInfo.stage.shape;
        const r = radius;
        const bl = r * 2.4;
        const bh = r * 1.5;

        if (shape === 'whale') drawWhaleShape(bl, bh, r);
        else if (shape === 'shark') drawSharkShape(bl, bh, r);
        else if (shape === 'tuna') drawTunaShape(bl, bh, r);
        else if (shape === 'tropical') drawTropicalShape(bl, bh, r);
        else if (shape === 'clownfish') drawClownShape(bl, bh, r);
        else drawSmallFishShape(bl, bh, r);

        ctx.restore();
    }

    function drawSmallFishShape(bl, bh, r) {
        ctx.beginPath();
        ctx.ellipse(0, 0, bl * 0.45, bh * 0.58, 0, 0, Math.PI * 2);
        const g = ctx.createLinearGradient(0, -bh, 0, bh);
        g.addColorStop(0, '#c8e8f8');
        g.addColorStop(0.5, '#a8d8ea');
        g.addColorStop(1, '#e0f4fc');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = r * 0.08;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(bl * 0.22, -bh * 0.22, r * 0.13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(bl * 0.25, -bh * 0.22, r * 0.07, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-bl * 0.3, -bh * 0.08);
        ctx.quadraticCurveTo(-bl * 0.6, -bh * 0.55, -bl * 0.7, -bh * 0.4);
        ctx.quadraticCurveTo(-bl * 0.5, bh * 0.04, -bl * 0.3, bh * 0.08);
        ctx.quadraticCurveTo(-bl * 0.5, -bh * 0.04, -bl * 0.7, bh * 0.4);
        ctx.quadraticCurveTo(-bl * 0.6, bh * 0.55, -bl * 0.3, bh * 0.08);
        ctx.closePath();
        ctx.fillStyle = '#8ac0d8';
        ctx.fill();
    }

    function drawClownShape(bl, bh, r) {
        ctx.beginPath();
        ctx.ellipse(0, 0, bl * 0.52, bh * 0.65, 0, 0, Math.PI * 2);
        const g = ctx.createLinearGradient(0, -bh, 0, bh);
        g.addColorStop(0, '#ff9933');
        g.addColorStop(0.5, '#ff8c42');
        g.addColorStop(1, '#ffddbb');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = r * 0.1;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-bl * 0.04, -bh * 0.58, bl * 0.09, bh * 1.16);
        ctx.fillRect(bl * 0.14, -bh * 0.5, bl * 0.07, bh * 1.0);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(bl * 0.22, -bh * 0.22, r * 0.14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(bl * 0.25, -bh * 0.22, r * 0.07, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-bl * 0.3, -bh * 0.1);
        ctx.quadraticCurveTo(-bl * 0.6, -bh * 0.65, -bl * 0.65, -bh * 0.45);
        ctx.quadraticCurveTo(-bl * 0.45, bh * 0.05, -bl * 0.3, bh * 0.1);
        ctx.quadraticCurveTo(-bl * 0.45, -bh * 0.05, -bl * 0.65, bh * 0.45);
        ctx.quadraticCurveTo(-bl * 0.6, bh * 0.65, -bl * 0.3, bh * 0.1);
        ctx.closePath();
        ctx.fillStyle = '#ee7733';
        ctx.fill();
    }

    function drawTropicalShape(bl, bh, r) {
        ctx.beginPath();
        ctx.ellipse(0, 0, bl * 0.55, bh * 0.7, 0, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(-bl * 0.1, -bh * 0.2, bh * 0.15, 0, 0, bh * 0.9);
        g.addColorStop(0, '#ffaacc');
        g.addColorStop(0.5, '#ff6b9d');
        g.addColorStop(1, '#cc3366');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = r * 0.12;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(-bl * 0.12, -bh * 0.55, bl * 0.12, bh * 1.1);
        ctx.fillRect(bl * 0.1, -bh * 0.48, bl * 0.1, bh * 0.96);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(bl * 0.25, -bh * 0.22, r * 0.14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(bl * 0.28, -bh * 0.22, r * 0.07, 0, Math.PI * 2); ctx.fill();
    }

    function drawTunaShape(bl, bh, r) {
        const g = ctx.createLinearGradient(0, -bh, 0, bh);
        g.addColorStop(0, '#1a4477');
        g.addColorStop(0.5, '#4488cc');
        g.addColorStop(1, '#d0eaff');
        ctx.beginPath();
